apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/CCI-MOC/oac-apps.git
    targetRevision: main
    path: applicationsets
    helm:
      parameters:
        # This value flows into the applicationsets chart at sync time; the
        # `required` guard fails the render if hubName is unset or empty.
        - name: hubName
          value: {{ required "hubName must be set" .Values.hubName | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
