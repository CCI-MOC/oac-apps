name: helm

on:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: |
          helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
      - run: |
          ./scripts/helm-update-deps.sh
      - run: |
          ./scripts/helm-lint-all.sh
      - run: |
          ./scripts/helm-unittest-all.sh
      - run: |
          uv run scripts/check_hub_policy_compliance.py
