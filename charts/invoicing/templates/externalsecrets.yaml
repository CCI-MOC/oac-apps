apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoicing-bucket
  namespace: {{ $.Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: invoicing-bucket
  data:
    - secretKey: b2-key-id
      remoteRef:
        key: {{ required "s3RemoteKey is required" .Values.s3RemoteKey }}
        property: application_key_id
    - secretKey: b2-app-key
      remoteRef:
        key: {{ .Values.s3RemoteKey }}
        property: application_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoicing-keycloak
  namespace: {{ $.Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: invoicing-keycloak
  data:
    - secretKey: keycloak-client-id
      remoteRef:
        key: {{ required "keycloakRemoteKey is required" .Values.keycloakRemoteKey }}
        property: client-id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: {{ .Values.keycloakRemoteKey }}
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoicing-gh-deploykey
  namespace: {{ $.Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: invoicing-gh-deploykey
  data:
    - secretKey: gh-deploy-key
      remoteRef:
        key: {{ required "ghRemoteKey is required" .Values.ghRemoteKey }}
        property: deploy-key
---
