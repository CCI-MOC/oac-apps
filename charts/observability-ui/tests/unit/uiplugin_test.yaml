suite: observability-ui
templates:
  - templates/uiplugin.yaml

tests:
  - it: renders a single Monitoring UIPlugin
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: UIPlugin
      - equal:
          path: spec.type
          value: Monitoring

  # The CRD rejects any other name for a Monitoring plugin, so this is fixed
  # rather than configurable.
  - it: is named monitoring
    asserts:
      - equal:
          path: metadata.name
          value: monitoring

  # Perses is what puts Observe > Dashboards into the console. The operator
  # creates the instance from this flag, there is no separate Perses resource.
  - it: enables Perses
    asserts:
      - equal:
          path: spec.monitoring.perses.enabled
          value: true

  # The CRD does not exist yet on a first sync, so the dry run has to be
  # skipped. Note the wave only orders resources inside one Application, and
  # COO is a separate Application, so it does not order the two of them.
  - it: carries the ArgoCD annotations
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  # ACM wiring stays off until MCO exists, so a plain install never points at
  # a Thanos that is not there.
  - it: leaves the ACM block out by default
    asserts:
      - notExists:
          path: spec.monitoring.acm

  - it: wires up ACM when asked
    set:
      acm.enabled: true
      acm.thanosQuerierUrl: https://thanos.example
      acm.alertmanagerUrl: https://alertmanager.example
    asserts:
      - equal:
          path: spec.monitoring.acm.enabled
          value: true
      - equal:
          path: spec.monitoring.acm.thanosQuerier.url
          value: https://thanos.example
      - equal:
          path: spec.monitoring.acm.alertmanager.url
          value: https://alertmanager.example
