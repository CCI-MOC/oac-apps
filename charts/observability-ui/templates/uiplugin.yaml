apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: {{ .Values.uiPlugin.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Monitoring
  monitoring:
    perses:
      enabled: {{ .Values.perses.enabled }}
    {{- if .Values.acm.enabled }}
    acm:
      enabled: true
      thanosQuerier:
        url: {{ required "acm.thanosQuerierUrl is required when acm.enabled is true" .Values.acm.thanosQuerierUrl | quote }}
      alertmanager:
        url: {{ required "acm.alertmanagerUrl is required when acm.enabled is true" .Values.acm.alertmanagerUrl | quote }}
    {{- end }}
    incidents:
      enabled: {{ .Values.incidents.enabled }}
    clusterHealthAnalyzer:
      enabled: {{ .Values.clusterHealthAnalyzer.enabled }}
