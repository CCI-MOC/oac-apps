group: "open-accelerator-admins"

# A list of additional ClusterRoles that will
# aggregate to cluster-reader.
clusterRoles: []

# Bind cluster-monitoring-view to the group as well, so its members can query
# metrics from the Perses dashboards. Turning this off does not affect
# Observe > Metrics, which uses a different authorization path.
clusterMonitoringView: true
