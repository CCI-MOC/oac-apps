apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ required "group is required" .Values.group }}-impersonate-admin
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["system:admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ required "group is required" .Values.group }}-impersonate-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ required "group is required" .Values.group }}-impersonate-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ required "group is required" .Values.group }}
