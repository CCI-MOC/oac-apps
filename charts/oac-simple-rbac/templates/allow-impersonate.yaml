{{- $group := required "group is required" .Values.group }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $group }}-impersonate-admin
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["system:admin"]

  # This is necessary to work around an OpenShift console bug.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["system:admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $group }}-impersonate-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $group }}-impersonate-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $group }}
