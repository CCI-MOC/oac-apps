{{- $group := required "group is required" .Values.group }}
{{- if .Values.clusterMonitoringView }}
# Lets the people in this group query metrics from the Perses dashboards
# the Cluster Observability Operator installs. Perses goes through the
# prometheuses/api subresource. The other roles that grant it are operator
# and component roles, cluster-monitoring-view is the one meant for people,
# so without this the dashboards render but every panel says Forbidden.
#
# Observe > Metrics is unaffected, it goes through the thanos-querier and
# its own namespace-based authorization, which cluster-reader covers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $group }}-cluster-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $group }}
{{- end }}
