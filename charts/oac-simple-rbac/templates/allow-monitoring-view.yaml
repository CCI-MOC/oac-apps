{{- $group := required "group is required" .Values.group }}
{{- if .Values.clusterMonitoringView }}
# Reading metrics from the console, and from the Perses dashboards the
# Cluster Observability Operator installs, needs the prometheuses/api
# subresource. cluster-reader does not cover it, so without this the
# dashboards render but cannot query anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $group }}-cluster-monitoring-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $group }}
{{- end }}
