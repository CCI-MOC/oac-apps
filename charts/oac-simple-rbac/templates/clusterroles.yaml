{{- $group := required "group is required" .Values.group }}
{{ range .Values.clusterRoles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-cluster-reader: "true"
  name: {{ $group }}-{{ .name }}
rules:
{{ toYaml .rules }}
---
{{ end }}
