{{- if .Values.routeAnnotations.enabled }}
{{- $ra := .Values.routeAnnotations }}
{{- $ns := $ra.policyNamespace }}
{{- /*
  ACM policies, on the hub only: rate limits on every route outside
  openshift-* and kube-* on the listed clusters, and per-cluster IP
  allowlists. musthave merges the annotations into routes their operators
  own (HyperShift, ACS, multicluster-engine), and enforce puts them back
  if an operator drops them.
*/}}
{{- $policies := list }}
{{- if $ra.rateLimit.clusters }}
{{- $policies = append $policies (dict "name" "route-rate-limits" "clusters" $ra.rateLimit.clusters "annotations" (dict "haproxy.router.openshift.io/rate-limit-connections" "true" "haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp" (toString $ra.rateLimit.concurrentTcp) "haproxy.router.openshift.io/rate-limit-connections.rate-tcp" (toString $ra.rateLimit.rateTcp)) "control" "SC-5" "what" "the rate-limit annotations") }}
{{- end }}
{{- range $group, $a := $ra.ipAllowlists }}
{{- $policies = append $policies (dict "name" (printf "route-allowlist-%s" $group) "clusters" $a.clusters "annotations" (dict "haproxy.router.openshift.io/ip_whitelist" $a.cidrs) "control" "SC-7" "what" (printf "the %s IP allowlist" $group)) }}
{{- end }}
{{- range $policies }}
{{- if gt (add (len $ns) (len .name)) 62 }}
{{- fail (printf "routeAnnotations: %s/%s is over ACM's 62 characters for namespace plus policy name; shorten the group name" $ns .name) }}
{{- end }}
{{- end }}
{{- range $policies }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: {{ .control }}
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .name }}
        spec:
          remediationAction: enforce
          severity: medium
          # ACM's default message names every route it matched; on a hub
          # with hosted clusters that is over the 1024 characters an event
          # allows, so the compliance events were rejected. Count routes
          # when compliant; name only the failing ones when not.
          customMessage:
            compliant: >-
              {{`{{ len .Policy.status.relatedObjects }}`}} routes outside
              openshift-* and kube-* have {{ .what }}
            noncompliant: >-
              routes without {{ .what }}:{{`{{ range .Policy.status.relatedObjects }}{{ if eq .compliant "NonCompliant" }}
              {{ .object.metadata.namespace }}/{{ .object.metadata.name }}{{ end }}{{ end }}`}}
          object-templates-raw: |
            {{`{{- range (lookup "route.openshift.io/v1" "Route" "" "").items }}`}}
            {{`{{- if not (or (hasPrefix "openshift" .metadata.namespace) (hasPrefix "kube-" .metadata.namespace)) }}`}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: {{`{{ .metadata.name }}`}}
                  namespace: {{`{{ .metadata.namespace }}`}}
                  annotations:
                    {{- range $k, $v := .annotations }}
                    {{ $k }}: {{ $v | quote }}
                    {{- end }}
            {{`{{- end }}`}}
            {{`{{- end }}`}}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
spec:
  clusterSets:
    - {{ $ra.clusterSet }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: {{ toJson .clusters }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: {{ .name }}
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: {{ .name }}
{{- end }}
{{- end }}
