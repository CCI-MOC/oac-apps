{{- if .Values.apiServerAudit.enabled }}
# A cluster singleton: server-side apply so only the audit profile is
# owned. cluster-certificates sets servingCerts on the same object the same
# way. Turned off, Argo deletes the object and the CVO recreates it with
# defaults; other Applications' fields (cluster-certificates' servingCerts)
# return when they next sync.
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  audit:
    profile: {{ .Values.apiServerAudit.profile }}
{{- end }}
