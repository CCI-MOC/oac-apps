{{- if and .Values.imageConfig.enabled .Values.imageConfig.samplesRegistry }}
# A cluster singleton owned by the samples operator: server-side apply so
# only samplesRegistry is owned, and never pruned.
apiVersion: samples.operator.openshift.io/v1
kind: Config
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
spec:
  samplesRegistry: {{ .Values.imageConfig.samplesRegistry | quote }}
{{- end }}
