{{- range .Values.addressPools }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ required "addressPools[].name is required" .name }}
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  addresses:
{{ required "addressPools[].addresses is required" .addresses | toYaml | indent 4 }}
{{- if .serviceAllocation }}
  serviceAllocation:
{{ .serviceAllocation | toYaml | indent 4 }}
{{- end }}
{{- end }}
