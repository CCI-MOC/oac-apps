suite: Capacity dashboards
templates:
  - templates/perses-dashboard-mco-capacity.yaml
  - templates/console-dashboard-mco-capacity.yaml

tests:
  - it: should render both routes by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/perses-dashboard-mco-capacity.yaml
      - hasDocuments:
          count: 1
        template: templates/console-dashboard-mco-capacity.yaml

  - it: should render nothing when both are off
    set:
      capacityDashboard.perses.enabled: false
      capacityDashboard.console.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/perses-dashboard-mco-capacity.yaml
      - hasDocuments:
          count: 0
        template: templates/console-dashboard-mco-capacity.yaml

  # Without this label the console does not find the dashboard.
  - it: should label the console dashboard so the console picks it up
    template: templates/console-dashboard-mco-capacity.yaml
    asserts:
      - equal:
          path: metadata.labels["console.openshift.io/dashboard"]
          value: "true"
      - equal:
          path: metadata.namespace
          value: openshift-config-managed

  # Getting the acm_ prefix on the wrong side gives empty panels.
  - it: should query the acm prefixed metric with the unprefixed job label
    template: templates/perses-dashboard-mco-capacity.yaml
    asserts:
      - matchRegex:
          path: spec.config.panels.series.spec.queries[0].spec.plugin.spec.query
          pattern: 'acm_prometheus_tsdb_head_series\{job="observability-thanos-receive-default"\}'

  - it: should sit in the namespace the operator watches
    template: templates/perses-dashboard-mco-capacity.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: openshift-cluster-observability-operator

  # A cluster without COO has no PersesDashboard CRD yet; without these the
  # first sync fails before the operator is installed.
  - it: should wait for the operator and skip the dry run until its CRD exists
    template: templates/perses-dashboard-mco-capacity.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true
