suite: user-workload-monitoring
templates:
  - templates/enable.yaml
  - templates/tuning.yaml

tests:
  - it: renders both config maps, the switch and the tuning
    asserts:
      - hasDocuments:
          count: 1

  # Red Hat keeps these two apart on purpose. This one is the enable switch and
  # belongs to the platform stack; putting retention or storage here does
  # nothing, because the workload prometheus does not read it.
  - it: turns user workload monitoring on, in the platform config map
    template: templates/enable.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: cluster-monitoring-config
      - equal:
          path: metadata.namespace
          value: openshift-monitoring
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'enableUserWorkload: true'

  # Saving cluster-monitoring-config redeploys the platform monitoring pods, and
  # the object may already exist and be owned by someone else. Server side apply
  # keeps ArgoCD from claiming the whole object.
  - it: applies the platform config map server side
    template: templates/enable.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: ServerSideApply=true

  # Retention belongs here and nowhere else. Two levels: time and size, and
  # whichever is reached first wins.
  - it: puts retention on the workload prometheus, not on the platform one
    template: templates/tuning.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: user-workload-monitoring-config
      - equal:
          path: metadata.namespace
          value: openshift-user-workload-monitoring
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'retention: 15d'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'retentionSize: 18GiB'

  # Off by default on purpose. Turning it on makes the cluster monitoring
  # operator rebuild the platform stateful set, which drops the history that
  # instance holds, so it is a decision per cluster rather than a chart default.
  - it: leaves the platform prometheus alone unless a cluster asks for it
    template: templates/enable.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: prometheusK8s
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: volumeClaimTemplate

  # The retention is the point, but the volume is what makes it real: the
  # default install carries retention: 15d on emptyDir and loses everything
  # when the pod is recreated.
  - it: gives the platform prometheus retention and a volume when switched on
    template: templates/enable.yaml
    set:
      platform:
        enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^prometheusK8s:'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'retention: 15d'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'retentionSize: 40GiB'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'storage: 50Gi'
      # The switch has to survive, it is what the other config map depends on.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'enableUserWorkload: true'

  - it: leaves the platform storage class to the cluster by default
    template: templates/enable.yaml
    set:
      platform:
        enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: storageClassName

  # Naming a storage class here would pin one cluster's fact into a chart that
  # runs on several. Leaving the key out uses the cluster default, which OCP
  # documents: "The default storage class can be used and storageClassName can
  # be omitted in the spec" (4.21 Storage). The key is rendered only when a
  # value is set, so an empty string never reaches the cluster.
  - it: leaves the storage class to the cluster by default
    template: templates/tuning.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: storageClassName

  - it: still allows naming one where the default is wrong
    template: templates/tuning.yaml
    set:
      prometheus:
        volume:
          storageClassName: some-sc
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'storageClassName: some-sc'
