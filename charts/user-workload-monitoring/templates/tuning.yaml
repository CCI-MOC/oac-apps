{{- if .Values.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  annotations:
    # The cluster monitoring operator creates this namespace once the switch in
    # the other config map is set, so on a first sync there is nowhere to put
    # this yet.
    argocd.argoproj.io/sync-options: ServerSideApply=true
    argocd.argoproj.io/sync-wave: "1"
data:
  config.yaml: |
    prometheus:
      retention: {{ .Values.prometheus.retention }}
      retentionSize: {{ .Values.prometheus.retentionSize }}
      volumeClaimTemplate:
        spec:
          {{- with .Values.prometheus.volume.storageClassName }}
          storageClassName: {{ . }}
          {{- end }}
          resources:
            requests:
              storage: {{ .Values.prometheus.volume.size }}
{{- end }}
