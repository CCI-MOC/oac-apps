# The enable switch, in the platform's own config map. Nothing else belongs
# here: the workload prometheus does not read this object, so retention or
# storage set here would silently do nothing.
enable: true

# Tuning for the workload prometheus, which is a different config map in a
# different namespace. Red Hat keeps the two apart on purpose.
prometheus:
  # Two independent limits. Whichever is reached first wins, so the size cap is
  # what actually protects the volume when a busy namespace outruns the window.
  retention: 15d
  retentionSize: 18GiB
  volume:
    # Under the size cap above, so prometheus stops before the volume does.
    size: 20Gi
    # Default on this cluster, Pure Flashblade NFS, and it allows expansion.
    storageClassName: pure-fb-nfsv4
