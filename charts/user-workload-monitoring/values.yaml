# The switch that turns user workload monitoring on, in the config map the
# cluster monitoring operator reads. Note what this object is not: the workload
# prometheus never reads it, so workload retention set here would silently do
# nothing. The platform block below does belong here, it configures the
# prometheus that reads this very object.
enable: true

# Tuning for the platform prometheus, the one in openshift-monitoring. On by
# default: the install mounts emptyDir there, so without this a cluster that
# has no values file keeps its history only as long as the pod lives, and Argo
# still shows it healthy. Switching it on rebuilds the stateful set once, which
# drops what emptyDir holds; that history goes with the next restart anyway. A
# cluster that must not have a volume sets enabled: false.
#
# At about 4,700 bytes per series and day this holds 15 days up to roughly
# 600,000 series. A hub carries more and raises both in
# values/<hub>/local-cluster/, once it has run long enough to be measured.
platform:
  enabled: true
  retention: 15d
  # Two independent limits, as below. The size cap is what protects the volume.
  retentionSize: 40GiB
  volume:
    size: 50Gi
    # Same reasoning as for the workload volume below.
    storageClassName: ""

# Tuning for the workload prometheus, which is a different config map in a
# different namespace. The two are kept apart on purpose.
prometheus:
  # Two independent limits. Whichever is reached first wins, so the size cap is
  # what actually protects the volume when a busy namespace outruns the window.
  retention: 15d
  retentionSize: 18GiB
  volume:
    # Under the size cap above, so prometheus stops before the volume does.
    size: 20Gi
    # Left unset on purpose, so the cluster's default storage class is used:
    # "The default storage class can be used and storageClassName can be
    # omitted in the spec", OCP 4.21 Storage, Using Container Storage Interface.
    # Naming one here would pin a per cluster fact into a chart that runs on
    # several. Set it in the values for a cluster whose default is wrong, which
    # is where facts about a cluster belong.
    storageClassName: ""

# The stock volume alert fires below 3 percent free, too late to save a retention
# window. The day threshold is derived from each retention above, so it follows
# a cluster that sets something other than 15d.
retentionAlerts:
  enabled: true
  volumeFullRatio: 0.85
