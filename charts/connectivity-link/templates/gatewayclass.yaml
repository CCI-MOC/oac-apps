{{- if .Values.gatewayClass.create }}
{{- /*
Wave -1, before the operator: the Kuadrant operator looks for a gateway
provider (Istio) only when it starts. If istiod arrives after it, Kuadrant
stays "MissingDependency" until the operator pod is deleted (a rollout restart
does not work: OLM reverts it).
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  controllerName: openshift.io/gateway-controller/v1
{{- end }}
