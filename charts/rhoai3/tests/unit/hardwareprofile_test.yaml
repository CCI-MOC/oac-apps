suite: HardwareProfile
templates:
  - templates/hardwareprofile.yaml
set:
  enabled: true

tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render opted-in profiles at v1
    set:
      enabledHardwareProfiles:
        - nvidia-h100-gpu
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HardwareProfile
      - isAPIVersion:
          of: infrastructure.opendatahub.io/v1
      - equal:
          path: metadata.name
          value: nvidia-h100-gpu

  - it: should render both when a cluster has both GPUs
    set:
      enabledHardwareProfiles:
        - nvidia-h100-gpu
        - nvidia-a100-gpu
    asserts:
      - hasDocuments:
          count: 2

  # The dashboard only lists profiles from the applications namespace.
  - it: should be created in the applications namespace
    set:
      enabledHardwareProfiles:
        - nvidia-h100-gpu
    asserts:
      - equal:
          path: metadata.namespace
          value: redhat-ods-applications

  - it: should tolerate only its own GPU model
    set:
      enabledHardwareProfiles:
        - nvidia-h100-gpu
    asserts:
      - equal:
          path: spec.scheduling.node.tolerations[0].value
          value: NVIDIA-H100-80GB-HBM3

  - it: should mark the profile enabled for the dashboard
    set:
      enabledHardwareProfiles:
        - nvidia-h100-gpu
    asserts:
      - equal:
          path: metadata.annotations["opendatahub.io/disabled"]
          value: "false"
