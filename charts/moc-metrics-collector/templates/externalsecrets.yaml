{{- range .Values.collectors }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "collectors[].clusterName is required" .clusterName }}-metrics-bucket
  namespace: {{ $.Values.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .clusterName }}-metrics-bucket
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ required "collectors[].s3RemoteKey is required" .s3RemoteKey }}
        property: application_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: {{ .s3RemoteKey }}
        property: application_key
{{- end }}
