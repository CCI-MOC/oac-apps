suite: Custom metrics allowlist
templates:
  - templates/metrics-custom-allowlist.yaml

tests:
  - it: should render on the hub by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: observability-metrics-custom-allowlist
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability

  - it: should render nothing when disabled
    set:
      customAllowlist.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The user workload key would collect nothing here.
  - it: should use the platform key
    asserts:
      - exists:
          path: data["metrics_list.yaml"]
      - notExists:
          path: data["uwl_metrics_list.yaml"]

  - it: should list the workload metrics the platform list leaves out
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- kube_pod_container_status_restarts_total'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- kube_pod_init_container_status_restarts_total'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- kube_namespace_status_phase'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- kube_pod_deletion_timestamp'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- kubelet_volume_stats_used_bytes'

  # A selector rather than a name, because vllm names its metrics per model.
  - it: should carry the vllm selector in matches, not in names
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: 'matches:'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: 'vllm'

  - it: should leave matches out when nothing sets it
    set:
      customAllowlist.matches: null
    asserts:
      - notMatchRegex:
          path: data["metrics_list.yaml"]
          pattern: 'matches:'

  - it: should list the three metrics the GPU panels need
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- DCGM_FI_DEV_GPU_UTIL'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- DCGM_FI_DEV_FB_USED'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- DCGM_FI_DEV_GPU_TEMP'

  - it: should list the memory error counters
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- node_edac_correctable_errors_total'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- node_edac_uncorrectable_errors_total'

  # Unfiltered these are 93 temperature and 218 filesystem series per node.
  - it: should collect temperatures and disk state only for packages and disks
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '__name__=~"\^node_hwmon_temp_\(crit_\)\?celsius\$",sensor="temp1"'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '__name__=~"\^node_filesystem_\(readonly\|device_error\)\$",fstype=~"ext4\|xfs"'
      - notMatchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- node_(hwmon|filesystem)_'

  - it: should collect every DCGM metric through a selector
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '__name__=~"\^DCGM_\.\*"'

  - it: should list the GPU operator node counts
    asserts:
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- gpu_operator_node_device_plugin_devices_total'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- gpu_operator_nvidia_pci_devices_total'
      - matchRegex:
          path: data["metrics_list.yaml"]
          pattern: '- gpu_operator_gpu_nodes_total'
