{{- if .Values.hardwareDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hub-hardware
  namespace: {{ .Values.namespace }}
  labels:
    # The MCO dashboard loader picks up ConfigMaps by this label.
    grafana-custom-dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  hub-hardware.json: {{ .Files.Get "dashboards/hub-hardware.json" | quote }}
{{- end }}
