{{- if .Values.customRules.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-ruler-custom-rules
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  custom_rules.yaml: |
    groups:

      - name: openshift-storage
        rules:

        - alert: CustomStoragePersistentVolumeFillingUp
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} PersistentVolume is filling up"
            description: >-
              The PersistentVolume claimed by {{ "{{ $labels.persistentvolumeclaim }}" }}
              in Namespace {{ "{{ $labels.namespace }}" }} is only
              {{ "{{ $value | humanizePercentage }}" }} free.
          expr: >-
            kubelet_volume_stats_available_bytes{
              persistentvolumeclaim!~"wal-logging-loki-ingester-.*",
              namespace!~"virt-test",
              persistentvolumeclaim!~"example-instance1-tfxn-pgdata"
            } / kubelet_volume_stats_capacity_bytes < 0.10
          for: 1m
          labels:
            severity: critical

        - alert: CustomStoragePersistentVolumeClaimPending
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} PersistentVolumeClaim is pending with pod waiting"
            description: >-
              PersistentVolumeClaim {{ "{{ $labels.persistentvolumeclaim }}" }}
              in Namespace {{ "{{ $labels.namespace }}" }} on cluster {{ "{{ $labels.cluster }}" }}
              has been in Pending state for more than 5 minutes and a pod is waiting for it.
          expr: >-
            kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
            and on(namespace, persistentvolumeclaim)
            kube_pod_spec_volumes_persistentvolumeclaims_info
          for: 5m
          labels:
            severity: warning

      - name: ceph-storage
        rules:

        - alert: CustomCephStorageFillingUp
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} Ceph Storage is filling up"
            description: >-
              The {{ "{{ $labels.cluster }}" }} {{ "{{ $labels.pool }}" }} pool Ceph Storage
              is {{ "{{ $value | humanizePercentage }}" }} full.
          expr: >-
            (ceph_pool_raw_used_bytes{pool=~"(nerc_ocp_prod_.*)|(nerc_ocp_infra_.*)"})
            / on (cluster, namespace, pool)
            (ceph_pool_quota_max_bytes{pool=~"(nerc_ocp_prod_.*)|(nerc_ocp_infra_.*)"}) > 0.80
          for: 1m
          labels:
            severity: warning

        - alert: CustomCephStorageFillingUpPredicted
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} Ceph Storage is filling up and is predicted
              to run out of space in 90 days
            description: >-
              The {{ "{{ $labels.cluster }}" }} {{ "{{ $labels.pool }}" }} pool Ceph Storage
              is predicted to run out of space in 90 days.
          expr: >-
            ceph_pool_quota_max_bytes{pool=~"(nerc_ocp_prod_.*)|(nerc_ocp_infra_.*)"}
            - on (cluster, namespace, pool, pod, tenant_id)
            predict_linear(ceph_pool_used_bytes{pool=~"(nerc_ocp_prod_.*)|(nerc_ocp_infra_.*)"}[90d], 90 * 24 * 60 * 60) <= 0
          for: 1h
          labels:
            severity: warning

      - name: network
        rules:

        - alert: CustomNetworkInterfaceErrors
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} {{ "{{ $labels.instance }}" }}:
              high TX error count on {{ "{{ $labels.device }}" }}
            description: >-
              TX errors > 50 over 15m (persisting 10m). Occasional single errors are ignored.
              {{ "{{ $value }}" }} errors observed.
          expr: |
            sum by (cluster, instance, device) (
              increase(node_network_transmit_errs_total{device!~"lo|veth.*|cali.*|cni.*|flannel.*|tunl.*|docker.*|br.*|vxlan.*"}[15m])
            ) > 50
          for: 10m
          labels:
            severity: warning

      - name: ipmi
        rules:

        - alert: CustomIpmiServerPowerSupplyFailure
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} Server power supply failure"
            description: >-
              {{ "{{ $labels.cluster }}" }} on instance {{ "{{ $labels.instance }}" }}
              has a non-zero power supply state {{ "{{ $value }}" }}.
          expr: ipmi_power_state{} > 0
          for: 10m
          labels:
            severity: warning

        - alert: CustomIpmiChassisPowerSupplyFailure
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} Chassis power supply failure"
            description: >-
              {{ "{{ $labels.cluster }}" }} on instance {{ "{{ $labels.instance }}" }}
              chassis power is off.
          expr: ipmi_chassis_power_state{} == 0
          for: 10m
          labels:
            severity: warning

        - alert: CustomIpmiServerMemoryError
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} Server memory error"
            description: >-
              {{ "{{ $labels.cluster }}" }} on instance {{ "{{ $labels.instance }}" }}
              has a non-zero memory state {{ "{{ $value }}" }}.
          expr: ipmi_sensor_state{type="Memory"} > 0
          for: 10m
          labels:
            severity: warning

        - alert: CustomIpmiLocalDiskError
          annotations:
            summary: "{{ "{{ $labels.cluster }}" }} Local disk error"
            description: >-
              {{ "{{ $labels.cluster }}" }} on instance {{ "{{ $labels.instance }}" }}
              has a non-zero drive slot state {{ "{{ $value }}" }}.
          expr: ipmi_sensor_state{type="Drive Slot"} > 0
          for: 10m
          labels:
            severity: warning

        - alert: CustomIpmiInternalCoolingFanError
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} Internal cooling fan error on
              {{ "{{ $labels.instance }}" }}
            description: >-
              {{ "{{ $labels.cluster }}" }} on instance {{ "{{ $labels.instance }}" }}
              has a non-zero fan speed state {{ "{{ $value }}" }}.
          expr: ipmi_fan_speed_state{} > 0
          for: 10m
          labels:
            severity: warning

      - name: node
        rules:

        - alert: CustomNodeNotReady
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} node {{ "{{ $labels.node }}" }} not in ready status
            description: >-
              {{ "{{ $labels.cluster }}" }} node {{ "{{ $labels.node }}" }} is not in ready status.
          expr: kube_node_status_condition{condition="Ready", status!="true"} > 0
          for: 5m
          labels:
            severity: warning

        - alert: CustomNodeLowAvailableMemory
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} node {{ "{{ $labels.instance }}" }} low on memory
            description: >-
              {{ "{{ $labels.cluster }}" }} node {{ "{{ $labels.instance }}" }} is low on memory.
          expr: node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes < 0.2
          for: 1m
          labels:
            severity: warning

      - name: machine-config
        rules:

        - alert: CustomBlockedMachineConfigUpdate
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} Machine Config Pool {{ "{{ $labels.pool }}" }}
              stuck updating for >30min
            description: >-
              Machine Config Pool {{ "{{ $labels.pool }}" }} in cluster {{ "{{ $labels.cluster }}" }}
              has been updating for more than 30 minutes. This could indicate a stuck update
              that might require manual intervention.
          expr: ((mco_machine_count - mco_updated_machine_count) > 0 and mco_unavailable_machine_count > 0) > 0
          for: 30m
          labels:
            severity: critical

        - alert: CustomMachineConfigHighUnavailable
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} Machine Config Pool {{ "{{ $labels.pool }}" }}
              has unavailable machines for >15min
            description: >-
              Machine Config Pool {{ "{{ $labels.pool }}" }} in cluster {{ "{{ $labels.cluster }}" }}
              has {{ "{{ $value }}" }} unavailable machines for more than 15 minutes.
              This indicates machines are not ready and might require investigation.
          expr: mco_unavailable_machine_count > 0
          for: 15m
          labels:
            severity: critical

        - alert: CustomMachineConfigPoolDegraded
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} Machine Config Pool {{ "{{ $labels.pool }}" }}
              is degraded
            description: >-
              Machine Config Pool {{ "{{ $labels.pool }}" }} in cluster {{ "{{ $labels.cluster }}" }}
              has {{ "{{ $value }}" }} degraded machines. This indicates the pool is in a degraded
              state and requires immediate attention.
          expr: mco_degraded_machine_count > 0
          for: 5m
          labels:
            severity: critical

      - name: gpu-activity-1h
        interval: 1h
        rules:
        - record: gpu:active_hourly:raw
          expr: max_over_time(DCGM_FI_DEV_GPU_UTIL[1h])

        - record: gpu:active_hourly:bool
          expr: gpu:active_hourly:raw > bool 0

        - record: gpu:active_hourly:bool_per_node
          expr: max by (cluster, instance, Hostname) (gpu:active_hourly:raw) > bool 0

        - record: gpu:active_hourly:count_per_node
          expr: count by (cluster, instance, Hostname) (gpu:active_hourly:raw > 0)

        - record: gpu:active_hourly:count_per_cluster
          expr: count by (cluster) (gpu:active_hourly:raw > 0)

      - name: cronjob-monitoring
        rules:

        - alert: CustomCronJobNotRunningRecently
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} CronJob {{ "{{ $labels.cronjob }}" }}
              hasn't been scheduled recently
            description: >-
              CronJob {{ "{{ $labels.cronjob }}" }} in namespace {{ "{{ $labels.namespace }}" }}
              on cluster {{ "{{ $labels.cluster }}" }} hasn't been scheduled for
              {{ "{{ $value | humanizeDuration }}" }}.
              This could indicate the CronJob controller is not triggering the schedule as expected.
          expr: (time() - kube_cronjob_status_last_schedule_time) > (6 * 3600) and kube_cronjob_spec_suspend == 0
          for: 10m
          labels:
            severity: critical

        - alert: CustomCronJobFailed
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} CronJob {{ "{{ $labels.owner_name }}" }} job failed
            description: >-
              Job {{ "{{ $labels.job_name }}" }} (owned by CronJob {{ "{{ $labels.owner_name }}" }})
              in namespace {{ "{{ $labels.namespace }}" }} on cluster {{ "{{ $labels.cluster }}" }}
              has failed. Failed pods: {{ "{{ $value }}" }}.
              Jobs that eventually succeeded after retries are excluded.
              Check pod logs for error details.
          expr: |
            (
              kube_job_status_failed > 0
            ) * on(cluster, namespace, job_name) group_left(owner_name)
              kube_job_owner{owner_kind="CronJob"}
            and on(cluster, namespace, job_name)
              (kube_job_status_succeeded == 0)
          for: 5m
          labels:
            severity: critical

        - alert: CustomCronJobMissedSchedule
          annotations:
            summary: >-
              {{ "{{ $labels.cluster }}" }} CronJob {{ "{{ $labels.cronjob }}" }}
              missed its schedule
            description: >-
              CronJob {{ "{{ $labels.cronjob }}" }} in namespace {{ "{{ $labels.namespace }}" }}
              on cluster {{ "{{ $labels.cluster }}" }} has not been scheduled in over 2 hours
              despite not being suspended.
          expr: time() - kube_cronjob_status_last_schedule_time > 2 * 60 * 60 and kube_cronjob_spec_suspend == 0
          for: 10m
          labels:
            severity: warning

      - name: IBM autopilot
        rules:

        - alert: LowPCIeBandwidth
          annotations:
            description: >-
              GPU device {{ "{{ $labels.deviceid }}" }} on node {{ "{{ $labels.node }}" }}
              has a PCIE bandwidth of {{ "{{ $value }}" }}.
            summary: GPU with a PCIe bandwidth of 4 or less
          expr: |
            sum (autopilot_health_checks{health="pciebw"}<=4) by (node, deviceid, value) > 0
          for: 1m
          labels:
            severity: warning
            alert: autopilot

        - alert: DCGMLevel1Errors
          annotations:
            description: >-
              GPUs on node {{ "{{ $labels.node }}" }} have DCGM Level 1 failures.
            summary: GPUs have DCGM failures
          expr: |
            sum (autopilot_health_checks{health="dcgm"}==1) by (node)
          for: 1m
          labels:
            severity: warning
            alert: autopilot

        - alert: GPUPowerSlowdownEnabled
          annotations:
            description: >-
              GPU device {{ "{{ $labels.deviceid }}" }} on node {{ "{{ $labels.node }}" }}
              has power slowdown enabled.
            summary: A GPU has power slowdown enabled.
          expr: |
            sum (autopilot_health_checks{health="power-slowdown"}==1) by (node, deviceid)
          for: 1m
          labels:
            severity: warning
            alert: autopilot

        - alert: RemappedRowsActive
          annotations:
            description: >-
              GPU device {{ "{{ $labels.deviceid }}" }} on node {{ "{{ $labels.node }}" }}
              has incorrect remapped rows in memory.
            summary: A GPU device has incorrect remapped rows.
          expr: |
            sum (autopilot_health_checks{health="remapped"}==1) by (node, deviceid)
          for: 1m
          labels:
            severity: warning
            alert: autopilot

        - alert: DCGMLevel3Errors
          annotations:
            description: >-
              A node reported errors after running DCGM level 3 - check health of nodes.
            summary: "Node {{ "{{ $labels.node }}" }} has GPU errors."
          expr: |
            kube_node_labels{label_autopilot_ibm_com_dcgm_level_3=~".*ERR.*"} and kube_node_labels{label_autopilot_ibm_com_dcgm_level_3!~""}
          for: 1m
          labels:
            severity: critical
            alert: autopilot

        - alert: PingFailures
          annotations:
            description: >-
              IP {{ "{{ $labels.deviceid }}" }} on node {{ "{{ $labels.node }}" }} is unreachable.
            summary: Node has unreachable IPs.
          expr: |
            sum (autopilot_health_checks{health="ping"}==1) by (deviceid)
          for: 10m
          labels:
            severity: critical
            alert: autopilot

        - alert: PVCAlert
          annotations:
            description: >-
              PVC creation by Autopilot on node {{ "{{ $labels.node }}" }} failed.
            summary: PVC cannot be created.
          expr: |
            sum (autopilot_health_checks{health="pvc"}==1) by (node)
          for: 1m
          labels:
            severity: critical
            alert: autopilot

        - alert: GPUNodeHealth
          annotations:
            description: >-
              Node {{ "{{ $labels.node }}" }} reported errors after running Autopilot's
              periodic health checks.
            summary: "Node {{ "{{ $labels.node }}" }} has errors."
          expr: |
            kube_node_labels{label_autopilot_ibm_com_gpuhealth=~".*ERR.*"} and kube_node_labels{label_autopilot_ibm_com_gpuhealth!~""}
          for: 1m
          labels:
            severity: warning
            alert: autopilot

        - alert: AutopilotPodsFailing
          annotations:
            description: >-
              Autopilot pod on node {{ "{{ $labels.node }}" }} is failing.
            summary: "Autopilot pod on node {{ "{{ $labels.node }}" }} is failing."
          expr: count(kube_pod_info{} and on(pod) (kube_pod_container_status_waiting{namespace=~"autopilot.*"} > 0)) by (namespace)
          for: 5m
          labels:
            severity: critical
            alert: autopilot
{{- end }}
