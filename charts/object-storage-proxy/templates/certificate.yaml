apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: object-storage-certificate
  namespace: {{ .Values.namespace }}
  annotations:
    # Before the DaemonSet (wave 0), whose pods mount this certificate's
    # secret: Argo waits for wave 0 to be healthy, so a later wave
    # deadlocks on a cluster that does not have the secret yet.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.certificate.secretName }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  issuerRef:
    name: letsencrypt-prod-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.certificate.dnsName }}
