{{- $clusterDomain := required "clusterDomain is required" .Values.clusterDomain }}
{{- include "cluster-config.validate-issuer-kind" . -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.ingress_certificate_name }}
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.certificate.ingress_certificate_name }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  issuerRef:
    name: {{ .Values.certificate.issuer_name }}
    kind: {{ .Values.certificate.issuer_kind }}
  dnsNames:
    - '*.{{ .Values.clusterIngressDomainName | default (printf "apps.%s" $clusterDomain) }}'
