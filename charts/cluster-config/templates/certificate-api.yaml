apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: api-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - 'api.{{ required "clusterDomain is required" .Values.clusterDomain }}'
