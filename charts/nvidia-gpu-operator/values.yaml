namespace: nvidia-gpu-operator
operatorgroup:
  targetNamespaces: true
subscription:
  channel: stable
  name: gpu-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# Knobs on the gpu-cluster-policy ClusterPolicy. The rest of the spec is fixed
# in the template; only the settings that plausibly differ per cluster are here.
clusterPolicy:
  driver:
    # Disable on clusters where the NVIDIA driver is pre-installed on the host.
    enabled: true
    autoUpgrade: true
    maxParallelUpgrades: 1
    maxUnavailable: 25%
  # "single" exposes one MIG profile per node; "mixed" exposes all of them.
  mig:
    strategy: single
  dcgmExporter:
    serviceMonitor:
      enabled: true
  sandboxWorkloads:
    enabled: false
  # Applied to every operator-managed daemonset. Must cover the taints that
  # nfd-operator's NodeFeatureRule puts on GPU nodes, or those nodes end up
  # with the driver stack unschedulable and zero allocatable GPUs.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/gpu.product
      operator: Exists
      effect: NoSchedule
