# Only the GPU Operator's own pods may run under its RuntimeClasses
# (nvidia, nvidia-cdi, nvidia-legacy). Pods that request nvidia.com/gpu
# get their GPUs from the device plugin and do not need one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nvidia-runtimeclass-operator-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        !object.spec.runtimeClassName.startsWith('nvidia')
      message: >-
        RuntimeClasses nvidia* are reserved for the GPU Operator;
        request nvidia.com/gpu instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nvidia-runtimeclass-operator-only
spec:
  policyName: nvidia-runtimeclass-operator-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ .Values.namespace }}]
