apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  operator:
    defaultRuntime: crio
    use_ocp_driver_toolkit: true
    initContainer: {}
  sandboxWorkloads:
    enabled: {{ .Values.clusterPolicy.sandboxWorkloads.enabled }}
    defaultWorkload: container
  driver:
    enabled: {{ .Values.clusterPolicy.driver.enabled }}
    useNvidiaDriverCRD: false
    upgradePolicy:
      autoUpgrade: {{ .Values.clusterPolicy.driver.autoUpgrade }}
      maxParallelUpgrades: {{ .Values.clusterPolicy.driver.maxParallelUpgrades }}
      maxUnavailable: {{ .Values.clusterPolicy.driver.maxUnavailable | quote }}
      drain:
        enable: false
        force: false
        deleteEmptyDir: false
        timeoutSeconds: 300
      podDeletion:
        force: false
        deleteEmptyDir: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    repoConfig:
      configMapName: ""
    certConfig:
      name: ""
    licensingConfig:
      nlsEnabled: true
      configMapName: ""
    virtualTopology:
      config: ""
    kernelModuleConfig:
      name: ""
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: true
    config:
      name: ""
    serviceMonitor:
      enabled: {{ .Values.clusterPolicy.dcgmExporter.serviceMonitor.enabled }}
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
  devicePlugin:
    enabled: true
    config:
      name: ""
      default: ""
    mps:
      root: /run/nvidia/mps
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  mig:
    strategy: {{ .Values.clusterPolicy.mig.strategy }}
  toolkit:
    enabled: true
  validator:
    plugin:
      env:
        - name: WITH_WORKLOAD
          value: "false"
  vgpuManager:
    enabled: false
  vgpuDeviceManager:
    enabled: true
  sandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  gds:
    enabled: false
  gdrcopy:
    enabled: false
