apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    # The DaemonSet is privileged and host-networked.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/description: >-
      Runs the tlshd userspace TLS handshake daemon so NFS mounts can use
      xprtsec=tls. See
      https://github.com/EldritchJS/oac-eldritch-things/blob/main/compliance/NFS-TLS.md
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tlshd
  namespace: {{ .Values.namespace }}
---
# A RoleBinding, not a ClusterRoleBinding: enough to use the privileged SCC
# from this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tlshd-privileged-scc
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: tlshd
    namespace: {{ .Values.namespace }}
{{- $src := include "nfs-tls.caSource" . }}
{{- if eq $src "inline" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-certificates
  namespace: {{ .Values.namespace }}
data:
  ca.crt: |
    {{- .Values.ca.inline | nindent 4 }}
{{- else if eq $src "secret" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nfs-certificates
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.ca.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: nfs-certificates
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.ca.externalSecret.remoteKey }}
        {{- with .Values.ca.externalSecret.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
