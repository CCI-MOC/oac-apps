apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-router-traffic-policy
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hcp-router-traffic-policy
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hcp-router-traffic-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hcp-router-traffic-policy
subjects:
  - kind: ServiceAccount
    name: hcp-router-traffic-policy
    namespace: {{ .Values.namespace }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Patch
metadata:
  name: hcp-router-traffic-policy
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountRef:
    name: hcp-router-traffic-policy
  patches:
    traffic-policy:
      targetObjectRef:
        apiVersion: v1
        kind: Service
        labelSelector:
          matchLabels:
            cluster.x-k8s.io/tenant-service-name: router-default
            cluster.x-k8s.io/tenant-service-namespace: openshift-ingress
          matchExpressions:
            - key: cluster.x-k8s.io/cluster-name
              operator: Exists
      patchType: application/merge-patch+json
      patchTemplate: |
        spec:
          externalTrafficPolicy: Cluster
