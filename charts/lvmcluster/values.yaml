namespace: openshift-storage

operatorgroup:
  targetNamespaces: true

subscription:
  name: lvms-operator
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: stable-4.21

volumegroup:
  name: vg0
  fstype: ext4
  # When true, the generated StorageClass is marked as the cluster default
  # (storageclass.kubernetes.io/is-default-class). Leave false to avoid
  # conflicting with another default StorageClass.
  is_default: false
  forceWipe: false
  pool:
    name: pool0
    sizePercent: 90
    overprovisionRatio: 10
    chunkSize: 128Ki
    chunkSizeCalculationPolicy: Static
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: massopen.cloud/lvmcluster
            operator: Exists
