# Compliance Operator remediation ocp4-moderate-node-master/directory-access-var-log-ocp-audit
# Record Access Events to OpenShift Audit Log Directory
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: Attempts to read the logs should be recorded, suspicious access to
# audit log files could be an indicator of malicious activity on a system.
# Auditing these events could serve as evidence of potential system
# compromise.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F dir=/var/log/openshift-apiserver/ -F perm=r -F auid>=1000 -F auid!=unset -F key=access-audit-trail
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/30-access-var-log-ocp-audit.rules
