# Compliance Operator remediation rhcos4-moderate/audit-rules-privileged-commands-ssh-keysign
# Ensure auditd Collects Information on the Use of Privileged Commands - ssh-keysign
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: Misuse of privileged functions, either intentionally or unintentionally
# by authorized users, or by unauthorized external entities that have
# compromised system accounts, is a serious and ongoing concern and can have
# significant adverse impacts on organizations. Auditing the use of privileged
# functions is one way to detect such misuse and identify the risk from
# insider and advanced persistent threats. Privileged programs are subject to
# escalation-of-privilege attacks, which attempt to subvert their normal role
