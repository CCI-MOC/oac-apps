# Compliance Operator remediation rhcos4-moderate/coredump-disable-storage
# Disable storing core dump
# NIST 800-53: CM-6. Severity: medium.
# Why: A core dump includes a memory image taken at the time the operating
# system terminates an application. The memory image could contain sensitive
# data and is generally useful only for developers or system operators trying
# to debug problems. Enabling core dumps on production systems is not
# recommended, however there may be overriding operational requirements to
# enable advanced debugging. Permitting temporary enablement of core dumps
# during such situations should be reviewed through local needs and policy.
# Generated by scripts/export-remediations.py; do not edit.
