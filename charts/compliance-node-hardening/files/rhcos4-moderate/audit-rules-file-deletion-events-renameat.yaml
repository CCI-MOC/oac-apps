# Compliance Operator remediation rhcos4-moderate/audit-rules-file-deletion-events-renameat
# Ensure auditd Collects File Deletion Events by User - renameat
# NIST 800-53: AU-2(d), AU-12(c), CM-6(a). Severity: medium.
# Why: Auditing file deletions will create an audit trail for files that are
# removed from the system. The audit trail could aid in system
# troubleshooting, as well as, detecting malicious processes that attempt to
# delete log files to conceal their presence.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b32 -S renameat -F auid>=1000 -F auid!=unset -F key=delete
        -a always,exit -F arch=b64 -S renameat -F auid>=1000 -F auid!=unset -F key=delete
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-renameat-file-deletion-events.rules
