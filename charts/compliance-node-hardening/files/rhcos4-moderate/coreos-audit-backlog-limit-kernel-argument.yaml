# Compliance Operator remediation rhcos4-moderate/coreos-audit-backlog-limit-kernel-argument
# Extend Audit Backlog Limit for the Audit Daemon
# NIST 800-53: CM-6(a). Severity: medium.
# Why: audit_backlog_limit sets the queue length for audit events awaiting
# transfer to the audit daemon. Until the audit daemon is up and running, all
# log messages are stored in this queue. If the queue is overrun during boot
# process, the action defined by audit failure flag is taken.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
kernelArguments:
- audit_backlog_limit=8192
