# Compliance Operator remediation rhcos4-moderate/audit-rules-time-clock-settime
# Record Attempts to Alter Time Through clock_settime
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: Arbitrary changes to the system time can be used to obfuscate nefarious
# activities in log files, as well as to confuse network services that are
# highly dependent upon an accurate system time (such as sshd). All changes to
# the system time should be audited.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b64 -S clock_settime -F a0=0x0 -k time-change
        -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -k time-change
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/75-syscall-clock-settime.rules
