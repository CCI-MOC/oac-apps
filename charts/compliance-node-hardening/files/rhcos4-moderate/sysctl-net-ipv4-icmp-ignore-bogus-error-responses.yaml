# Compliance Operator remediation rhcos4-moderate/sysctl-net-ipv4-icmp-ignore-bogus-error-responses
# Enable Kernel Parameter to Ignore Bogus ICMP Error Responses on IPv4 Interfaces
# NIST 800-53: CM-7(a), CM-7(b), SC-5. Severity: unknown.
# Why: Ignoring bogus ICMP error responses reduces log size, although some
# activity would not be logged.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
