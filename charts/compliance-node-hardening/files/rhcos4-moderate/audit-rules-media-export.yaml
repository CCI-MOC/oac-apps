# Compliance Operator remediation rhcos4-moderate/audit-rules-media-export
# Ensure auditd Collects Information on Exporting to Media (successful)
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: The unauthorized exportation of data to external media could result in
# an information leak where classified information, Privacy Act information,
# and intellectual property could be lost. An audit trail should be created
# each time a filesystem is mounted to help identify and guard against
# information loss.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -F key=export
        -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -F key=export
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-mount_dac_modification.rules
