# Compliance Operator remediation rhcos4-moderate/chronyd-client-only
# Disable chrony daemon from acting as server
# NIST 800-53: AU-8(1), AU-12(1). Severity: low.
# Why: In order to prevent unauthorized connection of devices, unauthorized
# transfer of information, or unauthorized tunneling (i.e., embedding of data
# types within data types), organizations must disable or restrict unused or
# unnecessary physical and logical ports/protocols on information systems.
# Operating systems are capable of providing a wide variety of functions and
# services. Some of the functions and services provided by default may not be
# necessary to support essential organizational operations. Additionally, it
# is sometimes convenient to provide multiple services from a single component
# (e.g., VPN and IPS); however, doing so increases risk over limiting the
# services provided by any one component. To support the requirements and
# principles of least functionality, the operating system must support the
# organizational requirements, providing only essential capabilities and
# limiting the use of ports, protocols, and/or services to only those
# required, authorized, and approved to conduct official business or to
# address authorized quality of life issues.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |-
        # Allow for extra configuration files. This is useful
        # for admins specifying their own NTP servers
        confdir /etc/chrony.d

        # Set chronyd as client-only.
        port 0

        # Disable chronyc from the network
        cmdport 0

        # Record the rate at which the system clock gains/losses time.
        driftfile /var/lib/chrony/drift

        # Allow the system clock to be stepped in the first three updates
        # if its offset is larger than 1 second.
        makestep 1.0 3

        # Enable kernel synchronization of the real-time clock (RTC).
        rtcsync

        # Enable hardware timestamping on all interfaces that support it.
        #hwtimestamp *

        # Increase the minimum number of selectable sources required to adjust
        # the system clock.
        #minsources 2

        # Allow NTP client access from local network.
        #allow 192.168.0.0/16

        # Serve time even if not synchronized to a time source.
        #local stratum 10

        # Require authentication (nts or key option) for all NTP sources.
        #authselectmode require

        # Specify file containing keys for NTP authentication.
        keyfile /etc/chrony.keys

        # Insert/delete leap seconds by slewing instead of stepping.
        #leapsecmode slew

        # Get TAI-UTC offset and leap seconds from the system tz database.
        leapsectz right/UTC

        # Specify directory for log files.
        logdir /var/log/chrony

        # Select which information is logged.
        #log measurements statistics tracking
      mode: 420
      overwrite: true
      path: /etc/chrony.conf
    - contents: ''
      mode: 420
      overwrite: true
      path: /etc/chrony.d/.mco-keep
    - contents: |
        #
        # This file controls the configuration of the ntp server
        # 0.pool.ntp.org,1.pool.ntp.org,2.pool.ntp.org,3.pool.ntp.org we have to put variable array name here for mutilines remediation

        server 0.pool.ntp.org minpoll 4 maxpoll 10
        server 1.pool.ntp.org minpoll 4 maxpoll 10
        server 2.pool.ntp.org minpoll 4 maxpoll 10
        server 3.pool.ntp.org minpoll 4 maxpoll 10
      mode: 420
      overwrite: true
      path: /etc/chrony.d/ntp-server.conf
