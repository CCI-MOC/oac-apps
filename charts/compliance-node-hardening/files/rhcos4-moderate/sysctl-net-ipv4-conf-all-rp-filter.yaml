# Compliance Operator remediation rhcos4-moderate/sysctl-net-ipv4-conf-all-rp-filter
# Enable Kernel Parameter to Use Reverse Path Filtering on all IPv4 Interfaces
# NIST 800-53: CM-7(a), CM-7(b), CM-6(a), SC-7(a). Severity: medium.
# Why: Enabling reverse path filtering drops packets with source addresses
# that should not have been able to be received on the interface they were
# received on. It should not be used on systems which are routers for
# complicated networks, but is helpful for end hosts and routers serving small
# networks.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        net.ipv4.conf.all.rp_filter=1
      mode: 420
      overwrite: true
      path: /etc/sysctl.d/75-sysctl_net_ipv4_conf_all_rp_filter.conf
