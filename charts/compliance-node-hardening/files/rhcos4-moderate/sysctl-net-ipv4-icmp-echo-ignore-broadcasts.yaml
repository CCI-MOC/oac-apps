# Compliance Operator remediation rhcos4-moderate/sysctl-net-ipv4-icmp-echo-ignore-broadcasts
# Enable Kernel Parameter to Ignore ICMP Broadcast Echo Requests on IPv4 Interfaces
# NIST 800-53: CM-7(a), CM-7(b), SC-5. Severity: medium.
# Why: Responding to broadcast (ICMP) echoes facilitates network mapping and
# provides a vector for amplification attacks. Ignoring ICMP echo requests
# (pings) sent to broadcast or multicast addresses makes the system slightly
# more difficult to enumerate on the network.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        net.ipv4.icmp_echo_ignore_broadcasts=1
      mode: 420
      overwrite: true
      path: /etc/sysctl.d/75-sysctl_net_ipv4_icmp_echo_ignore_broadcasts.conf
