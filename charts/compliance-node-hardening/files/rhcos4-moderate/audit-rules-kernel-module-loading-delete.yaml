# Compliance Operator remediation rhcos4-moderate/audit-rules-kernel-module-loading-delete
# Ensure auditd Collects Information on Kernel Module Unloading - delete_module
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: The removal of kernel modules can be used to alter the behavior of the
# kernel and potentially introduce malicious code into kernel space. It is
# important to have an audit trail of modules that have been introduced into
# the kernel.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b32 -S delete_module -k modules
