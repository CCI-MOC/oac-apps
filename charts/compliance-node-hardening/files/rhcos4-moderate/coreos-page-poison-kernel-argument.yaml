# Compliance Operator remediation rhcos4-moderate/coreos-page-poison-kernel-argument
# Enable page allocator poisoning
# NIST 800-53: CM-6(a). Severity: medium.
# Why: Poisoning writes an arbitrary value to freed pages, so any modification
# or reference to that page after being freed or before being initialized will
# be detected and prevented. This prevents many types of use-after-free
# vulnerabilities at little performance cost. Also prevents leak of data and
# detection of corrupted memory.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
kernelArguments:
- page_poison=1
