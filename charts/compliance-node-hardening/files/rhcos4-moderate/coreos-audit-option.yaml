# Compliance Operator remediation rhcos4-moderate/coreos-audit-option
# Enable Auditing for Processes Which Start Prior to the Audit Daemon
# NIST 800-53: AC-17(1), AU-14(1), AU-10, CM-6(a), IR-5(1). Severity: medium.
# Why: Each process on the system carries an "auditable" flag which indicates
# whether its activities can be audited. Although auditd takes care of
# enabling this for all processes which launch after it does, adding the
# kernel argument ensures it is set for every process during boot.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
kernelArguments:
- audit=1
