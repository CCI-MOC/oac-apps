# Compliance Operator remediation rhcos4-moderate/audit-rules-mac-modification
# Record Events that Modify the System's Mandatory Access Controls
# NIST 800-53: AU-2(d), AU-12(c), CM-6(a). Severity: medium.
# Why: The system's mandatory access policy (SELinux or Apparmor) should not
# be arbitrarily changed by anything other than administrator action. All
# changes to MAC policy should be audited.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -w /etc/selinux/ -p wa -k MAC-policy
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/75-etcselinux-wa-MAC-policy.rules
