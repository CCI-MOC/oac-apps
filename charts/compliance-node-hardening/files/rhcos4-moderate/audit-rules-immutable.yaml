# Compliance Operator remediation rhcos4-moderate/audit-rules-immutable
# Make the auditd Configuration Immutable
# NIST 800-53: AC-6(9), CM-6(a). Severity: medium.
# Why: Making the audit configuration immutable prevents accidental as well as
# malicious modification of the audit rules, although it may be problematic if
# legitimate changes are needed during system operation.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -e 2
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/90-immutable.rules
