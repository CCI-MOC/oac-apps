# Compliance Operator remediation rhcos4-moderate/disable-users-coredumps
# Disable Core Dumps for All Users
# NIST 800-53: CM-6, SC-7(10). Severity: medium.
# Why: A core dump includes a memory image taken at the time the operating
# system terminates an application. The memory image could contain sensitive
# data and is generally useful only for developers trying to debug problems.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: '*     hard   core    0'
      mode: 420
      overwrite: true
      path: /etc/security/limits.d/75-disable_users_coredumps.conf
