# Compliance Operator remediation rhcos4-moderate/audit-rules-time-watch-localtime
# Record Attempts to Alter the localtime File
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: Arbitrary changes to the system time can be used to obfuscate nefarious
# activities in log files, as well as to confuse network services that are
# highly dependent upon an accurate system time (such as sshd). All changes to
# the system time should be audited.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -w /etc/localtime -p wa -k audit_time_rules
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-audit_rules_time_watch_localtime.rules
