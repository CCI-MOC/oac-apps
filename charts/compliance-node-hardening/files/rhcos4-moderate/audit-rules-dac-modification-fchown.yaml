# Compliance Operator remediation rhcos4-moderate/audit-rules-dac-modification-fchown
# Record Events that Modify the System's Discretionary Access Controls - fchown
# NIST 800-53: AU-2(d), AU-12(c), CM-6(a). Severity: medium.
# Why: The changing of file permissions could indicate that a user is
# attempting to gain access to information that would otherwise be disallowed.
# Auditing DAC modifications can facilitate the identification of patterns of
# abuse among both authorized and unauthorized users.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b32 -S fchown -F auid>=1000 -F auid!=unset -F key=perm_mod
        -a always,exit -F arch=b64 -S fchown -F auid>=1000 -F auid!=unset -F key=perm_mod
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-fchown_dac_modification.rules
