# Compliance Operator remediation rhcos4-moderate/audit-rules-unsuccessful-file-modification-chmod
# Record Unsuccessful Permission Changes to Files - chmod
# NIST 800-53: AU-2(d), AU-12(c), CM-6(a). Severity: medium.
# Why: Unsuccessful attempts to change permissions of files could be an
# indicator of malicious activity on a system. Auditing these events could
# serve as evidence of potential system compromise.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -a always,exit -F arch=b64 -S chmod -F exit=-EACCES -F auid>=1000 -F auid!=unset -F key=access
        -a always,exit -F arch=b64 -S chmod -F exit=-EPERM -F auid>=1000 -F auid!=unset -F key=access
        -a always,exit -F arch=b32 -S chmod -F exit=-EACCES -F auid>=1000 -F auid!=unset -F key=access
        -a always,exit -F arch=b32 -S chmod -F exit=-EPERM -F auid>=1000 -F auid!=unset -F key=access
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-chmod_audit_rules_unsuccessful_file_modification.rules
