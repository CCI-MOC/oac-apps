# Compliance Operator remediation rhcos4-moderate/sysctl-kernel-yama-ptrace-scope
# Restrict usage of ptrace to descendant processes
# NIST 800-53: SC-7(10). Severity: medium.
# Why: Unrestricted usage of ptrace allows compromised binaries to run ptrace
# on another processes of the user. Like this, the attacker can steal
# sensitive information from the target processes (e.g. SSH sessions, web
# browser, ...) without any additional assistance from the user (i.e. without
# resorting to phishing).
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        kernel.yama.ptrace_scope=1
      mode: 420
      overwrite: true
      path: /etc/sysctl.d/75-sysctl_kernel_yama_ptrace_scope.conf
