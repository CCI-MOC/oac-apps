# Compliance Operator remediation rhcos4-moderate/no-direct-root-logins
# Direct root Logins Not Allowed
# NIST 800-53: IA-2, CM-6(a). Severity: medium.
# Why: Disabling direct root logins ensures proper accountability and
# multifactor authentication to privileged accounts. Users will first login,
# then escalate to privileged (root) access via su / sudo. This is required
# for FISMA Low and FISMA Moderate systems.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: ''
      mode: 384
      overwrite: true
      path: /etc/securetty
