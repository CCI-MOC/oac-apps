# Compliance Operator remediation rhcos4-moderate/audit-rules-login-events-faillock
# Record Attempts to Alter Logon and Logout Events - faillock
# NIST 800-53: AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: Manual editing of these files may indicate nefarious activity, such as
# an attacker attempting to remove evidence of an intrusion.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -w /var/run/faillock -p wa -k logins
      mode: 420
      overwrite: true
      path: /etc/audit/rules.d/75-audit_rules_login_events_faillock.rules
