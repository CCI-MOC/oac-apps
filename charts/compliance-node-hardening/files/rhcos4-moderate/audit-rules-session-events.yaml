# Compliance Operator remediation rhcos4-moderate/audit-rules-session-events
# Record Attempts to Alter Process and Session Initiation Information
# NIST 800-53: AU-2(d), AU-12(c), CM-6(a). Severity: medium.
# Why: Manual editing of these files may indicate nefarious activity, such as
# an attacker attempting to remove evidence of an intrusion.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |2

        -w /var/run/utmp -p wa -k session
        -w /var/log/btmp -p wa -k session
        -w /var/log/wtmp -p wa -k session
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/75-audit-session-events.rules
