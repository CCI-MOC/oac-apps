# Compliance Operator remediation rhcos4-moderate/ensure-logrotate-activated
# Ensure Logrotate Runs Periodically
# NIST 800-53: CM-6(a). Severity: medium.
# Why: Log files that are not properly rotated run the risk of growing so
# large that they fill up the /var/log partition. Valuable logging information
# could be lost if the /var/log partition becomes full.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |-
        # see "man logrotate" for details
        # rotate log files daily
        daily

        # keep 4 weeks worth of backlogs
        rotate 30

        # create new (empty) log files after rotating old ones
        create

        # use date as a suffix of the rotated file
        dateext

        # uncomment this if you want your log files compressed
        #compress

        # RPM packages drop log rotation information into this directory
        include /etc/logrotate.d

        # system-specific logs may be also be configured here.
      mode: 420
      overwrite: true
      path: /etc/logrotate.conf
