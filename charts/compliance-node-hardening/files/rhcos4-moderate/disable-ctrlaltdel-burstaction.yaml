# Compliance Operator remediation rhcos4-moderate/disable-ctrlaltdel-burstaction
# Disable Ctrl-Alt-Del Burst Action
# NIST 800-53: CM-6(a), AC-6(1), CM-6(a). Severity: high.
# Why: A locally logged-in user who presses Ctrl-Alt-Del, when at the console,
# can reboot the system. If accidentally pressed, as could happen in the case
# of mixed OS environment, this can create the risk of short-term loss of
# availability of systems due to unintentional reboot.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: CtrlAltDelBurstAction=none
      mode: 420
      overwrite: true
      path: /etc/systemd/system.conf.d/disable_ctrlaltdelete_burstaction.conf
