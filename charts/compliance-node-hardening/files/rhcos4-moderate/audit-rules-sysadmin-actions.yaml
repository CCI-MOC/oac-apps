# Compliance Operator remediation rhcos4-moderate/audit-rules-sysadmin-actions
# Ensure auditd Collects System Administrator Actions
# NIST 800-53: AC-2(7)(b), AU-2(d), AU-12(c), AC-6(9), CM-6(a). Severity: medium.
# Why: The actions taken by system administrators should be audited to keep a
# record of what was executed on the system, as well as, for accountability
# purposes.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        -w /etc/sudoers.d/ -p wa -k actions
        -w /etc/sudoers -p wa -k actions
      mode: 384
      overwrite: true
      path: /etc/audit/rules.d/75-audit-sysadmin-actions.rules
