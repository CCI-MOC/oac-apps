# Compliance Operator remediation rhcos4-moderate/sysctl-net-ipv4-tcp-syncookies
# Enable Kernel Parameter to Use TCP Syncookies on Network Interfaces
# NIST 800-53: CM-7(a), CM-7(b), SC-5(1), SC-5(2), SC-5(3)(a), CM-6(a). Severity: medium.
# Why: A TCP SYN flood attack can cause a denial of service by filling a
# system's TCP connection table with connections in the SYN_RCVD state.
# Syncookies can be used to track a connection when a subsequent ACK is
# received, verifying the initiator is attempting a valid connection and is
# not a flood source. This feature is activated when a flood condition is
# detected, and enables the system to continue servicing valid connection
# requests.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        net.ipv4.tcp_syncookies=1
      mode: 420
      overwrite: true
      path: /etc/sysctl.d/75-sysctl_net_ipv4_tcp_syncookies.conf
