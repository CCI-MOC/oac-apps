# Compliance Operator remediation rhcos4-moderate/sysctl-kernel-core-pattern
# Disable storing core dumps
# NIST 800-53: SC-7(10). Severity: medium.
# Why: A core dump includes a memory image taken at the time the operating
# system terminates an application. The memory image could contain sensitive
# data and is generally useful only for developers trying to debug problems.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        kernel.core_pattern = |/bin/false
      mode: 420
      overwrite: true
      path: /etc/sysctl.d/75-sysctl_kernel_core_pattern.conf
