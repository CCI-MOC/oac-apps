# Compliance Operator remediation rhcos4-moderate/chronyd-configure-local-socket-1
# Configure chrony-wait.service to use Unix socket
# NIST 800-53: CM-7(1). Severity: low.
# Why: When network access to the chrony daemon command port is disabled for
# security hardening, the chrony-wait.service must be configured to use the
# Unix domain socket instead of network addresses. This ensures the service
# can still check chrony synchronization status without requiring network
# command access.
# Generated by scripts/export-remediations.py; do not edit.
config:
  ignition:
    version: 3.1.0
  storage:
    files:
    - contents: |
        [Unit]
        Description=Wait for chrony to synchronize system clock (KCS 7064388)
        Documentation=man:chronyc(1)
        After=chronyd.service
        Requires=chronyd.service
        Before=time-sync.target
        Wants=time-sync.target

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/chronyc waitsync 0 0.1 0.0 1
        TimeoutStartSec=180
        RemainAfterExit=yes
        StandardOutput=null

        CapabilityBoundingSet=~CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_AUDIT_WRITE
        CapabilityBoundingSet=~CAP_BLOCK_SUSPEND CAP_KILL CAP_LEASE CAP_LINUX_IMMUTABLE
        CapabilityBoundingSet=~CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_MKNOD CAP_SYS_ADMIN
        CapabilityBoundingSet=~CAP_SYS_BOOT CAP_SYS_CHROOT CAP_SYS_MODULE CAP_SYS_PACCT
        CapabilityBoundingSet=~CAP_SYS_PTRACE CAP_SYS_RAWIO CAP_SYS_TTY_CONFIG CAP_WAKE_ALARM
        DevicePolicy=closed
        IPAddressAllow=localhost
        IPAddressDeny=any
        LockPersonality=yes
        MemoryDenyWriteExecute=yes
        PrivateDevices=yes
        ProcSubset=pid
        ProtectClock=yes
        ProtectControlGroups=yes
        ProtectHome=yes
        ProtectHostname=yes
        ProtectKernelLogs=yes
        ProtectKernelModules=yes
        ProtectKernelTunables=yes
        ProtectProc=invisible
        ProtectSystem=strict
        RestrictAddressFamilies=AF_UNIX
        RestrictNamespaces=yes
        RestrictRealtime=yes
        SystemCallArchitectures=native
        SystemCallFilter=@system-service
        SystemCallFilter=~@privileged @resources
        UMask=0777

        [Install]
        WantedBy=multi-user.target
      mode: 420
      overwrite: true
      path: /etc/systemd/system/chrony-wait.service
