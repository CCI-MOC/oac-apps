suite: NodePool ConfigMap
templates:
  - templates/nodepool-configmap.yaml

tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ConfigMap in the NodePools' namespace
    set:
      nodePool.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: compliance-node-hardening
      - equal:
          path: metadata.namespace
          value: clusters

  - it: should take the ConfigMap's name and namespace from values
    set:
      nodePool:
        enabled: true
        configMapName: node-hardening
        namespace: hcp
    asserts:
      - equal:
          path: metadata.name
          value: node-hardening
      - equal:
          path: metadata.namespace
          value: hcp

  - it: should merge the worker rules into one worker MachineConfig
    set:
      nodePool.enabled: true
    asserts:
      - matchRegex:
          path: data.config
          pattern: "name: 75-compliance-node-hardening\n"
      - matchRegex:
          path: data.config
          pattern: "machineconfiguration.openshift.io/role: worker\n"
      - matchRegex:
          path: data.config
          pattern: "version: 3.4.0\n"
      - matchRegex:
          path: data.config
          pattern: "\n  - pti=on\n"
      - matchRegex:
          path: data.config
          pattern: "\n  extensions:\n  - usbguard\n"
      - matchRegex:
          path: data.config
          pattern: "path: /etc/ssh/sshd_config.d/10-allowusers.conf\n"

  # Hosted clusters' API servers run on the hub, not on their workers.
  - it: should leave out master-only rules
    set:
      nodePool.enabled: true
    asserts:
      - notMatchRegex:
          path: data.config
          pattern: var%2Flog%2Fkube-apiserver

  - it: should leave out excluded rules
    set:
      nodePool.enabled: true
      excludeRules: [coreos-nousb-kernel-argument]
    asserts:
      - notMatchRegex:
          path: data.config
          pattern: "- nousb\n"
      - matchRegex:
          path: data.config
          pattern: "- pti=on\n"

  - it: should enable USBGuard at boot by default
    set:
      nodePool.enabled: true
    asserts:
      - matchRegex:
          path: data.config
          pattern: "name: usbguard-enable.service\n"

  - it: should not add the USBGuard unit when it is off
    set:
      nodePool:
        enabled: true
        usbguardEnable: false
    asserts:
      - notMatchRegex:
          path: data.config
          pattern: usbguard-enable.service

  # Unsupported by Red Hat, so a hub has to choose it.
  - it: should create FIO's directory only when asked
    set:
      nodePool:
        enabled: true
        fioStaticPodResourcesDir: true
    asserts:
      - matchRegex:
          path: data.config
          pattern: "path: /etc/tmpfiles.d/fio-static-pod-resources.conf\n"

  - it: should not create FIO's directory by default
    set:
      nodePool.enabled: true
    asserts:
      - notMatchRegex:
          path: data.config
          pattern: fio-static-pod-resources
