suite: node-labels chart
templates:
  - templates/node-labels.yaml

tests:
  - it: should render nothing when no rules are defined
    set:
      rules: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one enforced ConfigurationPolicy per rule
    set:
      rules:
        - name: gpu-workers
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            example.com/x: "y"
        - name: storage-box
          nodeNames:
            - worker-1
          labels:
            openshift.moc/storage: "true"
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ConfigurationPolicy
          apiVersion: policy.open-cluster-management.io/v1
          name: node-labels-gpu-workers
          namespace: local-cluster
        documentIndex: 0
      - containsDocument:
          kind: ConfigurationPolicy
          apiVersion: policy.open-cluster-management.io/v1
          name: node-labels-storage-box
          namespace: local-cluster
        documentIndex: 1
      - equal:
          path: spec.remediationAction
          value: enforce
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: "complianceType: musthave"

  - it: should put the policies in policyNamespace
    set:
      policyNamespace: jetty
      rules:
        - name: gpu-workers
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            example.com/x: "y"
    asserts:
      - equal:
          path: metadata.namespace
          value: jetty

  - it: should set the SkipDryRunOnMissingResource sync option
    set:
      rules:
        - name: gpu-workers
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            example.com/x: "y"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: should range over the nodes that match matchLabels
    set:
      rules:
        - name: gpu-workers
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            nvidia.com/gpu.deploy.operands: "true"
    asserts:
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: '\{\{- range \(lookup "v1" "Node" "" "" "node-role.kubernetes.io/worker="\).items \}\}'
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: 'name: \{\{ .metadata.name \}\}'
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: 'nvidia.com/gpu.deploy.operands: "true"'

  - it: should turn matchExpressions into a label selector string
    set:
      rules:
        - name: exprs
          matchLabels:
            a: b
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
            - key: example.com/skip
              operator: DoesNotExist
            - key: example.com/rack
              operator: In
              values: [r1, r2]
            - key: example.com/zone
              operator: NotIn
              values: [z9]
          labels:
            example.com/x: "y"
    asserts:
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: '"a=b,kubernetes.io/hostname,!example.com/skip,example.com/rack in \(r1,r2\),example.com/zone notin \(z9\)"'

  - it: should fail on an unsupported matchExpressions operator
    set:
      rules:
        - name: bad
          matchExpressions:
            - key: a
              operator: Gt
              values: ["1"]
          labels:
            example.com/x: "y"
    asserts:
      - failedTemplate:
          errorMessage: 'node-labels: matchExpressions operator "Gt" is not supported'

  - it: should quote label values so they are always strings
    set:
      rules:
        - name: gpu-workers
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            example.com/enabled: true
    asserts:
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: 'example.com/enabled: "true"'

  - it: should emit labelTemplates verbatim for per-node values
    set:
      rules:
        - name: mixed
          matchLabels:
            node-role.kubernetes.io/worker: ""
          labels:
            example.com/static: "yes"
          labelTemplates:
            topology.kubernetes.io/zone: "{{ .metadata.name }}"
    asserts:
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: 'example.com/static: "yes"'
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: 'topology.kubernetes.io/zone: "\{\{ .metadata.name \}\}"'

  - it: should label named nodes only if they exist, never create them
    set:
      rules:
        - name: storage-box
          nodeNames:
            - worker-1
            - worker-2
          labels:
            openshift.moc/storage: "true"
    asserts:
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: '\{\{- with \(lookup "v1" "Node" "" "worker-1"\) \}\}\{\{- if .metadata \}\}'
      - matchRegex:
          path: spec["object-templates-raw"]
          pattern: '\{\{- with \(lookup "v1" "Node" "" "worker-2"\) \}\}\{\{- if .metadata \}\}'
      - notMatchRegex:
          path: spec["object-templates-raw"]
          pattern: "range"

  - it: should fail closed when a rule sets both a selector and nodeNames
    set:
      rules:
        - name: bad
          matchLabels:
            a: b
          nodeNames:
            - worker-1
          labels:
            example.com/x: "y"
    asserts:
      - failedTemplate:
          errorMessage: 'node-labels rule "bad" sets both a selector and nodeNames; use exactly one'

  - it: should fail closed when a rule sets neither a selector nor nodeNames
    set:
      rules:
        - name: bad
          labels:
            example.com/x: "y"
    asserts:
      - failedTemplate:
          errorMessage: 'node-labels rule "bad" must set either a selector (matchLabels/matchExpressions) or nodeNames'

  - it: should fail closed when a rule has neither labels nor labelTemplates
    set:
      rules:
        - name: bad
          matchLabels:
            a: b
    asserts:
      - failedTemplate:
          errorMessage: 'node-labels rule "bad" must set a non-empty labels or labelTemplates map'

  - it: should fail closed when a rule has no name
    set:
      rules:
        - matchLabels:
            a: b
          labels:
            example.com/x: "y"
    asserts:
      - failedTemplate:
          errorMessage: "each node-labels rule must set a name"
