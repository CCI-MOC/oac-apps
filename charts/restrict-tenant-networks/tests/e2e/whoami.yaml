apiVersion: v1
kind: Pod
metadata:
  name: whoami
  namespace: ($namespace)
  labels:
    app: whoami
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: whoami
      image: docker.io/traefik/whoami:v1.10.3
      env:
        - name: WHOAMI_PORT_NUMBER
          value: "8080"
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 1
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: ($namespace)
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
