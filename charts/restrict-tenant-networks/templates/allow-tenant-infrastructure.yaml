apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: allow-tenant-infrastructure
spec:
  priority: 50
  subject:
    namespaces:
      matchExpressions:
        - key: {{ .Values.tenantKey }}
          operator: Exists

  ingress:
  - name: "allow-system-ingress-to-tenants"
    action: Allow
    from:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - kube-system
          - openshift-monitoring
          - openshift-user-workload-monitoring
          - openshift-dns
          - openshift-ingress
          - openshift-apiserver

  # Port 3000 only, for the same reason the metrics rule below names its port.
  # The Grafana operator reconciles dashboards and datasources by calling each
  # project's Grafana directly, and it builds that address from Grafana's own
  # port, so it cannot be pointed at the authenticating proxy instead. This
  # tier is evaluated before the namespaced NetworkPolicy, so that policy
  # cannot open the path on its own. Naming the port keeps the rest of the
  # tenant namespace closed to the operator.
  - name: "allow-grafana-operator-ingress"
    action: Allow
    from:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - {{ .Values.grafanaOperatorNamespace }}
    ports:
    - portNumber:
        protocol: TCP
        port: {{ .Values.grafanaPort }}

  egress:
  - name: "allow-system-egress"
    action: Allow
    to:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - kube-system
          - openshift-dns
          - openshift-apiserver
  - name: "allow-shared-services-egress"
    action: Allow
    to:
    - namespaces:
        matchExpressions:
          - key: {{ .Values.sharedServiceKey }}
            operator: Exists
  # Port 9092 only, and the port is the whole point of this rule.
  # A tenant needs to reach thanos-querier to read its own metrics, but 9091 on
  # the same service does not filter by namespace at all, so opening the
  # namespace without naming the port would hand every tenant a view of the
  # entire cluster. 9092 runs prom-label-proxy with --error-on-replace, which
  # pins the namespace to the caller's own.
  - name: "allow-tenant-metrics-egress"
    action: Allow
    to:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - openshift-monitoring
    ports:
    - portNumber:
        protocol: TCP
        port: {{ .Values.tenantMetricsPort }}
