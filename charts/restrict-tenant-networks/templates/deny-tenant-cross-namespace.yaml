apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
spec:
  subject:
    namespaces:
      matchExpressions:
        - key: {{ .Values.tenantKey }}
          operator: Exists

  ingress:
  - name: "deny-tenant-cross-namespace-ingress"
    action: Deny
    from:
    - namespaces: {}

  egress:
  - name: "deny-tenant-cross-namespace-egress"
    action: Deny
    to:
    - namespaces: {}
