tenantKey: "massopen.cloud/project"
sharedServiceKey: "massopen.cloud/shared-services"
# The tenancy-aware port on thanos-querier. 9091 exists too and shows every
# namespace, so this must never be widened to the whole service.
tenantMetricsPort: 9092

# The namespace the Grafana operator runs in, and the port it manages Grafana
# on. The operator builds its management URL from Grafana's own port and cannot
# be pointed anywhere else, so 3000 has to stay reachable for it alone.
grafanaOperatorNamespace: "grafana-operator"
grafanaPort: 3000
