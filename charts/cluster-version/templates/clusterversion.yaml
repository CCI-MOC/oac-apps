{{- $clusterID := required "clusterID is required" .Values.clusterID }}
{{- $release_channel := required "release.channel is required" .Values.release.channel }}
{{- $release_version := required "release.version is required" .Values.release.version }}
apiVersion: config.openshift.io/v1
kind: ClusterVersion
metadata:
  name: version
spec:
  clusterID: {{ $clusterID }}
  channel: {{ $release_channel }}
  desiredUpdate:
    version: {{ $release_version | quote }}
