suite: ClusterVersion template
templates:
  - templates/clusterversion.yaml
set:
  clusterID: test-cluster-id-1234
  release:
    channel: stable-4.21
    version: "4.21.0"

tests:
  - it: should render a ClusterVersion resource
    asserts:
      - isKind:
          of: ClusterVersion
      - equal:
          path: metadata.name
          value: version

  - it: should set the cluster ID
    asserts:
      - equal:
          path: spec.clusterID
          value: test-cluster-id-1234

  - it: should set the channel
    asserts:
      - equal:
          path: spec.channel
          value: stable-4.21

  - it: should set the desired update version as a quoted string
    asserts:
      - equal:
          path: spec.desiredUpdate.version
          value: "4.21.0"

  - it: should fail when clusterID is not set
    set:
      clusterID: ""
    asserts:
      - failedTemplate:
          errorMessage: "clusterID is required"

  - it: should fail when release.channel is not set
    set:
      release:
        channel: ""
        version: "4.21.0"
    asserts:
      - failedTemplate:
          errorMessage: "release.channel is required"

  - it: should fail when release.version is not set
    set:
      release:
        channel: stable-4.21
        version: ""
    asserts:
      - failedTemplate:
          errorMessage: "release.version is required"
