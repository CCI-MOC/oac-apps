{{ if .Values.certificates.api.enabled }}
{{- $clusterDomain := required "clusterDomain is required" .Values.clusterDomain }}
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
  namespace: openshift-config
  annotations:
    # A cluster singleton other charts also set fields on (platform-hardening
    # sets audit.profile): server-side apply so this chart owns only the
    # serving certificate.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  servingCerts:
    namedCertificates:
      - names:
          - '{{ .Values.clusterAPIDomainName | default (printf "api.%s" $clusterDomain) }}'
        servingCertificate:
          name: {{ .Values.certificates.api.certificate_name }}
{{ end }}
