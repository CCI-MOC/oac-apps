suite: Service Mesh operator
templates:
  - templates/operator.yaml

tests:
  # Every cluster still on RHOAI 2.x needs the mesh for KServe Serverless, so
  # the chart stays on unless a cluster opts out.
  - it: subscribes by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Subscription
      - equal:
          path: spec.name
          value: servicemeshoperator
      - equal:
          path: spec.channel
          value: stable

  # The shared openshift-operators namespace and its global OperatorGroup are
  # not ours to create, and must not be pruned when a cluster opts out.
  - it: renders only the subscription
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: openshift-operators

  - it: renders nothing when the cluster opts out
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0
