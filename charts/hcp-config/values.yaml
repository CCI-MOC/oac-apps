ingressController:
  enabled: false
  domain: ""
  replicas: 2
  # Addresses for the MetalLB pool that pins the dedicated router's
  # LoadBalancer service (see templates/ingress-addresspool.yaml). Required
  # when enabled. Accepts any MetalLB address form (CIDR or range), e.g.
  # ["10.20.3.10/32"].
  addresses: []
  # Set to "WildcardsAllowed" to allow wildcard routes on the hosted-clusters
  # IngressController. Omit or leave empty to use the default ("WildcardsDisallowed").
  wildcardPolicy: ""

sshKey:
  aws_secret_name: ""

infraClusters: []
# - name: infra-workload0
#   awsSecretKey: cluster/<hub>/hostedcluster/infra-workload0/kubeadmin

# Instructs hypershift operator to collect metrics of all control plane
# components of a hosted cluster
metricsSet:
  enabled: true
