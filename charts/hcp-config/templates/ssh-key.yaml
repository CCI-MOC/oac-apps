apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oac-ssh-key
  namespace: clusters
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: oac-ssh-key
  data:
    - secretKey: id_rsa.pub
      remoteRef:
        key: {{ required "sshKey.aws_secret_name is required" .Values.sshKey.aws_secret_name }}
        property: publicKey
