{{- range .Values.infraClusters }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-kubeconfig
  namespace: clusters
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-kubeconfig
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: {{ required "infraClusters[].awsSecretKey is required" .awsSecretKey }}
        property: adminKubeconfig
{{- end }}
