{{- range .Values.hypervisorClusters }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-kubeconfig
  namespace: clusters
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-kubeconfig
  data:
    - secretKey: kubeconfig
      remoteRef:
        key: {{ required "hypervisorClusters[].awsSecretKey is required" .awsSecretKey }}
        {{- /* A hosted cluster's secret holds the kubeconfig under
        adminKubeconfig; a spoke's is the bare kubeconfig (property: ""). */}}
        {{- $property := hasKey . "property" | ternary .property "adminKubeconfig" }}
        {{- with $property }}
        property: {{ . }}
        {{- end }}
{{- end }}
