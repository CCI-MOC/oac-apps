{{- if .Values.metricsSet }}
{{- if .Values.metricsSet.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: hypershift
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  template:
    spec:
      containers:
        - name: operator
          env:
            - name: METRICS_SET
              value: SRE
{{- end }}
{{- end }}
