apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hosted-clusters
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        revision: main
        directories:
          - path: hosted-clusters/*
  template:
    metadata:
      name: "cluster-{{ "{{.path.basename}}" }}"
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: charts/hosted-cluster
        helm:
          valueFiles:
            - "/{{ "{{.path.path}}" }}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: clusters
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
