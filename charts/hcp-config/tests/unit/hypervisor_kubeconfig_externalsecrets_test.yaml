suite: Hypervisor kubeconfig ExternalSecrets
templates:
  - templates/hypervisor-kubeconfig-externalsecrets.yaml
set:
  sshKey:
    aws_secret_name: test-ssh-key

tests:
  - it: should read adminKubeconfig by default
    set:
      hypervisorClusters:
        - name: workload1
          awsSecretKey: cluster/hub/hostedcluster/workload1/kubeadmin
    asserts:
      - equal:
          path: metadata.name
          value: workload1-kubeconfig
      - equal:
          path: spec.data[0].remoteRef.property
          value: adminKubeconfig

  - it: should read the whole secret when property is empty
    set:
      hypervisorClusters:
        - name: jetty
          awsSecretKey: cluster/hub/spoke-cluster/jetty/kubeadmin
          property: ""
    asserts:
      - notExists:
          path: spec.data[0].remoteRef.property
      - equal:
          path: spec.data[0].remoteRef.key
          value: cluster/hub/spoke-cluster/jetty/kubeadmin
