suite: sre-metric-set ConfigMap
templates:
  - templates/sre-metric-set.yaml
tests:
  # Tied to the same switch as the operator patch next to it, and that one
  # defaults to enabled. Setting METRICS_SET=SRE without these rules filters
  # nothing at all, so the two belong together rather than being separate
  # decisions.
  - it: follows the same switch as the operator patch
    asserts:
      - hasDocuments:
          count: 1

  - it: renders nothing when metricsSet is off
    set:
      metricsSet:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # The operator looks for this exact name in its own namespace and syncs it
  # from there into each control plane namespace, so both are fixed.
  - it: lands where the operator looks for it
    set:
      metricsSet:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: sre-metric-set
      - equal:
          path: metadata.namespace
          value: hypershift

  # The whole point of the file. Without these two rules SRE keeps every
  # apiserver histogram bucket, which measured as 94% of all samples per
  # scrape on both hubs.
  - it: drops the apiserver histogram buckets
    set:
      metricsSet:
        enabled: true
    asserts:
      - matchRegex:
          path: data.config
          pattern: 'apiserver_request_duration_seconds_bucket;'
      - matchRegex:
          path: data.config
          pattern: 'sourceLabels: \["__name__", "le"\]'

  # Both scheduler fields must stay unfiltered, and kubeSchedulerResourceMetrics
  # is the one that carries the weight: the ServiceMonitor has two endpoints and
  # kube_pod_resource_request comes from /metrics/resources, which that field
  # drives rather than kubeScheduler. It is the reason MOC-issues#481 exists, so
  # a drop rule on either would undo the point of enabling SRE at all.
  - it: leaves the scheduler alone
    set:
      metricsSet:
        enabled: true
    asserts:
      # (?m) is load-bearing: without it ^ anchors to the start of the whole
      # config string, which begins with kubeAPIServer, so a kubeScheduler
      # section added on any later line would slip through.
      - notMatchRegex:
          path: data.config
          pattern: '(?m)^kubeScheduler:'
      - notMatchRegex:
          path: data.config
          pattern: '(?m)^kubeSchedulerResourceMetrics:'
