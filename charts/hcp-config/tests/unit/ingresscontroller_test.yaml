suite: hosted-clusters IngressController
templates:
  - templates/ingresscontroller.yaml
set:
  sshKey:
    aws_secret_name: dummy
  ingressController:
    enabled: true
    domain: hcp.example.com

tests:
  - it: should render the hosted-clusters IngressController
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: IngressController
          apiVersion: operator.openshift.io/v1
          name: hosted-clusters

  - it: should not include routeAdmission when wildcardPolicy is not set
    asserts:
      - notExists:
          path: spec.routeAdmission

  - it: should set routeAdmission.wildcardPolicy when configured
    set:
      ingressController:
        enabled: true
        domain: hcp.example.com
        wildcardPolicy: WildcardsAllowed
    asserts:
      - equal:
          path: spec.routeAdmission.wildcardPolicy
          value: WildcardsAllowed

  - it: should render nothing when the dedicated router is not enabled
    set:
      ingressController:
        enabled: false
        domain: hcp.example.com
    asserts:
      - hasDocuments:
          count: 0
