{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- range .Values.externalSecrets }}
{{- $storeDefaults := dict "secretStoreRef" (dict "name" $.Values.secretStore.name "kind" $.Values.secretStore.kind) }}
{{- $spec := mustMergeOverwrite (deepCopy $storeDefaults) (deepCopy (.spec | default dict)) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "each externalSecrets entry requires a name" .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- toYaml $spec | nindent 4 }}
{{- end }}
