{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- $totalReplicas := 0 }}
{{- range .Values.nodePools }}
  {{- $totalReplicas = add $totalReplicas (.replicas | int) }}
{{- end }}
{{- $limit := max 10 (mul $totalReplicas 5) }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: machine-limit
  namespace: clusters-{{ $clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hard:
    count/machines.cluster.x-k8s.io: {{ $limit | quote }}
    count/agentmachines.capi-provider.agent-install.openshift.io: {{ $limit | quote }}
