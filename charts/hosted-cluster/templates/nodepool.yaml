{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- $platformType := .Values.platform.type | default "Agent" }}
{{- range .Values.nodePools }}
---
apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: {{ $clusterName }}-{{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    {{- if eq $platformType "KubeVirt" }}
    {{- /* CPU settings the NodePool API lacks, patched into HyperShift's VM
    template. Paths are relative to the VirtualMachineTemplateSpec. */}}
    {{- $vmPatch := list }}
    {{- if .dedicatedCpus }}
    {{- $vmPatch = append $vmPatch (dict "op" "add" "path" "/spec/template/spec/domain/cpu/dedicatedCpuPlacement" "value" true) }}
    {{- end }}
    {{- with .cpuThreads }}
    {{- $vmPatch = append $vmPatch (dict "op" "add" "path" "/spec/template/spec/domain/cpu/threads" "value" (int .)) }}
    {{- end }}
    {{- with $vmPatch }}
    hypershift.openshift.io/kubevirt-vm-jsonpatch: {{ toJson . | quote }}
    {{- end }}
    {{- end }}
spec:
  clusterName: {{ $clusterName }}
  {{- /* A pool's own entries may be names or HyperShift's {name: ...} form. */}}
  {{- $config := $.Values.nodePoolConfig }}
  {{- $pool := . }}
  {{- range .machineConfigs | default list }}
  {{- $config = append $config (printf "%s-%s-%s" $clusterName $pool.name .name) }}
  {{- end }}
  {{- range .config | default list }}
  {{- if kindIs "map" . }}
  {{- $config = append $config .name }}
  {{- else }}
  {{- $config = append $config . }}
  {{- end }}
  {{- end }}
  {{- $config = $config | uniq }}
  {{- with $config }}
  config:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  management:
    autoRepair: {{ .autoRepair | default false }}
    {{- if eq $platformType "KubeVirt" }}
    upgradeType: {{ .upgradeType | default "Replace" }}
    {{- else }}
    upgradeType: {{ .upgradeType | default "InPlace" }}
    {{- end }}
  release:
    image: {{ $.Values.release.image }}
  replicas: {{ .replicas }}
  {{- if eq $platformType "Agent" }}
  arch: {{ .arch | default "amd64" }}
  nodeDrainTimeout: 0s
  nodeVolumeDetachTimeout: 0s
  platform:
    agent:
      agentLabelSelector:
        matchLabels:
          {{- toYaml .agentLabelSelector | nindent 10 }}
    type: Agent
  {{- else }}
  platform:
    type: KubeVirt
    kubevirt:
      compute:
        cores: {{ .cpu }}
        memory: {{ .memory }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .hostDevices }}
      hostDevices:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      rootVolume:
        persistent:
          size: {{ .disk.size }}
          {{- with .disk.storageClassName }}
          storageClassName: {{ . }}
          {{- end }}
        type: Persistent
  {{- end }}
{{- end }}
