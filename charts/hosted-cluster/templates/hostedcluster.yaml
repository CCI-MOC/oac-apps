{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- $baseDomain := include "hosted-cluster.baseDomain" . }}
{{- $kubeAPIServerDNSName := include "hosted-cluster.kubeAPIServerDNSName" . }}
{{- $oauthHostname := include "hosted-cluster.oauthHostname" . }}
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.hostedCluster.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    {{- with .Values.hostedCluster.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  kubeAPIServerDNSName: {{ $kubeAPIServerDNSName }}
  controllerAvailabilityPolicy: {{ .Values.controllerAvailabilityPolicy }}
  dns:
    baseDomain: {{ $baseDomain }}
  etcd:
    managed:
      storage:
        persistentVolume:
          size: {{ .Values.etcd.storageSize }}
          storageClassName: {{ .Values.etcd.storageClassName }}
        type: PersistentVolume
    managementType: Managed
  fips: {{ .Values.fips }}
  networking:
    clusterNetwork:
      {{- toYaml .Values.networking.clusterNetwork | nindent 6 }}
    networkType: {{ .Values.networking.networkType }}
    serviceNetwork:
      {{- toYaml .Values.networking.serviceNetwork | nindent 6 }}
  olmCatalogPlacement: {{ .Values.olmCatalogPlacement }}
  platform:
    agent:
      agentNamespace: {{ .Values.platform.agentNamespace }}
    type: Agent
  pullSecret:
    name: {{ .Values.pullSecret.name }}
  release:
    image: {{ .Values.release.image }}
  secretEncryption:
    aescbc:
      activeKey:
        name: {{ $clusterName }}-etcd-encryption-key
    type: aescbc
  services:
    {{- $allDefaults := include "hosted-cluster.serviceDefaults" . | fromYaml }}
    {{- range $serviceName := list "APIServer" "Ignition" "Konnectivity" "OAuthServer" "OIDC" }}
    {{- $svcDef := index $allDefaults $serviceName }}
    {{- $serviceConfig := dig $serviceName dict $.Values.services }}
    {{- $hostname := include "hosted-cluster.serviceHostname" (dict "serviceConfig" $serviceConfig "prefix" $svcDef.prefix "facing" $svcDef.facing "clusterName" $clusterName "ctx" $) }}
    {{- $strategyType := dig "servicePublishingStrategy" "type" $svcDef.defaultType $serviceConfig }}
    {{- $autoStrategy := dict "type" $strategyType }}
    {{- if and $hostname (eq $strategyType "NodePort") }}
      {{- $_ := set $autoStrategy "nodePort" (dict "address" $hostname) }}
    {{- else if and $hostname (eq $strategyType "LoadBalancer") }}
      {{- $_ := set $autoStrategy "loadBalancer" (dict "hostname" $hostname) }}
    {{- else if and $hostname (eq $strategyType "Route") }}
      {{- $_ := set $autoStrategy "route" (dict "hostname" $hostname) }}
    {{- end }}
    {{- $userStrategy := dig "servicePublishingStrategy" dict $serviceConfig }}
    {{- $finalStrategy := mustMergeOverwrite (deepCopy $autoStrategy) $userStrategy }}
    - service: {{ $serviceName }}
      servicePublishingStrategy:
        {{- toYaml $finalStrategy | nindent 8 }}
    {{- end }}
  {{- if .Values.issuerURL }}
  issuerURL: {{ .Values.issuerURL | quote }}
  {{- else }}
  issuerURL: "https://oac-clusters-oidc.s3.us-east-1.amazonaws.com/{{ $clusterName }}"
  {{- end }}
  operatorConfiguration:
    ingressOperator:
      endpointPublishingStrategy:
        type: {{ .Values.ingress.type }}
        loadBalancer:
          scope: {{ .Values.ingress.scope }}
          dnsManagementPolicy: {{ .Values.ingress.dnsManagementPolicy }}
  sshKey:
    name: {{ .Values.sshKey.name }}
  configuration:
    {{- with .Values.oauth.identityProviders }}
    oauth:
      identityProviders:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    apiServer:
      servingCerts:
        namedCertificates:
          - names:
              - {{ $kubeAPIServerDNSName }}
            servingCertificate:
              name: {{ $clusterName }}-api-certificate
          - names:
              - {{ $oauthHostname }}
            servingCertificate:
              name: {{ $clusterName }}-oauth-certificate
