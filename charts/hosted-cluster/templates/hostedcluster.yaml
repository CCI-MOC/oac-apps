{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- $release_channel := required "release.channel is required" .Values.release.channel }}
{{- $release_image := required "release.image is required" .Values.release.image }}
{{- $baseDomain := include "hosted-cluster.baseDomain" . }}
{{- $platformType := .Values.platform.type | default "Agent" }}
{{- if eq $platformType "Agent" }}
{{- $kubeAPIServerDNSName := include "hosted-cluster.kubeAPIServerDNSName" . }}
{{- $oauthHostname := include "hosted-cluster.oauthHostname" . }}
{{- end }}
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.hostedCluster.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    {{- with .Values.hostedCluster.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  controllerAvailabilityPolicy: {{ .Values.controllerAvailabilityPolicy }}
  dns:
    baseDomain: {{ $baseDomain }}
  etcd:
    managed:
      storage:
        persistentVolume:
          size: {{ .Values.etcd.storageSize }}
          storageClassName: {{ .Values.etcd.storageClassName }}
        type: PersistentVolume
    managementType: Managed
  fips: {{ .Values.fips }}
  networking:
    clusterNetwork:
      {{- toYaml .Values.networking.clusterNetwork | nindent 6 }}
    {{- with .Values.networking.machineNetwork }}
    machineNetwork:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    networkType: {{ .Values.networking.networkType }}
    serviceNetwork:
      {{- toYaml .Values.networking.serviceNetwork | nindent 6 }}
  pullSecret:
    name: {{ .Values.pullSecret.name }}
  channel: {{ $release_channel }}
  release:
    image: {{ $release_image }}
  secretEncryption:
    aescbc:
      activeKey:
        name: {{ $clusterName }}-etcd-encryption-key
    type: aescbc
  operatorConfiguration:
    ingressOperator:
      endpointPublishingStrategy:
        type: {{ .Values.ingress.type }}
        {{- if eq $platformType "Agent" }}
        loadBalancer:
          scope: {{ .Values.ingress.scope }}
          dnsManagementPolicy: {{ .Values.ingress.dnsManagementPolicy }}
        {{- end }}
  {{- with .Values.sshKey.name }}
  sshKey:
    name: {{ . }}
  {{- end }}
  {{- if eq $platformType "Agent" }}
  kubeAPIServerDNSName: {{ include "hosted-cluster.kubeAPIServerDNSName" . }}
  olmCatalogPlacement: {{ .Values.olmCatalogPlacement }}
  {{- with .Values.monitoring }}
  monitoring:
    {{- with .metricsSet }}
    # The cluster-wide default. The forwarding path can override it below, and
    # both override the operator's global METRICS_SET.
    metricsSet: {{ . }}
    {{- end }}
    {{- with .metricsForwarding }}
    metricsForwarding:
      # mode is written unconditionally, even when values only ask for a
      # metrics set. An empty mode disables forwarding rather than leaving it
      # untouched, so omitting it here would silently forward nothing.
      mode: {{ .mode | default "Forward" }}
      {{- with .metricsSet }}
      metricsSet: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  platform:
    agent:
      agentNamespace: {{ .Values.platform.agent.namespace }}
    type: Agent
  services:
    {{- $allDefaults := include "hosted-cluster.serviceDefaults" . | fromYaml }}
    {{- range $serviceName := list "APIServer" "Ignition" "Konnectivity" "OAuthServer" "OIDC" }}
    {{- $svcDef := index $allDefaults $serviceName }}
    {{- $serviceConfig := dig $serviceName dict $.Values.services }}
    {{- $hostname := include "hosted-cluster.serviceHostname" (dict "serviceConfig" $serviceConfig "prefix" $svcDef.prefix "facing" $svcDef.facing "clusterName" $clusterName "ctx" $) }}
    {{- $strategyType := dig "servicePublishingStrategy" "type" $svcDef.defaultType $serviceConfig }}
    {{- $autoStrategy := dict "type" $strategyType }}
    {{- if and $hostname (eq $strategyType "NodePort") }}
      {{- $_ := set $autoStrategy "nodePort" (dict "address" $hostname) }}
    {{- else if and $hostname (eq $strategyType "LoadBalancer") }}
      {{- $_ := set $autoStrategy "loadBalancer" (dict "hostname" $hostname) }}
    {{- else if and $hostname (eq $strategyType "Route") }}
      {{- $_ := set $autoStrategy "route" (dict "hostname" $hostname) }}
    {{- end }}
    {{- $userStrategy := dig "servicePublishingStrategy" dict $serviceConfig }}
    {{- $finalStrategy := mustMergeOverwrite (deepCopy $autoStrategy) $userStrategy }}
    - service: {{ $serviceName }}
      servicePublishingStrategy:
        {{- toYaml $finalStrategy | nindent 8 }}
    {{- end }}
  {{- else }}
  platform:
    type: KubeVirt
    kubevirt:
      baseDomainPassthrough: true
      {{- with .Values.platform.kubevirt.infraKubeConfigSecretName }}
      credentials:
        infraKubeConfigSecret:
          name: {{ . }}
          key: kubeconfig
        infraNamespace: clusters-{{ $clusterName }}
      {{- end }}
  services:
    - service: APIServer
      servicePublishingStrategy:
        type: {{ dig "APIServer" "type" "LoadBalancer" .Values.services }}
    - service: Ignition
      servicePublishingStrategy:
        type: Route
    - service: Konnectivity
      servicePublishingStrategy:
        type: Route
    - service: OAuthServer
      servicePublishingStrategy:
        type: Route
    - service: OIDC
      servicePublishingStrategy:
        type: Route
  {{- end }}
  {{- if .Values.issuerURL }}
  issuerURL: {{ .Values.issuerURL | quote }}
  {{- else }}
  issuerURL: "https://oac-clusters-oidc.s3.us-east-1.amazonaws.com/{{ $clusterName }}"
  {{- end }}
  configuration:
    {{- $identityProviders := .Values.oauth.identityProviders }}
    {{- if and (not $identityProviders) .Values.oauth.mocsso.enabled }}
    {{- $identityProviders = list (include "hosted-cluster.mocssoIdentityProvider" . | fromYaml) }}
    {{- end }}
    {{- if or $identityProviders .Values.oauth.tokenConfig }}
    oauth:
      {{- with $identityProviders }}
      identityProviders:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oauth.tokenConfig }}
      tokenConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if eq $platformType "Agent" }}
    apiServer:
      servingCerts:
        namedCertificates:
          - names:
              - {{ include "hosted-cluster.kubeAPIServerDNSName" . }}
            servingCertificate:
              name: {{ $clusterName }}-api-certificate
          - names:
              - {{ include "hosted-cluster.oauthHostname" . }}
            servingCertificate:
              name: {{ $clusterName }}-oauth-certificate
    {{- with .Values.apiServer.audit }}
      audit:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- with .Values.imageConfig }}
    image:
      {{- toYaml . | nindent 6 }}
    {{- end }}
