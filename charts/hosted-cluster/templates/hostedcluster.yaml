{{- $clusterName := required "clusterName is required" .Values.clusterName }}
{{- $kubeAPIServerDNSName := .Values.kubeAPIServerDNSName | default (printf "api.%s.%s" $clusterName .Values.baseDomain) }}
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  kubeAPIServerDNSName: {{ $kubeAPIServerDNSName }}
  controllerAvailabilityPolicy: {{ .Values.controllerAvailabilityPolicy }}
  dns:
    baseDomain: {{ .Values.baseDomain }}
  etcd:
    managed:
      storage:
        persistentVolume:
          size: {{ .Values.etcd.storageSize }}
          storageClassName: {{ .Values.etcd.storageClassName }}
        type: PersistentVolume
    managementType: Managed
  fips: {{ .Values.fips }}
  networking:
    clusterNetwork:
      {{- toYaml .Values.networking.clusterNetwork | nindent 6 }}
    networkType: {{ .Values.networking.networkType }}
    serviceNetwork:
      {{- toYaml .Values.networking.serviceNetwork | nindent 6 }}
  olmCatalogPlacement: {{ .Values.olmCatalogPlacement }}
  platform:
    agent:
      agentNamespace: {{ .Values.platform.agentNamespace }}
    type: Agent
  pullSecret:
    name: {{ .Values.pullSecret.name }}
  release:
    image: {{ .Values.release.image }}
  secretEncryption:
    aescbc:
      activeKey:
        name: {{ $clusterName }}-etcd-encryption-key
    type: aescbc
  services:
    {{- $serviceDefaults := list
      (dict "name" "APIServer" "prefix" "api" "defaultType" "NodePort")
      (dict "name" "Ignition" "prefix" "ignition" "defaultType" "Route")
      (dict "name" "Konnectivity" "prefix" "konnectivity" "defaultType" "Route")
      (dict "name" "OAuthServer" "prefix" "oauth" "defaultType" "NodePort")
      (dict "name" "OIDC" "prefix" "" "defaultType" "Route")
    }}
    {{- range $svc := $serviceDefaults }}
    {{- $serviceConfig := dig $svc.name dict $.Values.services }}
    {{- $hostname := dig "hostname" "" $serviceConfig }}
    {{- if and (not $hostname) $svc.prefix }}
      {{- $hostname = printf "%s-%s.%s" $svc.prefix $clusterName $.Values.baseDomain }}
    {{- end }}
    {{- $strategyType := dig "servicePublishingStrategy" "type" $svc.defaultType $serviceConfig }}
    - service: {{ $svc.name }}
      servicePublishingStrategy:
        type: {{ $strategyType }}
        {{- if and $hostname (eq $strategyType "NodePort") }}
        nodePort:
          address: {{ $hostname }}
        {{- else if and $hostname (eq $strategyType "LoadBalancer") }}
        loadBalancer:
          hostname: {{ $hostname }}
        {{- else if and $hostname (eq $strategyType "Route") }}
        route:
          hostname: {{ $hostname }}
        {{- end }}
    {{- end }}
  {{- if .Values.issuerURL }}
  issuerURL: {{ .Values.issuerURL | quote }}
  {{- else }}
  issuerURL: "https://oac-clusters-oidc.s3.us-east-1.amazonaws.com/{{ $clusterName }}"
  {{- end }}
  operatorConfiguration:
    ingressOperator:
      endpointPublishingStrategy:
        type: {{ .Values.ingress.type }}
        loadBalancer:
          scope: {{ .Values.ingress.scope }}
          dnsManagementPolicy: {{ .Values.ingress.dnsManagementPolicy }}
  sshKey:
    name: {{ .Values.sshKey.name }}
  configuration:
    {{- if .Values.oauth.github.enabled }}
    oauth:
      identityProviders:
        - name: github
          mappingMethod: {{ .Values.oauth.github.mappingMethod }}
          type: GitHub
          github:
            clientID: {{ .Values.oauth.github.clientID | quote }}
            clientSecret:
              name: {{ $clusterName }}-github-oauth-client-secret
            {{- with .Values.oauth.github.teams }}
            teams:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- end }}
    apiServer:
      servingCerts:
        namedCertificates:
          - names:
              - {{ $kubeAPIServerDNSName }}
            servingCertificate:
              name: {{ $clusterName }}-api-certificate
