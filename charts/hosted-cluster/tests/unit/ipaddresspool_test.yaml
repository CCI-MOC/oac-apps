suite: IPAddressPool and L2Advertisement templates
templates:
  - templates/ipaddresspool.yaml
set:
  clusterName: test-cluster

tests:
  - it: should not generate resources when no service has ipAddress
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate IPAddressPool and L2Advertisement for service with ipAddress
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: IPAddressPool
          apiVersion: metallb.io/v1beta1
          name: test-cluster-apiserver
          any: true
      - containsDocument:
          kind: L2Advertisement
          apiVersion: metallb.io/v1beta1
          name: test-cluster-apiserver
          any: true

  - it: should use the correct IP address in the pool
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
    asserts:
      - equal:
          path: spec.addresses[0]
          value: "10.20.5.10/32"
        documentIndex: 0

  - it: should enable autoAssign so MetalLB can assign the reserved address to the matching service
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
    asserts:
      - equal:
          path: spec.autoAssign
          value: true
        documentIndex: 0

  - it: should scope the pool to the API service via serviceAllocation selectors
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
    asserts:
      - equal:
          path: spec.serviceAllocation.namespaceSelectors[0].matchLabels['kubernetes.io/metadata.name']
          value: clusters-test-cluster
        documentIndex: 0
      - equal:
          path: spec.serviceAllocation.serviceSelectors[0].matchLabels.app
          value: kube-apiserver
        documentIndex: 0

  - it: should reference the pool in the L2Advertisement
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
    asserts:
      - equal:
          path: spec.ipAddressPools[0]
          value: test-cluster-apiserver
        documentIndex: 1

  - it: should fail when a non-APIServer service has ipAddress
    set:
      services:
        OAuthServer:
          ipAddress: "10.20.5.11"
    asserts:
      - failedTemplate:
          errorMessage: 'service "OAuthServer" has ipAddress but only APIServer supports LoadBalancer publishing on the Agent platform'

  - it: should generate only APIServer resources and ignore other services without ipAddress
    set:
      services:
        APIServer:
          ipAddress: "10.20.5.10"
        OAuthServer:
          servicePublishingStrategy:
            type: Route
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: IPAddressPool
          apiVersion: metallb.io/v1beta1
          name: test-cluster-apiserver
          any: true
