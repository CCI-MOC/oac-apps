suite: etcd encryption key ExternalSecret template
templates:
  - templates/etcd-encryption-key.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud
  managementCluster: test-hub
  hcpInternalDomain: hcp.infra.oac.int.massopen.cloud

tests:
  - it: should render a single ExternalSecret in the cluster namespace
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
      - equal:
          path: metadata.namespace
          value: clusters

  - it: should carry the sync-wave and skip-dry-run sync options
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: should own its target and source the key from the ClusterGenerator
    asserts:
      - equal:
          path: spec.target.name
          value: test-cluster-etcd-encryption-key
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.kind
          value: ClusterGenerator
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: etcd-encryption-key
