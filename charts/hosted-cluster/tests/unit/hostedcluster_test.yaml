suite: HostedCluster template
templates:
  - templates/hostedcluster.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud
  hcpInternalDomain: hcp.infra.oac.int.massopen.cloud
  release:
    channel: stable-4.21
    image: quay.io/openshift-release-dev/ocp-release:4.21.0-multi

tests:
  - it: should default APIServer to LoadBalancer with internal-domain hostname
    asserts:
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: LoadBalancer
              loadBalancer:
                hostname: api-internal-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should default OAuthServer to Route with external-domain hostname
    asserts:
      - contains:
          path: spec.services
          content:
            service: OAuthServer
            servicePublishingStrategy:
              type: Route
              route:
                hostname: oauth-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should use LoadBalancer with derived hostname when strategy type is LoadBalancer
    set:
      services:
        APIServer:
          servicePublishingStrategy:
            type: LoadBalancer
    asserts:
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: LoadBalancer
              loadBalancer:
                hostname: api-internal-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should use custom hostname in LoadBalancer strategy
    set:
      services:
        APIServer:
          hostname: custom-api.example.com
          servicePublishingStrategy:
            type: LoadBalancer
    asserts:
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: LoadBalancer
              loadBalancer:
                hostname: custom-api.example.com

  - it: should use custom hostname in Route strategy
    set:
      services:
        OAuthServer:
          hostname: custom-oauth.example.com
          servicePublishingStrategy:
            type: Route
    asserts:
      - contains:
          path: spec.services
          content:
            service: OAuthServer
            servicePublishingStrategy:
              type: Route
              route:
                hostname: custom-oauth.example.com

  - it: should default Ignition and Konnectivity to Route with internal-domain hostnames
    asserts:
      - contains:
          path: spec.services
          content:
            service: Ignition
            servicePublishingStrategy:
              type: Route
              route:
                hostname: ignition-test-cluster.hcp.infra.oac.int.massopen.cloud
      - contains:
          path: spec.services
          content:
            service: Konnectivity
            servicePublishingStrategy:
              type: Route
              route:
                hostname: konnectivity-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should default OIDC to Route with no hostname
    asserts:
      - contains:
          path: spec.services
          content:
            service: OIDC
            servicePublishingStrategy:
              type: Route

  - it: should default kubeAPIServerDNSName to the external-domain name
    asserts:
      - equal:
          path: spec.kubeAPIServerDNSName
          value: api-external-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should allow overriding kubeAPIServerDNSName
    set:
      kubeAPIServerDNSName: api.custom.example.com
    asserts:
      - equal:
          path: spec.kubeAPIServerDNSName
          value: api.custom.example.com

  - it: should use the external-domain name in the API named certificate
    asserts:
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[0].names[0]
          value: api-external-test-cluster.hcp.infra.oac.int.massopen.cloud

  - it: should use overridden kubeAPIServerDNSName in named certificate
    set:
      kubeAPIServerDNSName: api.custom.example.com
    asserts:
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[0].names[0]
          value: api.custom.example.com

  - it: should serve a named certificate for the OAuth hostname
    asserts:
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[1].names[0]
          value: oauth-test-cluster.hcp.infra.oac.int.massopen.cloud
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[1].servingCertificate.name
          value: test-cluster-oauth-certificate

  - it: should use the OAuthServer hostname override in the named certificate
    set:
      services:
        OAuthServer:
          hostname: oauth.custom.example.com
    asserts:
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[1].names[0]
          value: oauth.custom.example.com

  - it: should preserve additional strategy fields from values
    set:
      services:
        APIServer:
          servicePublishingStrategy:
            type: NodePort
            nodePort:
              port: 12345
    asserts:
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: NodePort
              nodePort:
                address: api-internal-test-cluster.hcp.infra.oac.int.massopen.cloud
                port: 12345

  - it: should not render labels when hostedCluster.labels is empty
    asserts:
      - notExists:
          path: metadata.labels

  - it: should render custom labels on the HostedCluster
    set:
      hostedCluster:
        labels:
          my-label: my-value
          another-label: another-value
    asserts:
      - equal:
          path: metadata.labels.my-label
          value: my-value
      - equal:
          path: metadata.labels.another-label
          value: another-value

  - it: should always include the sync-wave annotation
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"

  - it: should merge custom annotations with sync-wave
    set:
      hostedCluster:
        annotations:
          argocd.argoproj.io/sync-options: Replace=true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Replace=true

  - it: should not render oauth configuration when no identity providers are set
    asserts:
      - notExists:
          path: spec.configuration.oauth

  - it: should render identity providers verbatim
    set:
      oauth:
        identityProviders:
          - name: github
            type: GitHub
            mappingMethod: claim
            github:
              clientID: abc123
              clientSecret:
                name: my-github-secret
              teams:
                - CCI-MOC/open-accelerator-admins
          - name: htpasswd
            type: HTPasswd
            mappingMethod: claim
            htpasswd:
              fileData:
                name: my-htpasswd-secret
    asserts:
      - equal:
          path: spec.configuration.oauth.identityProviders[0]
          value:
            name: github
            type: GitHub
            mappingMethod: claim
            github:
              clientID: abc123
              clientSecret:
                name: my-github-secret
              teams:
                - CCI-MOC/open-accelerator-admins
      - equal:
          path: spec.configuration.oauth.identityProviders[1].name
          value: htpasswd

  - it: should synthesize a mocsso identity provider when enabled
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
    asserts:
      - equal:
          path: spec.configuration.oauth.identityProviders
          value:
            - name: mocsso
              mappingMethod: claim
              type: OpenID
              openID:
                clientID: test-cluster
                clientSecret:
                  name: test-cluster-keycloak-client-secret
                claims:
                  preferredUsername:
                    - preferred_username
                    - username
                  name:
                    - name
                    - full name
                  email:
                    - email
                  groups:
                    - groups
                issuer: https://sso.massopen.cloud/realms/moc
                extraScopes:
                  - groups

  - it: should allow overriding mocsso fields
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
          clientID: custom-client
          secretName: custom-secret
          name: custom-mocsso
          mappingMethod: lookup
          issuer: https://sso.example.com/realms/custom
    asserts:
      - equal:
          path: spec.configuration.oauth.identityProviders[0].name
          value: custom-mocsso
      - equal:
          path: spec.configuration.oauth.identityProviders[0].mappingMethod
          value: lookup
      - equal:
          path: spec.configuration.oauth.identityProviders[0].openID.clientID
          value: custom-client
      - equal:
          path: spec.configuration.oauth.identityProviders[0].openID.clientSecret.name
          value: custom-secret
      - equal:
          path: spec.configuration.oauth.identityProviders[0].openID.issuer
          value: https://sso.example.com/realms/custom

  - it: should let explicit identityProviders win over mocsso
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
        identityProviders:
          - name: github
            type: GitHub
            mappingMethod: claim
            github:
              clientID: abc123
              clientSecret:
                name: my-github-secret
    asserts:
      - equal:
          path: spec.configuration.oauth.identityProviders
          value:
            - name: github
              type: GitHub
              mappingMethod: claim
              github:
                clientID: abc123
                clientSecret:
                  name: my-github-secret

  - it: should let strategy-level hostname override derived hostname
    set:
      services:
        APIServer:
          servicePublishingStrategy:
            type: LoadBalancer
            loadBalancer:
              hostname: explicit.example.com
    asserts:
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: LoadBalancer
              loadBalancer:
                hostname: explicit.example.com

  - it: should split external and internal domains when hcpExternalDomain differs from hcpInternalDomain
    set:
      hcpExternalDomain: ext.example.com
    asserts:
      - equal:
          path: spec.kubeAPIServerDNSName
          value: api-external-test-cluster.ext.example.com
      - contains:
          path: spec.services
          content:
            service: OAuthServer
            servicePublishingStrategy:
              type: Route
              route:
                hostname: oauth-test-cluster.ext.example.com
      - contains:
          path: spec.services
          content:
            service: APIServer
            servicePublishingStrategy:
              type: LoadBalancer
              loadBalancer:
                hostname: api-internal-test-cluster.hcp.infra.oac.int.massopen.cloud
      - contains:
          path: spec.services
          content:
            service: Konnectivity
            servicePublishingStrategy:
              type: Route
              route:
                hostname: konnectivity-test-cluster.hcp.infra.oac.int.massopen.cloud
      - contains:
          path: spec.services
          content:
            service: Ignition
            servicePublishingStrategy:
              type: Route
              route:
                hostname: ignition-test-cluster.hcp.infra.oac.int.massopen.cloud

  # Forwarding is opt-in. A hosted cluster that does not ask for it must not
  # grow a spec.monitoring block at all.
  - it: does not set monitoring unless asked
    asserts:
      - notExists:
          path: spec.monitoring

  # mode must always be rendered when metricsForwarding exists. OCP 4.22
  # Hosted control planes 13.5.2 warns that an empty mode disables forwarding,
  # so a template branch that omits it would silently do nothing.
  - it: always renders mode when forwarding is configured
    set:
      monitoring:
        metricsForwarding:
          metricsSet: SRE
    asserts:
      - equal:
          path: spec.monitoring.metricsForwarding.mode
          value: Forward
      - equal:
          path: spec.monitoring.metricsForwarding.metricsSet
          value: SRE

  - it: forwards control plane metrics into the hosted cluster
    set:
      monitoring:
        metricsForwarding:
          mode: Forward
          metricsSet: SRE
    asserts:
      - equal:
          path: spec.monitoring.metricsForwarding.mode
          value: Forward
      - equal:
          path: spec.monitoring.metricsForwarding.metricsSet
          value: SRE

  - it: can turn forwarding off explicitly
    set:
      monitoring:
        metricsForwarding:
          mode: None
    asserts:
      - equal:
          path: spec.monitoring.metricsForwarding.mode
          value: None
      - notExists:
          path: spec.monitoring.metricsForwarding.metricsSet

  # The cluster-wide default sits one level up. 13.5.2 gives the precedence as
  # metricsForwarding.metricsSet over metricsSet over the global METRICS_SET
  # env var, so both places have to be reachable from values.
  - it: sets the cluster wide metrics set without touching forwarding
    set:
      monitoring:
        metricsSet: SRE
    asserts:
      - equal:
          path: spec.monitoring.metricsSet
          value: SRE
      - notExists:
          path: spec.monitoring.metricsForwarding
