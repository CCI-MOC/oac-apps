suite: NodePool machineConfigs template
templates:
  - templates/nodepool-machineconfigs.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud
  managementCluster: test-hub
  hcpInternalDomain: hcp.infra.oac.int.massopen.cloud
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.21.0-multi

tests:
  - it: should render nothing when no pool has machineConfigs
    set:
      nodePools:
        - name: compute
          replicas: 1
          agentLabelSelector: {role: worker}
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ConfigMap per entry, named <cluster>-<pool>-<name>
    set:
      nodePools:
        - name: compute
          replicas: 1
          agentLabelSelector: {role: worker}
          machineConfigs:
            - name: 80-eno2-never-default
              files:
                - path: /etc/NetworkManager/system-connections/eno2.nmconnection
                  mode: 0600
                  contents: "[connection]\n"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-cluster-compute-80-eno2-never-default
      - equal:
          path: metadata.namespace
          value: clusters
      - matchRegex:
          path: data.config
          pattern: "name: 80-eno2-never-default"
      - matchRegex:
          path: data.config
          pattern: "machineconfiguration.openshift.io/role: worker"
      - matchRegex:
          path: data.config
          pattern: "mode: 384"
      - matchRegex:
          path: data.config
          pattern: "source: data:text/plain;charset=utf-8;base64,W2Nvbm5lY3Rpb25dCg=="

  - it: should default a file's mode to 0644
    set:
      nodePools:
        - name: compute
          replicas: 1
          agentLabelSelector: {role: worker}
          machineConfigs:
            - name: 80-example
              files:
                - path: /etc/example
                  contents: x
    asserts:
      - matchRegex:
          path: data.config
          pattern: "mode: 420"

  - it: should render kernelArguments in a pool's MachineConfig
    set:
      nodePools:
        - name: gpu
          replicas: 1
          agentLabelSelector: {role: worker}
          machineConfigs:
            - name: 80-nosmt
              kernelArguments: [nosmt]
    asserts:
      - matchRegex:
          path: data.config
          pattern: "kernelArguments:\\n\\s*- nosmt"
