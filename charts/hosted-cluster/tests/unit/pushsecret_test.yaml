suite: PushSecret template
templates:
  - templates/pushsecret.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud
  managementCluster: test-hub

tests:
  - it: should render the admin-credentials and etcd push secrets by default
    # kubeadmin_password is disabled by default (its secret is deleted once an
    # oauth provider is configured), so only two push secrets render.
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 1

  - it: should render all three push secrets when the kubeadmin password is enabled
    set:
      pushSecrets:
        kubeadmin_password:
          enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 2

  - it: should omit the admin-credentials push secret when kubeadmin_kubeconfig is disabled
    set:
      pushSecrets:
        kubeadmin_kubeconfig:
          enabled: false
        kubeadmin_password:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 1

  - it: should omit the etcd push secret when disabled
    set:
      pushSecrets:
        kubeadmin_password:
          enabled: true
        etcd:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 1

  - it: should annotate the etcd push secret with sync-wave 1
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        documentSelector:
          path: metadata.name
          value: test-cluster-etcd-encryption-key

  - it: should render nothing when all push secrets are disabled
    set:
      pushSecrets:
        kubeadmin_kubeconfig:
          enabled: false
        kubeadmin_password:
          enabled: false
        etcd:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
