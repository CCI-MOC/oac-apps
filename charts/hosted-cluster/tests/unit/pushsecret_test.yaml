suite: PushSecret template
templates:
  - templates/pushsecret.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud
  managementCluster: test-hub

tests:
  - it: should render all three push secrets by default
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 2

  - it: should omit the kubeadmin-password push secret when disabled
    set:
      pushSecrets:
        kubeadmin_password:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 1

  - it: should omit the kubeadmin-kubeconfig push secret when disabled
    set:
      pushSecrets:
        kubeadmin_kubeconfig:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-etcd-encryption-key
        documentIndex: 1

  - it: should omit the etcd push secret when disabled
    set:
      pushSecrets:
        etcd:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: test-cluster-admin-credentials
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-kubeadmin-password
        documentIndex: 1

  - it: should render nothing when all push secrets are disabled
    set:
      pushSecrets:
        kubeadmin_kubeconfig:
          enabled: false
        kubeadmin_password:
          enabled: false
        etcd:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
