suite: ExternalSecrets template
templates:
  - templates/externalsecrets.yaml
set:
  clusterName: test-cluster
  baseDomain: apps.infra.oac.int.massopen.cloud

tests:
  - it: should render nothing when externalSecrets is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ExternalSecret per entry
    set:
      externalSecrets:
        - name: first-secret
          spec:
            target:
              name: first-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/first
        - name: second-secret
          spec:
            target:
              name: second-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/second
    asserts:
      - hasDocuments:
          count: 2

  - it: should default the secretStoreRef to the chart secretStore
    set:
      externalSecrets:
        - name: my-secret
          spec:
            target:
              name: my-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/value
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: my-secret
      - equal:
          path: metadata.namespace
          value: clusters
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.data[0].remoteRef.key
          value: path/to/value
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: should allow overriding the secretStoreRef per entry
    set:
      externalSecrets:
        - name: my-secret
          spec:
            secretStoreRef:
              name: custom-store
              kind: SecretStore
            target:
              name: my-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/value
    documentIndex: 0
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: custom-store
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: should default only the missing secretStoreRef fields
    set:
      externalSecrets:
        - name: my-secret
          spec:
            secretStoreRef:
              name: custom-store
            target:
              name: my-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/value
    documentIndex: 0
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: custom-store
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  - it: should fail closed when an entry has no name
    set:
      externalSecrets:
        - spec:
            target:
              name: my-secret
    asserts:
      - failedTemplate:
          errorMessage: each externalSecrets entry requires a name

  - it: should synthesize an ExternalSecret for mocsso when enabled
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: test-cluster-keycloak-client-secret
      - equal:
          path: spec.target.name
          value: test-cluster-keycloak-client-secret
      - equal:
          path: spec.data[0].secretKey
          value: clientSecret
      - equal:
          path: spec.data[0].remoteRef.key
          value: cluster/oac-dev-infra/hostedcluster/test-cluster/keycloak-oidc
      - equal:
          path: spec.data[0].remoteRef.property
          value: client_secret
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager

  - it: should use the overridden mocsso secretName in the synthesized ExternalSecret
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
          secretName: custom-secret
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
      - equal:
          path: spec.target.name
          value: custom-secret

  - it: should render the mocsso ExternalSecret alongside manual externalSecrets entries
    set:
      managementCluster: oac-dev-infra
      oauth:
        mocsso:
          enabled: true
      externalSecrets:
        - name: other-secret
          spec:
            target:
              name: other-secret
            data:
              - secretKey: value
                remoteRef:
                  key: path/to/other
    asserts:
      - hasDocuments:
          count: 2

  - it: should fail closed when mocsso is enabled without managementCluster
    set:
      oauth:
        mocsso:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "managementCluster must be set (supply it in the hub-level values file hosted-clusters/<hub>/values.yaml)"
