clusterName: ""

namespace: clusters

hostedCluster:
  labels: {}
  annotations: {}
# baseDomain and managementCluster are per-hub values with no safe default.
# They are supplied by the hub-level values file (hosted-clusters/<hub>/values.yaml)
# and enforced with `required` in the templates, so they fail closed if unset.
baseDomain: ""

managementCluster: ""

# hcpInternalDomain is a per-hub value with no safe default (fail-closed like
# baseDomain). hcpExternalDomain is optional and inherits hcpInternalDomain when
# empty; they differ only when the shared router serves both externally-NAT'd
# and internal-only names. See docs/superpowers/specs/2026-08-28-hosted-cluster-address-dns-design.md
hcpInternalDomain: ""
hcpExternalDomain: ""

controllerAvailabilityPolicy: HighlyAvailable

release:
  channel: ""
  image: ""

platform:
  # "Agent" for bare-metal clusters, "KubeVirt" for virtualized clusters.
  type: Agent
  agent:
    namespace: hardware-inventory
  # kubevirt:
  #   # Name of a pre-existing Secret containing the hypervisor cluster
  #   # kubeconfig (created by hcp-config). When set, the HostedCluster
  #   # is configured to run VMs on the separate hypervisor cluster.
  #   # The infra namespace is derived as clusters-<clusterName>.
  #   infraKubeConfigSecretName: ""

fips: false
olmCatalogPlacement: management

# Control plane metrics. Off by default: the scheduler and the other control
# plane components run on the management cluster, so their metrics land in the
# hub's user workload monitoring, and a hosted cluster only needs them locally
# if something queries them from inside.
#
# Setting metricsForwarding starts metrics-proxy and endpoint-resolver in the
# control plane and a metrics-forwarder in the hosted cluster. It needs
# OpenShift 4.22.8 or later and a remote write endpoint already configured at
# the management cluster level.
#
# monitoring:
#   metricsSet: SRE
#   metricsForwarding:
#     mode: Forward
#     metricsSet: SRE
monitoring: {}

etcd:
  storageSize: 8Gi
  storageClassName: lvms-vg0

networking:
  clusterNetwork:
    - cidr: 10.132.0.0/14
  networkType: OVNKubernetes
  serviceNetwork:
    - cidr: 172.31.0.0/16

oauth:
  # A list of identity providers rendered verbatim into
  # spec.configuration.oauth.identityProviders on the HostedCluster. Takes
  # precedence over mocsso below when non-empty; use it for non-standard or
  # multiple identity providers.
  identityProviders: []
  # Convenience for the common case: a single MOC SSO (Keycloak) OpenID
  # identity provider plus its matching ExternalSecret, synthesized from just
  # clientID.
  mocsso:
    enabled: false
    clientID: "" # defaults to clusterName
    name: mocsso
    mappingMethod: claim
    secretName: "" # defaults to "<clientID>-keycloak-client-secret"
    issuer: https://sso.massopen.cloud/realms/moc
  # Rendered verbatim into spec.configuration.oauth.tokenConfig, e.g.
  # {accessTokenMaxAgeSeconds: 86400, accessTokenInactivityTimeout: 10m0s}.
  tokenConfig: {}

# A list of ExternalSecret resources to create for this cluster. Each entry has
# a `name` (used for metadata.name) and a `spec` block passed through verbatim.
# spec.secretStoreRef defaults to the store defined in `secretStore` below when
# it is not supplied by the entry.
externalSecrets: []

pushSecrets:
  kubeadmin_kubeconfig:
    enabled: true
  # This is disabled by default because the corresponding secrets gets deleted as
  # soon as you configure an oauth provider.
  kubeadmin_password:
    enabled: false
  etcd:
    enabled: true

# A pool's `machineConfigs` are files for that pool's nodes only, for what
# depends on its hardware (NIC names, for example). Each entry becomes a
# MachineConfig in a ConfigMap named <cluster>-<pool>-<name>, added to the
# pool's config. Changing one rolls the pool's nodes.
#   machineConfigs:
#     - name: 80-eno2-never-default
#       files:
#         - path: /etc/NetworkManager/system-connections/eno2.nmconnection
#           mode: 0600
#           contents: |
#             ...
# An entry may set `kernelArguments` instead of, or as well as, `files`.
#
# KubeVirt pools take these too, for GPU VMs (all optional):
#   nodeSelector: {kubernetes.io/hostname: <node>}  # where the VMs may run
#   hostDevices:                                     # PCI devices passed through
#     - deviceName: nvidia.com/GH100_H100_SXM5_80GB  # a permittedHostDevices name
#       count: 4
#   dedicatedCpus: true  # a host CPU per vCPU; needs the static CPU manager
#   cpuThreads: 2        # vCPUs come in sibling pairs, so cpu x 2 vCPUs
#   rollingUpdate:       # HyperShift defaults to maxSurge 1, maxUnavailable 0:
#     maxSurge: 0        # a replacement VM wanting GPUs that the old VM still
#     maxUnavailable: 1  # holds never starts. Each upgrade is then downtime.
#   machineConfigs:
#     - name: 80-nosmt
#       kernelArguments: [nosmt]  # with cpuThreads: 2, one vCPU per core
# A GPU cluster on jetty also sets ingress.type: NodePortService (below), so
# it needs no MetalLB or new addresses on jetty.
# On jetty's H100s (2026-10-29), pods in such a VM matched bare metal with
# dedicated CPUs, and small all-reduces only with SMT off in the guest.
nodePools: []

# ConfigMaps (by name, in this namespace) for NodePool.spec.config on every
# NodePool, ahead of each pool's own `config` list. Each holds one of
# MachineConfig, KubeletConfig, ContainerRuntimeConfig, ImageContentSourcePolicy
# or ClusterImagePolicy under the key `config`. Changing the list, or a
# referenced ConfigMap, rolls the pool's nodes.
# Example: [compliance-node-hardening] from the compliance-node-hardening chart.
nodePoolConfig: []

# Hosted control plane settings that a standalone cluster keeps in its
# APIServer and Image config objects. Inside a hosted cluster those objects
# are reconciled from here and cannot be changed in place.
apiServer:
  # spec.configuration.apiServer.audit, e.g.
  #   {profile: WriteRequestBodies, customRules: [{group: ..., profile: Default}]}
  audit: {}
# spec.configuration.image, e.g.
#   {registrySources: {allowedRegistries: [...]}, allowedRegistriesForImport: [...]}
imageConfig: {}

# Map of cluster labels to values that will be applied
# to the ManagedCluster resource for this cluster.
clusterLabels: {}

sshKey:
  name: oac-ssh-key

pullSecret:
  name: pull-secret

certificate:
  issuer: letsencrypt-prod-dns01
  issuerKind: ClusterIssuer
  duration: 2160h
  renewBefore: 360h

kubeAPIServerDNSName: ""

services: {}

issuerURL: ""

ingress:
  # NodePortService for a KubeVirt cluster that should reuse its hypervisor's
  # router instead of a LoadBalancer there: HyperShift then routes
  # *.apps.<clusterName>.<hypervisor's apps domain> through that router, HTTPS
  # only. The hypervisor's default IngressController must allow wildcard
  # routes, and the cluster must not get the feature-metallb label.
  type: LoadBalancerService
  scope: External
  dnsManagementPolicy: Unmanaged
  # Externally reachable IP for the guest cluster's ingress wildcard record
  # (*.apps.<clusterName>.<baseDomain>). Typically the firewall IP that NATs
  # :80/:443 to the guest router's LoadBalancer. When dns.autoGenerate is on and
  # this (or ipAddress) is set, the chart publishes the wildcard DNS record.
  externalIpAddress: ""
  # Internal-only fallback target for the ingress wildcard, used when there is
  # no externalIpAddress (e.g. baseDomain is an internally-resolved zone). This
  # does NOT pin the guest router's LoadBalancer IP -- that is MetalLB config on
  # the hosted cluster itself.
  ipAddress: ""
  # Optional override for the wildcard hostname; defaults to
  # *.apps.<clusterName>.<baseDomain>.
  hostname: ""

dns:
  enabled: false
  autoGenerate: false
  records: []

secretStore:
  name: aws-secrets-manager
  kind: ClusterSecretStore
