suite: Namespace guardrails
templates:
  - templates/guardrails.yaml

tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only a quota when only a quota is set
    set:
      namespaces:
        example:
          quota:
            pods: "10"
            services.nodeports: "0"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ResourceQuota
      - equal:
          path: metadata
          value:
            name: oac-objects
            namespace: example
      - equal:
          path: spec.hard
          value:
            pods: "10"
            services.nodeports: "0"

  - it: should take the quota's name from values
    set:
      quotaName: platform-objects
      namespaces:
        example:
          quota:
            pods: "10"
    asserts:
      - equal:
          path: metadata.name
          value: platform-objects

  # An empty direction is a plain default deny.
  - it: should deny all ingress and egress for empty directions
    set:
      namespaces:
        example:
          ingress: {}
          egress: {}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec
          value:
            podSelector: {}
            policyTypes: [Ingress]
        documentSelector:
          path: metadata.name
          value: default-deny-ingress
      - equal:
          path: spec
          value:
            podSelector: {}
            policyTypes: [Egress]
        documentSelector:
          path: metadata.name
          value: default-deny-egress

  # A deny applied first can cut off the traffic Argo needs to finish.
  - it: should apply the denies after the allow rules
    set:
      namespaces:
        example:
          ingress:
            sameNamespace: true
          egress:
            sameNamespace: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        documentSelector:
          path: metadata.name
          value: default-deny-ingress
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        documentSelector:
          path: metadata.name
          value: default-deny-egress
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: allow-same-namespace
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: allow-egress-same-namespace

  - it: should leave a direction alone when it is omitted
    set:
      namespaces:
        example:
          egress:
            apiAndDns: true
    asserts:
      - containsDocument:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          name: default-deny-ingress
          namespace: example
        not: true

  - it: should allow ingress from the namespace, monitoring and the host network
    set:
      namespaces:
        example:
          ingress:
            sameNamespace: true
            monitoringPorts: [8443, 9091]
            hostNetworkPorts: [9443]
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}
        documentSelector:
          path: metadata.name
          value: allow-same-namespace
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openshift-monitoring
              ports:
                - {port: 8443, protocol: TCP}
                - {port: 9091, protocol: TCP}
        documentSelector:
          path: metadata.name
          value: allow-platform-monitoring
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      policy-group.network.openshift.io/host-network: ""
              ports:
                - {port: 9443, protocol: TCP}
        documentSelector:
          path: metadata.name
          value: allow-webhook-from-host-network

  - it: should allow egress to the API server and DNS
    set:
      namespaces:
        example:
          egress:
            apiAndDns: true
    asserts:
      - equal:
          path: spec.egress
          value:
            - ports:
                - {protocol: TCP, port: 6443}
            - ports:
                - {protocol: UDP, port: 53}
                - {protocol: TCP, port: 53}
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openshift-dns
              ports:
                - {protocol: UDP, port: 5353}
                - {protocol: TCP, port: 5353}
        documentSelector:
          path: metadata.name
          value: allow-egress-api-dns

  # On a hosted cluster the API server is published from the hub.
  - it: should take the API server port from values
    set:
      apiServerPort: 443
      namespaces:
        example:
          egress:
            apiAndDns: true
    asserts:
      - equal:
          path: spec.egress[0].ports
          value:
            - {protocol: TCP, port: 443}
        documentSelector:
          path: metadata.name
          value: allow-egress-api-dns

  - it: should allow egress within the namespace
    set:
      namespaces:
        example:
          egress:
            sameNamespace: true
    asserts:
      - equal:
          path: spec.egress
          value:
            - to:
                - podSelector: {}
        documentSelector:
          path: metadata.name
          value: allow-egress-same-namespace

  - it: should render extra policies verbatim
    set:
      namespaces:
        example:
          extraPolicies:
            - name: allow-egress-https
              spec:
                podSelector: {}
                policyTypes: [Egress]
                egress:
                  - ports: [{protocol: TCP, port: 443}]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata
          value:
            name: allow-egress-https
            namespace: example
      - equal:
          path: spec
          value:
            podSelector: {}
            policyTypes: [Egress]
            egress:
              - ports: [{protocol: TCP, port: 443}]

  - it: should render each namespace separately
    set:
      namespaces:
        one:
          ingress: {}
        two:
          ingress: {}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: one
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: two
        documentIndex: 1
