keycloak:
  name: mocsso
  mappingMethod: claim
  clientID: ""
  secretName: keycloak-client-secret
  issuer: https://sso.massopen.cloud/realms/moc
  extraScopes:
    - groups

# Rendered verbatim into spec.tokenConfig of the OAuth resource, e.g.
# {accessTokenMaxAgeSeconds: 86400, accessTokenInactivityTimeout: 10m0s}.
tokenConfig: {}

externalSecret:
  secretStore: aws-secrets-manager
  secretStoreType: ClusterSecretStore
  remoteProperty: client_secret
  remoteKey: ""
