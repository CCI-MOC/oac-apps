{{- $clientID := required "keycloak.clientID is required" .Values.keycloak.clientID }}
apiVersion: config.openshift.io/v1
kind: Console
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  authentication:
    logoutRedirect: "{{ .Values.keycloak.issuer }}/protocol/openid-connect/logout?client_id={{ $clientID }}&post_logout_redirect_uri=https%3A%2F%2Fcilogon.org%2Flogout%2F"
