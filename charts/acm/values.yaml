namespace: open-cluster-management

operatorgroup:
  targetNamespaces: true

subscription:
  channel: release-2.17
  name: advanced-cluster-management
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

multiClusterHub:
  availabilityConfig: Basic

cim:
  enabled: false
  agentservice_database_size: 100Gi
  agentservice_filesystem_size: 500Gi
  agentservice_image_size: 200Gi
  pull_secret_name: pull-secret
  location: DataCenter
  inventory_namespace: hardware-inventory
  inventory_name: hardware-inventory
  additionalNTPSources:
    - us.pool.ntp.org
  # Extra kernel arguments for the discovery image, e.g.
  # [{operation: append, value: fips=1}].
  kernelArguments: []

# NetworkPolicies and quotas for ACM's namespaces on the hub, including the
# ones ACM creates itself (open-cluster-management-agent-addon and others),
# keyed by namespace. Settings are described in
# charts/namespace-guardrails/templates/_guardrails.tpl.
guardrails: {}
