apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: {{ .Values.letsencrypt.server }}
    email: {{ required "letsencrypt.email is required" .Values.letsencrypt.email }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          route53:
            region: {{ .Values.aws.region }}
            hostedZoneID: {{ required "aws.hostedZoneID is required" .Values.aws.hostedZoneID }}
            role: {{ required "aws.roleArn is required" .Values.aws.roleArn }}
            auth:
              kubernetes:
                serviceAccountRef:
                  name: cert-manager
