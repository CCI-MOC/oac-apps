namespace: cert-manager-operator

operatorgroup:
  targetNamespaces: false

subscription:
  channel: stable-v1
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

aws:
  region: us-east-1
  roleArn: ""
  # Optional. When left empty, cert-manager auto-discovers the Route53
  # hosted zone via ListHostedZonesByName. Set this to pin a specific zone
  # (e.g. to disambiguate public/private zones with the same name).
  hostedZoneID: ""

letsencrypt:
  email: ""
  production_server: https://acme-v02.api.letsencrypt.org/directory
  staging_server: https://acme-staging-v02.api.letsencrypt.org/directory
  cluster_issuers:
    enabled: false
