namespace: portworx
operatorgroup:
  targetNamespaces: true
subscription:
  channel: stable
  name: portworx-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

externalSecret:
  secretStore: aws-secrets-manager
  remoteKey: ""

portworx:
  is_default_storage_class: true
  nfs_server: nfs-server
  nfs_policy: export-policy
  # NFS over TLS (RFC 9289): adds xprtsec=tls to the mount options. For
  # compliant clusters. Set nfs_policy to the realm's TLS export policy
  # (export-policy-tls) too, and run tlshd on every node that mounts
  # storage, or every mount fails. Do not mix TLS and cleartext volumes on
  # one cluster: a node with a cleartext mount to the FlashBlade reuses
  # that session for later TLS mounts, and they fail.
  tls: false
  snapshot_directory: "true"  # as today. quoted, a bare bool renders empty

  # What the RHOAI dashboard shows for this storage class.
  dashboard:
    display_name: pure-fb-nfsv4
    last_modified: "2026-09-17T00:00:00Z"
    access_modes:
      ReadWriteOnce: true
      ReadWriteMany: true
      ReadOnlyMany: false
      ReadWriteOncePod: false

  tolerations:
    - operator: "Exists"
      effect: "NoSchedule"

network:
  cidr: ""
  range:
    start: ""
    end: ""
  routes: []

nodes: []
