namespace: portworx
operatorgroup:
  targetNamespaces: true
subscription:
  channel: stable
  name: portworx-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

externalSecret:
  secretStore: aws-secrets-manager
  remoteKey: ""

portworx:
  is_default_storage_class: true
  nfs_server: nfs-server
  nfs_policy: export-policy

  # Off, because the read-only .snapshot directory FlashBlade adds breaks any
  # application that locks its data directory on start. Portworx names the same
  # symptom for restores.
  #
  # This is the FlashBlade directory on the NFS export, not the CSI VolumeSnapshot
  # API: "Determines whether the .snapshot directory is enabled on FlashBlade
  # filesystems or not". Nothing on these clusters uses VolumeSnapshots, so there
  # is nothing to lose either way.
  #
  # Applies to volumes created after this is set; existing ones need the Snapshot
  # option cleared in the FlashBlade console.
  fb_nfs_snapshot: false

  # What the RHOAI dashboard shows for this storage class.
  dashboard:
    display_name: pure-fb-nfsv4
    last_modified: "2026-09-17T00:00:00Z"
    access_modes:
      ReadWriteOnce: true
      ReadWriteMany: true
      ReadOnlyMany: false
      ReadWriteOncePod: false

  tolerations:
    - operator: "Exists"
      effect: "NoSchedule"

network:
  cidr: ""
  range:
    start: ""
    end: ""
  routes: []

nodes: []
