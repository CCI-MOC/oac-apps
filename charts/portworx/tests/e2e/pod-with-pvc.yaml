apiVersion: "v1"
kind: "Pod"
metadata:
  name: "testpod"
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: "testpod"
      image: "docker.io/alpine"
      command:
        - sleep
        - inf
      volumeMounts:
        - mountPath: "/data"
          name: "testvolume"
  volumes:
    - name: "testvolume"
      persistentVolumeClaim:
        claimName: "testvolume"
