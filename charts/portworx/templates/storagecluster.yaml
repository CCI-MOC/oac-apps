    portworx.io/misc-args: "--oem px-csi"
    # portworx.io/disable-csi-host-network: "true" # configure networking
spec:
  image: portworx/px-pure-csi-driver:26.2.0
  imagePullPolicy: Always
  # network: # This is untested but its there in the documentation
  #   dataInterface: eno5np0
  #   mgmtInterface: eno6np0
  csi:
    enabled: true
  metadata:
    annotations:
      pod/storage:
        k8s.v1.cni.cncf.io/networks: storage-network
  monitoring:
    telemetry:
      enabled: true
    prometheus:
      enabled: false # Do not deploy PX Prometheus. Use OpenShift’s Prometheus instead.
      exportMetrics: true # Export metrics to OpenShift Prometheus
  network:
    dataInterface: "net1"
    mgmtInterface: "net1"
