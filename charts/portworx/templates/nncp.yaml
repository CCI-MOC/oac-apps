{{ range .Values.nodes }}
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br-storage-{{ .name }}
spec:
  desiredState:
    interfaces:
    - ipv4:
        enabled: false
      ipv6:
        enabled: false
      name: {{ .interface }}
      state: up
      type: ethernet
    - bridge:
        options:
          stp:
            enabled: false
        port:
        - name: {{ .interface }}
      ipv4:
        dhcp: true
        enabled: true
      ipv6:
        enabled: false
      name: br-storage
      state: up
      type: linux-bridge
  nodeSelector:
    kubernetes.io/hostname: {{ .name }}
---
{{ end }}
