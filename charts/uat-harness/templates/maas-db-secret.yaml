{{- /*
The MaaS test's PostgreSQL password, which the database and both portals read.
Test users can't create Secrets, so the chart has External Secrets generate it.
The generator is the namespaced Password kind, so nothing here is cluster
scoped. refreshInterval "0" generates it once and keeps it, so ArgoCD sees the
same Secret on every sync, as with user-projects' Grafana cookie secret.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: maas-db-password
  namespace: uat-project
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  symbols: 0
  digits: 10
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-db
  namespace: uat-project
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "0"
  target:
    name: maas-db
    creationPolicy: Owner
    template:
      data:
        POSTGRESQL_USER: maas
        POSTGRESQL_DATABASE: maas
        POSTGRESQL_PASSWORD: {{ "\"{{ .password }}\"" }}
        DATABASE_URL: {{ "\"postgresql://maas:{{ .password }}@maas-db:5432/maas\"" }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: maas-db-password
