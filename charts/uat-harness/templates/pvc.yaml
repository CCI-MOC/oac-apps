{{- /*
Every claim is ReadWriteMany because test pods on different nodes write to the
same volume at once.

Prune=false and Delete=false keep a claim, and the data on it, when it drops out
of this chart or the Application is removed. With automated pruning a rename or
a bad revert would otherwise delete the volume, and uat-runner-storage holds
run logs that cannot be regenerated. Removing a claim for real is then a manual
step.
*/}}
{{- $sizes := .Values.storage.sizes }}
{{- $claims := list
  (dict "namespace" "uat-project" "name" "uat-project-storage" "size" $sizes.results)
  (dict "namespace" "uat-project" "name" "uat-models" "size" $sizes.models)
  (dict "namespace" "uat-peer" "name" "uat-peer-storage" "size" $sizes.results)
  (dict "namespace" "uat-peer" "name" "uat-models" "size" $sizes.models)
  (dict "namespace" "uat-runner" "name" "uat-runner-storage" "size" $sizes.runner)
  (dict "namespace" "uat-runner" "name" "uat-runner-bin" "size" $sizes.runnerBin)
}}
{{- range $claims }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ $.Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .size }}
---
{{- end }}
