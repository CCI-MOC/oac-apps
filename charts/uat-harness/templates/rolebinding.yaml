{{- $group := required "group must be set" .Values.group }}
# People: members of the harness group, in the two test namespaces.
{{- range list "uat-project" "uat-peer" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: {{ . }}
subjects:
  - kind: Group
    name: {{ $group | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-user-binding
  namespace: uat-runner
subjects:
  - kind: Group
    name: {{ $group | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-runner-user-role
  apiGroup: rbac.authorization.k8s.io
---
# The runner service account: read-only on its own namespace, and the same
# rights a person has in the two namespaces it runs tests in.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-self-binding
  namespace: uat-runner
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-project-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-peer-binding
  namespace: uat-peer
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-epp-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-epp
    namespace: uat-project
roleRef:
  kind: Role
  name: uat-epp-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-admin-limits
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: maas-admin
    namespace: uat-project
roleRef:
  kind: Role
  name: maas-admin-limits
  apiGroup: rbac.authorization.k8s.io
---
# The compliance runner's account: the pod the harness starts runs as it and
# creates the node probes with it. The uat-runner account holds no binding
# here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-admin-sa-binding
  namespace: uat-admin
subjects:
  - kind: ServiceAccount
    name: uat-admin-sa
    namespace: uat-admin
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
# The admin runner account creates the test pod and its node probes in
# uat-admin. It is not bound to the privileged SCC; the test pod runs as
# uat-admin-sa.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-admin-runner-sa-admin-binding
  namespace: uat-admin
subjects:
  - kind: ServiceAccount
    name: uat-admin-runner-sa
    namespace: uat-admin-runner
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
# The admin runner account in its own namespace: read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-admin-runner-sa-self-binding
  namespace: uat-admin-runner
subjects:
  - kind: ServiceAccount
    name: uat-admin-runner-sa
    namespace: uat-admin-runner
roleRef:
  kind: Role
  name: uat-admin-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# The harness group launches and watches the admin runner pod. The test pod
# and the privileged SCC stay in uat-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-admin-runner-user-binding
  namespace: uat-admin-runner
subjects:
  - kind: Group
    name: {{ $group | quote }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-admin-runner-user-role
  apiGroup: rbac.authorization.k8s.io
