# The runner pod runs as this account, which is what lets a run proceed
# unattended. Its rights are the RoleBindings in rolebinding.yaml and nothing
# cluster scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-runner-sa
  namespace: uat-runner
---
# The MaaS test's endpoint picker runs as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-epp
  namespace: uat-project
---
# The MaaS key portal runs as this account. Users sign in through the MaaS's
# own Keycloak, not the cluster's OAuth server, so it has no OAuth client
# annotation, and no Role: the portal only talks to its database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-keys
  namespace: uat-project
---
# The MaaS admin portal runs as this account. It has no Route and rewrites
# Limitador's limits when plans change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-admin
  namespace: uat-project
---
# The admin runner pod runs as this account in uat-admin-runner. It creates
# the test pod in uat-admin; the test pod and node probes run as uat-admin-sa.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-admin-runner-sa
  namespace: uat-admin-runner
---
# The compliance test pod and the node probes it creates run as this
# account in uat-admin. Its privileged SCC binding is in
# clusterrolebinding.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-admin-sa
  namespace: uat-admin
