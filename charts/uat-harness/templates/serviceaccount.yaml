# The runner pod runs as this account, which is what lets a run proceed
# unattended. Its rights are the RoleBindings in rolebinding.yaml and nothing
# cluster scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-runner-sa
  namespace: uat-runner
---
# The MaaS test's endpoint picker runs as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-epp
  namespace: uat-project
