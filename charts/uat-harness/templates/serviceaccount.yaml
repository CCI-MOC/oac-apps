# The runner pod runs as this account, which is what lets a run proceed
# unattended. Its rights are the RoleBindings in rolebinding.yaml and nothing
# cluster scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-runner-sa
  namespace: uat-runner
---
# The MaaS test's endpoint picker runs as this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-epp
  namespace: uat-project
---
# The MaaS key portal signs users in through the cluster's OAuth server with
# this account as its client. The annotation lets the OAuth server redirect
# back to the maas-keys Route, whatever its host. No Role: the portal only
# talks to its database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-keys
  namespace: uat-project
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.keys: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"maas-keys"}}
---
# The MaaS admin portal runs as this account. It has no Route and rewrites
# Limitador's limits when plans change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-admin
  namespace: uat-project
