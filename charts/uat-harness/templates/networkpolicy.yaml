{{- /*
The same policy user-projects gives every tenant namespace. The baseline policy
in restrict-tenant-networks denies tenant traffic to every namespace including
the pod's own, so without this even pods in the same namespace cannot talk.
*/}}
{{- range list "uat-project" "uat-peer" "uat-runner" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-and-internet
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
      - ipBlock:
          cidr: 0.0.0.0/0
---
{{- end }}
