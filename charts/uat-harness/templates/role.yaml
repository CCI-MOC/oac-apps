# What a test run needs in uat-project: plain pods and services plus the
# workload APIs the tests exercise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-project
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs", "tfjobs", "mpijobs", "xgboostjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
# uat-peer only ever hosts plain pods and services, so it gets none of the
# workload APIs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-peer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# The runner service account in its own namespace: enough to inspect the runner
# pod and its configuration, and no more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-runner-role
  namespace: uat-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
# A person launching and watching the runner pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-runner-user-role
  namespace: uat-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
