# T-03 and T-04 read the apiserver operator config. A cluster-wide ConfigMap
# read would expose too much, so this is one named object in one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-admin-read
  namespace: openshift-apiserver
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["config"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-admin-read-binding
  namespace: openshift-apiserver
subjects:
  - kind: ServiceAccount
    name: uat-admin-sa
    namespace: uat-admin
roleRef:
  kind: Role
  name: uat-admin-read
  apiGroup: rbac.authorization.k8s.io
