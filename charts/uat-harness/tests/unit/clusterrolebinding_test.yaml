suite: uat-harness ClusterRoleBindings
templates:
  - templates/clusterrolebinding.yaml

tests:
  - it: should give the privileged SCC to the compliance account only
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:openshift:scc:privileged
        documentSelector:
          path: metadata.name
          value: uat-admin-scc-privileged
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: uat-admin-sa
              namespace: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin-scc-privileged

  # The compliance reads. The rules name their API groups and resources and
  # keep the named ones to resourceNames.
  - it: should let the compliance account read the cluster objects the checks use
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["security.openshift.io"]
            resources: ["securitycontextconstraints"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["machineconfiguration.openshift.io"]
            resources: ["machineconfigs", "machineconfigpools"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get"]
            resourceNames: ["hostedclusters.hypershift.openshift.io", "virtualmachines.kubevirt.io"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["nvidia.com"]
            resources: ["clusterpolicies"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["networkpolicies"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["nfd.openshift.io"]
            resources: ["nodefeatures"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["cdi.kubevirt.io"]
            resources: ["storageprofiles"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles"]
            verbs: ["get"]
            resourceNames: ["gpu-modality-switcher"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["config.openshift.io"]
            resources: ["images", "oauths", "apiservers", "infrastructures", "authentications"]
            verbs: ["get"]
            resourceNames: ["cluster"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["config.openshift.io"]
            resources: ["clusterversions"]
            verbs: ["get"]
            resourceNames: ["version"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["hypershift.openshift.io"]
            resources: ["hostedclusters", "nodepools"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["authorization.k8s.io"]
            resources: ["subjectaccessreviews"]
            verbs: ["create"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["compliance.openshift.io"]
            resources: ["compliancesuites", "compliancescans", "compliancecheckresults", "scansettings"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["platform.stackrox.io"]
            resources: ["centrals"]
            verbs: ["get"]
            resourceNames: ["stackrox-central-services"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["logging.openshift.io"]
            resources: ["clusterlogforwarders"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["loki.grafana.com"]
            resources: ["lokistacks"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: ["route.openshift.io"]
            resources: ["routes"]
            verbs: ["get"]
            resourceNames: ["console", "oauth-openshift"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - notContains:
          path: rules
          content:
            resources: ["secrets"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get"]
            resourceNames: ["openshift-apiserver"]
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - notContains:
          path: rules
          content:
            resources: ["pods/log"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-admin-read
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: uat-admin-read
        documentSelector:
          path: metadata.name
          value: uat-admin-read-binding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: uat-admin-sa
              namespace: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin-read-binding

  # The inventory checks list pods, workloads, VMs and CSVs across all
  # namespaces. They are a separate, visible exception.
  - it: should give the inventory checks the cluster-wide workload reads
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs", "cronjobs"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - contains:
          path: rules
          content:
            apiGroups: ["kubevirt.io"]
            resources: ["virtualmachines", "virtualmachineinstances"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - contains:
          path: rules
          content:
            apiGroups: ["operators.coreos.com"]
            resources: ["clusterserviceversions"]
            verbs: ["get", "list"]
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - notContains:
          path: rules
          content:
            resources: ["secrets"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: uat-admin-inventory-read
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read-binding
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: uat-admin-sa
              namespace: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin-inventory-read-binding
