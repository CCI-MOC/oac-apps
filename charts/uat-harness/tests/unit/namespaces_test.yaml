suite: uat-harness Namespaces and NetworkPolicies
templates:
  - templates/namespace.yaml
  - templates/networkpolicy.yaml

tests:
  - it: should create the five namespaces
    template: templates/namespace.yaml
    asserts:
      - hasDocuments:
          count: 5
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: uat-project
          any: true
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: uat-peer
          any: true
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: uat-runner
          any: true
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: uat-admin
          any: true
      - containsDocument:
          kind: Namespace
          apiVersion: v1
          name: uat-admin-runner
          any: true

  # restrict-tenant-networks selects on this label existing. Without it the
  # namespaces would sit outside tenant isolation, which the harness is there
  # to test.
  - it: should label every namespace as a tenant
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.labels["massopen.cloud/project"]
          value: uat-project
        documentSelector:
          path: metadata.name
          value: uat-project
      - equal:
          path: metadata.labels["massopen.cloud/project"]
          value: uat-peer
        documentSelector:
          path: metadata.name
          value: uat-peer
      - equal:
          path: metadata.labels["massopen.cloud/project"]
          value: uat-runner
        documentSelector:
          path: metadata.name
          value: uat-runner
      - equal:
          path: metadata.labels["massopen.cloud/project"]
          value: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin
      - equal:
          path: metadata.labels["massopen.cloud/project"]
          value: uat-admin-runner
        documentSelector:
          path: metadata.name
          value: uat-admin-runner

  # uat-admin is a privileged test namespace, not a project users open in the
  # dashboard.
  - it: should keep the admin namespaces out of the dashboard
    template: templates/namespace.yaml
    asserts:
      - notExists:
          path: metadata.labels["opendatahub.io/dashboard"]
        documentSelector:
          path: metadata.name
          value: uat-admin
      - notExists:
          path: metadata.labels["opendatahub.io/dashboard"]
        documentSelector:
          path: metadata.name
          value: uat-admin-runner

  # The second label the user-projects chart gives every tenant namespace. If
  # that chart gains another, this one should follow.
  - it: should carry the dashboard label on the test namespaces
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.labels["opendatahub.io/dashboard"]
          value: "true"
        documentSelector:
          path: metadata.name
          value: uat-project
      - equal:
          path: metadata.labels["opendatahub.io/dashboard"]
          value: "true"
        documentSelector:
          path: metadata.name
          value: uat-peer
      - equal:
          path: metadata.labels["opendatahub.io/dashboard"]
          value: "true"
        documentSelector:
          path: metadata.name
          value: uat-runner

  - it: should create the namespaces before what goes in them
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"

  - it: should allow same-namespace traffic in every namespace
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: spec.ingress[0].from[0].podSelector
          value: {}
      - equal:
          path: spec.egress[0].to[0].podSelector
          value: {}
