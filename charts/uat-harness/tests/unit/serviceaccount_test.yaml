suite: uat-harness ServiceAccounts
templates:
  - templates/serviceaccount.yaml

tests:
  # The compliance test's pods run as this account, in their own namespace.
  - it: should give the compliance test its own account in uat-admin
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: uat-admin-sa
          namespace: uat-admin
          any: true

  # The runner account is the one a -p run uses; it must not be moved or
  # renamed without changing the RoleBindings in rolebinding.yaml.
  - it: should keep the runner account in uat-runner
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: uat-runner-sa
          namespace: uat-runner
          any: true

  # The admin runner has its own account, separate from the test pod's
  # privileged account.
  - it: should give the admin runner its own account
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: uat-admin-runner-sa
          namespace: uat-admin-runner
          any: true
