suite: uat-harness Roles
templates:
  - templates/role.yaml

tests:
  # The metrics isolation test publishes a metric from each test namespace.
  - it: should let tests create PodMonitors in both test namespaces
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
            resources: ["podmonitors"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentSelector:
          path: metadata.name
          value: uat-user-role
          matchMany: true

  # The test reads metrics from uat-project.
  - it: should let tests read pod metrics in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
            resources: ["pods"]
            verbs: ["get"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  - it: should keep PodMonitors out of the runner's namespace
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-runner
          matchMany: true

  # The MaaS test runs its components as Deployments in uat-project.
  - it: should let tests run Deployments and InferencePools in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["inference.networking.k8s.io"]
            resources: ["inferencepools"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["apps"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  - it: should give the endpoint picker nothing cluster scoped
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["authentication.k8s.io"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-epp-role
      - notContains:
          path: rules
          content:
            apiGroups: ["authorization.k8s.io"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-epp-role

  # The MaaS test exposes its gateway through a Route.
  - it: should let tests manage Routes in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["route.openshift.io"]
            resources: ["routes"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["route.openshift.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # The MaaS admin portal has no Route; it is reached with oc port-forward.
  - it: should let tests port-forward in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/portforward"]
            verbs: ["create", "get"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            resources: ["pods/portforward"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  - it: should let the MaaS admin portal change only the limits ConfigMap
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["maas-limits"]
              verbs: ["get", "update", "patch"]
        documentSelector:
          path: metadata.name
          value: maas-admin-limits

  # The MaaS test backs up its database with a CronJob, and starts a backup by
  # hand with a Job made from it.
  - it: should let tests run CronJobs and Jobs in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["cronjobs"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["batch"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # MaaS admins provide secrets the chart can't generate, such as the GitHub
  # client secret for the MaaS Keycloak.
  - it: should let tests manage Secrets in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            resources: ["secrets"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # Thanos keeps the MaaS's metrics in a COSI bucket.
  - it: should let tests claim buckets in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["objectstorage.k8s.io"]
            resources: ["bucketclaims", "bucketaccesses"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["objectstorage.k8s.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # Changing a Service's ports in place, instead of deleting and recreating it.
  - it: should let tests update Services in uat-project, not in uat-peer
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # The VM tests give a VM a CDI root disk and cycle it through a restart.
  - it: should let tests manage DataVolumes and start and stop VMs in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cdi.kubevirt.io"]
            resources: ["datavolumes"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["subresources.kubevirt.io"]
            resources: ["virtualmachines/start", "virtualmachines/stop"]
            verbs: ["update"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["cdi.kubevirt.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer
      - notContains:
          path: rules
          content:
            apiGroups: ["subresources.kubevirt.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # Live migration goes through the VirtualMachineInstanceMigration object.
  - it: should let tests live-migrate VMs in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kubevirt.io"]
            resources: ["virtualmachineinstancemigrations"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            resources: ["virtualmachineinstancemigrations"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # Eviction is asked of the pod directly, and read back from the
  # PodDisruptionBudget the VM carries.
  - it: should let tests evict pods and read PodDisruptionBudgets in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/eviction"]
            verbs: ["create"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            resources: ["pods/eviction"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer
      - notContains:
          path: rules
          content:
            apiGroups: ["policy"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # The secondary-network test defines the network it boots VMs onto.
  - it: should let tests define secondary networks in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["k8s.cni.cncf.io"]
            resources: ["network-attachment-definitions"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["k8s.cni.cncf.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  # The agent tests run an AgentRuntime, read the AgentCard the platform makes
  # of it, and run an OpenShell sandbox.
  - it: should let tests run agents in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["agent.rossoctl.dev"]
            resources: ["agentruntimes"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["agent.rossoctl.dev"]
            resources: ["agentcards"]
            verbs: ["get", "list", "watch"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["agent.rossoctl.dev"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer
      - notContains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer
