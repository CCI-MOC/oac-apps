suite: uat-harness Roles
templates:
  - templates/role.yaml

tests:
  # The metrics isolation test publishes a metric from each test namespace.
  - it: should let tests create PodMonitors in both test namespaces
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
            resources: ["podmonitors"]
            verbs: ["create", "get", "list", "watch", "delete"]
        documentSelector:
          path: metadata.name
          value: uat-user-role
          matchMany: true

  # The test reads metrics from uat-project.
  - it: should let tests read pod metrics in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
            resources: ["pods"]
            verbs: ["get"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  - it: should keep PodMonitors out of the runner's namespace
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-runner
          matchMany: true

  # The MaaS test runs its components as Deployments in uat-project.
  - it: should let tests run Deployments and InferencePools in uat-project only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: ["inference.networking.k8s.io"]
            resources: ["inferencepools"]
            verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: ["apps"]
          any: true
        documentSelector:
          path: metadata.namespace
          value: uat-peer

  - it: should give the endpoint picker nothing cluster scoped
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["authentication.k8s.io"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-epp-role
      - notContains:
          path: rules
          content:
            apiGroups: ["authorization.k8s.io"]
          any: true
        documentSelector:
          path: metadata.name
          value: uat-epp-role
