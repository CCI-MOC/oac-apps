suite: uat-harness RBAC
templates:
  - templates/rolebinding.yaml

tests:
  - it: should fail when no group is set
    set:
      group: ""
    asserts:
      - failedTemplate:
          errorMessage: group must be set

  - it: should create twelve RoleBindings
    asserts:
      - hasDocuments:
          count: 12

  - it: should bind the MaaS admin portal's account to the limits role
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: maas-admin
            namespace: uat-project
        documentSelector:
          path: metadata.name
          value: maas-admin-limits
      - equal:
          path: roleRef.name
          value: maas-admin-limits
        documentSelector:
          path: metadata.name
          value: maas-admin-limits

  - it: should bind the endpoint picker's account to its own role
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: uat-epp
            namespace: uat-project
        documentSelector:
          path: metadata.name
          value: uat-epp-binding
      - equal:
          path: roleRef.name
          value: uat-epp-role
        documentSelector:
          path: metadata.name
          value: uat-epp-binding

  - it: should bind the harness group in the test namespaces
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: Group
            name: project-uat
            apiGroup: rbac.authorization.k8s.io
        documentSelector:
          path: metadata.name
          value: uat-user-binding
          matchMany: true
      - equal:
          path: subjects[0].name
          value: project-uat
        documentSelector:
          path: metadata.name
          value: uat-runner-user-binding

  - it: should bind a different group when one is given
    set:
      group: some-other-group
    asserts:
      - equal:
          path: subjects[0].name
          value: some-other-group
        documentSelector:
          path: metadata.name
          value: uat-runner-user-binding

  # The runner drives tests in uat-project and uat-peer, so its service account
  # needs the test role in both, and it must be the account in uat-runner.
  - it: should give the runner service account the test role in both test namespaces
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: uat-runner-sa
            namespace: uat-runner
        documentSelector:
          path: metadata.name
          value: uat-runner-sa-project-binding
      - equal:
          path: roleRef.name
          value: uat-user-role
        documentSelector:
          path: metadata.name
          value: uat-runner-sa-project-binding
      - equal:
          path: metadata.namespace
          value: uat-peer
        documentSelector:
          path: metadata.name
          value: uat-runner-sa-peer-binding

  # In its own namespace the runner account only reads. Creating the runner pod
  # is left to people.
  - it: should keep the runner service account read-only in its own namespace
    asserts:
      - equal:
          path: roleRef.name
          value: uat-runner-role
        documentSelector:
          path: metadata.name
          value: uat-runner-sa-self-binding

  # The compliance test runs in uat-admin. The admin runner account creates
  # the test pod there. The regular runner account still never does.
  - it: should give the test and admin runner accounts rights in uat-admin
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: uat-admin-sa
            namespace: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin-sa-binding
      - equal:
          path: roleRef.name
          value: uat-admin-role
        documentSelector:
          path: metadata.name
          value: uat-admin-sa-binding
      - equal:
          path: metadata.namespace
          value: uat-admin
        documentSelector:
          path: metadata.name
          value: uat-admin-sa-binding
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: uat-admin-runner-sa
            namespace: uat-admin-runner
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-sa-admin-binding
      - equal:
          path: roleRef.name
          value: uat-admin-role
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-sa-admin-binding
      - notContains:
          path: subjects
          content:
            - kind: ServiceAccount
              name: uat-runner-sa
              namespace: uat-runner
        documentSelector:
          path: metadata.namespace
          value: uat-admin
          matchMany: true

  # The harness group launches and watches the admin runner pod in its own
  # namespace.
  - it: should give the harness group rights in the admin runner namespace
    asserts:
      - equal:
          path: subjects[0]
          value:
            kind: Group
            name: project-uat
            apiGroup: rbac.authorization.k8s.io
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-user-binding
      - equal:
          path: roleRef.name
          value: uat-admin-runner-user-role
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-user-binding
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: uat-admin-runner-sa
            namespace: uat-admin-runner
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-sa-self-binding
      - equal:
          path: roleRef.name
          value: uat-admin-runner-role
        documentSelector:
          path: metadata.name
          value: uat-admin-runner-sa-self-binding
