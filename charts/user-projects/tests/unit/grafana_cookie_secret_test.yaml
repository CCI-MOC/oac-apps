suite: user-projects grafana cookie secret
templates:
  - grafana-cookie-secret.yaml
  - grafana-cookie-generator.yaml
tests:
  # Nothing to sign cookies with means nothing to generate, so a project without
  # Grafana should not carry a secret it never reads.
  - it: renders nothing when no project asks for grafana
    set:
      projects:
        - name: aibom
    asserts:
      - hasDocuments:
          count: 0

  - it: creates one secret per project, in that project's namespace
    template: grafana-cookie-secret.yaml
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: project-aibom
      - equal:
          path: metadata.name
          value: grafana-cookie-secret

  # refreshInterval "0" is what keeps this usable under GitOps: the generator
  # runs once and the value stays, so a sync does not hand everyone a new key
  # and log them out.
  - it: generates the key once and leaves it alone
    template: grafana-cookie-secret.yaml
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - equal:
          path: spec.refreshInterval
          value: "0"
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: grafana-cookie-secret

  # The proxy only accepts a cookie secret that decodes to 16, 24 or 32 bytes.
  - it: generates a key of a length the proxy accepts
    template: grafana-cookie-generator.yaml
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.generator.passwordSpec.length
          value: 32
      - equal:
          path: spec.generator.passwordSpec.symbols
          value: 0
