suite: user-projects grafana without the operator
templates:
  - templates/grafana-standalone.yaml

tests:
  # The default is the operator, so nothing here changes any cluster today.
  - it: renders nothing while the operator is in use
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: needs an image
    set:
      defaultGrafana:
        operator: false
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: defaultGrafana.image is required when defaultGrafana.operator is false

  - it: renders nothing for a project without grafana
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: plain
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the full set for a read-only project
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 6

  # Only the proxy in the same pod can reach Grafana.
  - it: keeps Grafana on localhost
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "http_addr = 127.0.0.1"
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "org_role = Viewer"

  # Same tenancy as the operator mode: port 9092 and the project namespace.
  - it: points the datasource at the tenancy port with the project namespace
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "thanos-querier.openshift-monitoring.svc.cluster.local:9092"
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: 'customQueryParameters: "namespace=project-aibom"'

  # The token reaches Grafana from the secret, never through the chart.
  - it: reads the datasource token from the service account secret
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 3
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/grafana:test
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAFANA_DATASOURCE_TOKEN
            valueFrom:
              secretKeyRef:
                name: grafana-sa-token
                key: token
      - equal:
          path: spec.template.spec.containers[1].name
          value: oauth-proxy

  - it: exposes only the proxy port
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 4
    asserts:
      - isKind:
          of: Service
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].targetPort
          value: 8443

  - it: gives an editable project a volume, Editor and Recreate
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
            editable: true
    asserts:
      - hasDocuments:
          count: 7
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 3
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentIndex: 4
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "org_role = Editor"
        documentIndex: 1

  # Found on jetty: the tenancy port checks a POST as "create" on pod metrics,
  # which the view role does not give, and Grafana 10 sends POST by default.
  - it: queries with GET
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "httpMethod: GET"

  # Grafana logs an error for each provisioning folder that is missing.
  - it: mounts every provisioning folder Grafana reads
    set:
      defaultGrafana:
        operator: false
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentIndex: 3
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-provisioning
            configMap:
              name: grafana-config
              items:
                - {key: datasources.yaml, path: datasources/datasources.yaml}
                - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
                - {key: alerting.yaml, path: alerting/alerting.yaml}
                - {key: notifiers.yaml, path: notifiers/notifiers.yaml}
                - {key: plugins.yaml, path: plugins/plugins.yaml}
