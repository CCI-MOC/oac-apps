suite: user-projects grafana
templates:
  - templates/grafana.yaml

tests:
  # Grafana is opt-in. Existing projects must not change shape just because
  # the chart grew a template.
  - it: renders nothing for a project without a grafana block
    set:
      projects:
        - name: plain
    asserts:
      - hasDocuments:
          count: 0

  # Access (two bindings, token secret, service CA), then the service
  # account, two ConfigMaps, Deployment, Service and Route.
  - it: renders the full set for a read-only project
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 10

  - it: renders for each opted-in project independently
    set:
      projects:
        - name: one
          grafana:
            enabled: true
        - name: two
        - name: three
          grafana:
            enabled: true
    asserts:
      - hasDocuments:
          count: 20

  # Nothing to deploy without an image, so fail at render rather than sync.
  - it: needs an image
    set:
      defaultGrafana:
        image: ""
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: defaultGrafana.image is required

  - it: uses the configured image
    set:
      defaultGrafana:
        image: example.com/grafana:test
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/grafana:test

  # Only the proxy in the same pod can reach Grafana.
  - it: keeps Grafana on localhost
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "http_addr = 127.0.0.1"

  # Port 9092 is the tenancy port. Port 9091 does not filter at all, which is
  # why the Perses datasource shows every namespace on the cluster. The proxy
  # chain behind 9092 runs prom-label-proxy with --error-on-replace, so the
  # namespace cannot be overridden by whoever is querying.
  - it: points the datasource at the tenancy port with the project namespace
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "thanos-querier.openshift-monitoring.svc.cluster.local:9092"
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: 'customQueryParameters: "namespace=project-aibom"'

  # Verifying against the cluster CA beats skipping verification.
  - it: verifies thanos against the service CA instead of skipping it
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "tlsAuthWithCACert: true"
      - notMatchRegex:
          path: data["datasources.yaml"]
          pattern: "tlsSkipVerify"

  # Found on jetty: the tenancy port checks a POST as "create" on pod metrics,
  # which the view role does not give, and Grafana 10 sends POST by default.
  - it: queries with GET
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: "httpMethod: GET"

  # The token reaches Grafana from the secret, never through the chart.
  - it: reads the datasource token from the service account secret
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAFANA_DATASOURCE_TOKEN
            valueFrom:
              secretKeyRef:
                name: grafana-sa-token
                key: token

  # The service account has to exist before the token secret that names it.
  - it: applies the token secret after the service account
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: grafana-sa
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"

  # The redirect annotation makes the service account its own OAuth client,
  # and it has to name the route, or the login redirect is refused.
  - it: makes the service account the oauth client for the route
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - matchRegex:
          path: metadata.annotations["serviceaccounts.openshift.io/oauth-redirectreference.primary"]
          pattern: '"kind":"Route","name":"grafana"'

  # The proxy performs SubjectAccessReviews, which are cluster scoped. A
  # namespaced view binding does not cover them, so the proxy would be
  # forbidden at startup. This is what system:auth-delegator is for.
  - it: binds the service account to auth-delegator as well as view
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: system:auth-delegator

  # OpenShift mints the serving certificate from this annotation, so the secret
  # the proxy mounts exists without anyone creating it by hand.
  - it: asks OpenShift for a serving certificate
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
          value: grafana-tls

  - it: exposes only the proxy port
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Service
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].targetPort
          value: 8443

  - it: points the route at the proxy with reencrypt
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Route
    asserts:
      - equal:
          path: metadata.name
          value: grafana
      - equal:
          path: spec.port.targetPort
          value: https
      - equal:
          path: spec.tls.termination
          value: reencrypt

  # The proxy and the datasource both scope to the project namespace, but they
  # do not check the same permission: the proxy asks for "get services" there,
  # while port 9092 checks "get pods" in apiGroup metrics.k8s.io. Both happen to
  # be granted by the view role, which is why it works, not because they match.
  - it: delegates the access check to the project namespace
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: oauth-proxy
      - contains:
          path: spec.template.spec.containers[1].args
          content: '--openshift-delegate-urls={"/": {"namespace": "project-aibom", "resource": "services", "verb": "get"}}'

  # delegate-urls only covers requests that arrive with a bearer token. A
  # browser session is loaded from its cookie before that check runs, so
  # without a SAR at login any authenticated cluster user could open this
  # Grafana. The SAR is what gates the OAuth callback.
  - it: gates the browser login on rights in the project namespace
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: '--openshift-sar={"namespace": "project-aibom", "resource": "services", "verb": "get"}'

  # The service account is the OAuth client, which is what --openshift-service-account
  # does. Without it the proxy wants a separate client secret it does not have.
  - it: uses the service account as the oauth client
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --openshift-service-account=grafana-sa

  # The signing key must not be derivable. It used to be a hash of the project
  # name, which is public, so the key could be recomputed and a forged cookie
  # would skip the SAR entirely: that check runs at login, an existing cookie is
  # only verified against this key.
  - it: reads the cookie secret from the mounted generated key
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-secret-file=/etc/grafana-cookie/key
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: grafana-cookie
            mountPath: /etc/grafana-cookie
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-cookie
            secret:
              secretName: grafana-cookie-secret

  # The SAR only runs when the code is redeemed. A cookie loaded later is just
  # checked against the signing key, so without a refresh interval a revoked
  # user keeps the session for the full cookie lifetime, which defaults to
  # seven days.
  - it: expires and revalidates the session instead of trusting it for a week
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-expire=30m
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-refresh=10m
      - contains:
          path: spec.template.spec.containers[1].args
          content: --pass-basic-auth=false

  # A container without resources gets the project LimitRange defaults, 1 CPU
  # and 2Gi, which is most of a project's quota spent on Grafana itself.
  - it: gives grafana and the proxy their own resources
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 64Mi

  # Grafana logs an error for each provisioning folder that is missing.
  - it: mounts every provisioning folder Grafana reads
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-provisioning
            configMap:
              name: grafana-config
              items:
                - {key: datasources.yaml, path: datasources/datasources.yaml}
                - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
                - {key: alerting.yaml, path: alerting/alerting.yaml}
                - {key: notifiers.yaml, path: notifiers/notifiers.yaml}
                - {key: plugins.yaml, path: plugins/plugins.yaml}

  # Grafana caps a dashboard uid at 40 characters. "project-<name>-overview"
  # would pass that with 24 characters of project name, and the failure would
  # only show up when someone creates a project with a long name.
  - it: keeps the dashboard uid inside Grafana's limit whatever the name
    set:
      projects:
        - name: a-very-long-project-name-for-testing-purposes
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-dashboards
    asserts:
      - matchRegex:
          path: data["project-overview.json"]
          pattern: '"uid": "project-[0-9a-f]{16}-ovw"'

  # The queries are only safe today because port 9092 injects the namespace.
  # Spelling it out means the dashboard stays scoped if the datasource is ever
  # repointed, or if somebody copies this JSON somewhere else.
  - it: scopes the dashboard queries to the project namespace
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-dashboards
    asserts:
      - matchRegex:
          path: data["project-overview.json"]
          pattern: 'container_cpu_usage_seconds_total\{namespace=..project-aibom'
      - matchRegex:
          path: data["project-overview.json"]
          pattern: 'container_memory_working_set_bytes\{namespace=..project-aibom'

  # Without editable the anonymous role stays Viewer: an Editor could save, and
  # nothing saved survives a restart on emptyDir.
  - it: keeps a project without editable on Viewer and emptyDir
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.strategy
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-data
            emptyDir: {}

  - it: does not let viewers edit or alert
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    documentSelector:
      path: metadata.name
      value: grafana-config
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "org_role = Viewer"
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "viewers_can_edit = false"
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '\[unified_alerting\]\n(#.*\n)*enabled = false'

  # editable is the second switch: Editor and a volume come together, because
  # an Editor saving into emptyDir loses everything with the next pod.
  - it: gives an editable project a volume and the Editor role
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
            editable: true
    asserts:
      - hasDocuments:
          count: 11
      - equal:
          path: spec.resources.requests.storage
          value: 512Mi
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "org_role = Editor"
        documentSelector:
          path: metadata.name
          value: grafana-config

  # A ReadWriteOnce volume stays with the old pod during a rolling update, so
  # the new one would wait for it forever.
  - it: replaces the pod instead of rolling it when there is a volume
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
            editable: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-data
            persistentVolumeClaim:
              claimName: grafana-pvc
