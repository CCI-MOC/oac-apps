suite: user-projects NetworkPolicy generation
templates:
  - templates/networkpolicy.yaml

tests:
  - it: should create one NetworkPolicy per project
    set:
      projects:
        - name: project1
          groups:
            - name: editors
              role: edit
        - name: project2
          groups:
            - name: editors
              role: edit
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: project-project1
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: project-project2
        documentIndex: 1

  # A project without Grafana keeps the policy it always had.
  - it: allows only intra-namespace ingress for a plain project
    set:
      projects:
        - name: plain
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].from[0].podSelector
          value: {}

  # Grafana listens on localhost only, so nothing needs port 3000 from
  # another namespace.
  - it: does not open port 3000 for a project with Grafana
    set:
      projects:
        - name: aibom
          grafana:
            enabled: true
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
