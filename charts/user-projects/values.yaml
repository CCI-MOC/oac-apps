defaultQuota:
  hard:
    pods: "20"
    requests.cpu: "10"
    requests.memory: "10Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"

defaultLimitRange:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "8Gi"
      defaultRequest:
        cpu: "1"
        memory: "2Gi"

# groups is an optional list of groups to create on the target cluster. In
# general this isn't necessary because we manage groups in keycloak (or
# github).
groups: []
# - name: example-group
#   members:
#   - bob@example.com
#   - alice@example.com

# projects is a list of projects to create. For each project, if you don't
# explicitly set `group`, it will assume a group named
# `project-<project_name>-edit` exists.
projects: []
# - name: aibom
#   requester: alice@example.com
#   description: "This is an example project."
#   groups:
#     - name: example-group
#       role: edit

# Per project Grafana. Off unless a project opts in, so existing projects are
# untouched. Enabling it costs the project Grafana plus the oauth-proxy sidecar
# in the same pod, against its own quota.
defaultGrafana:
  version: "11.3.0"
  # The image the console itself uses for authenticating routes.
  oauthProxyImage: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.14
  # Grafana itself. The operator applies these to its own container.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The oauth-proxy sidecar, which needs its own entry: a container without
  # resources gets the project LimitRange defaults, 1 CPU and 2Gi, and that is
  # far more of the quota than a proxy should cost.
  proxyResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
