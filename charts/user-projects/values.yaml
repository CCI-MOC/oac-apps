defaultQuota:
  hard:
    pods: "20"
    requests.cpu: "10"
    requests.memory: "10Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"

defaultLimitRange:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "8Gi"
      defaultRequest:
        cpu: "1"
        memory: "2Gi"

# groups is an optional list of groups to create on the target cluster. In
# general this isn't necessary because we manage groups in keycloak (or
# github).
groups: []
# - name: example-group
#   members:
#   - bob@example.com
#   - alice@example.com

# projects is a list of projects to create. Each project must list at least
# one entry under `groups`; each entry becomes a RoleBinding of `role` (a
# ClusterRole such as edit or view) to the named group in project-<name>.
# A group entry without `name` defaults to project-<project_name>-<role>.
projects: []
# - name: aibom
#   requester: alice@example.com
#   description: "This is an example project."
#   groups:
#     - name: example-group
#       role: edit
