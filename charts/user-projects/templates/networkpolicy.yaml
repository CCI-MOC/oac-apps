{{- range .Values.projects }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-and-internet
  namespace: "project-{{ .name }}"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
      - ipBlock:
          cidr: 0.0.0.0/0
---
{{ end }}
