{{- range .Values.projects }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-and-internet
  namespace: "project-{{ .name }}"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
{{- if and .grafana .grafana.enabled }}
  # Grafana listens on 3000 without authentication, because the operator manages
  # it over that port and cannot authenticate to the proxy. This is what keeps
  # that port to the operator alone.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: grafana-operator
    ports:
    - protocol: TCP
      port: 3000
{{- end }}
  egress:
  - to:
    - podSelector: {}
  - to:
      - ipBlock:
          cidr: 0.0.0.0/0
---
{{ end }}
