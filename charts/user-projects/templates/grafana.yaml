{{ range .Values.projects }}
{{- if and .grafana .grafana.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-view
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: "project-{{ .name }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "project-{{ .name }}-grafana-auth-delegator"
  labels:
    massopen.cloud/project: "{{ .name }}"
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: "project-{{ .name }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # This is for --openshift-delegate-urls, not for the SAR. The SAR path sends
  # the end user's own token, so the service account's rights do not matter
  # there. delegate-urls is different: the proxy runs a TokenReview and a
  # SubjectAccessReview as itself, and creating those is cluster scoped, which
  # the namespaced view binding above does not cover.
  #
  # Worth knowing: this gives one service account per project the right to
  # create TokenReviews and SubjectAccessReviews cluster wide. That comes with
  # delegate-urls and cannot be scoped down, so it is a deliberate cost.
  name: system:auth-delegator
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-sa-token
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
  annotations:
    kubernetes.io/service-account.name: grafana-sa
    # After the Grafana resource in wave 1, because the operator is what
    # creates grafana-sa now and this secret names an account that has to
    # exist already.
    argocd.argoproj.io/sync-wave: "2"
# The API server fills this in and keeps it valid. The chart never carries a
# token, and the datasource reads it from here through valuesFrom, because the
# operator sends the datasource to Grafana over its API where a ${__file{...}}
# expression would arrive as a literal string.
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-service-ca
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
  annotations:
    # OpenShift writes the bundle into this ConfigMap under service-ca.crt.
    # The cluster-wide openshift-service-ca.crt ConfigMap exists too, but a
    # datasource can only read a key from a ConfigMap it names, so this one is
    # ours to point at.
    service.beta.openshift.io/inject-cabundle: "true"
---
{{- if $.Values.defaultGrafana.operator }}
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
    # The operator matches dashboards and datasources to instances by this label.
    dashboards: "project-{{ .name }}"
  annotations:
    # The CRD only exists once the operator from the grafana-operator chart has
    # installed, which is a different Application, so the first sync would
    # otherwise fail its dry run.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Applied before the token secret below, because the operator creates the
    # service account and the docs are explicit that the account has to exist
    # first: "If you are creating both the ServiceAccount and the Secret
    # objects, create the ServiceAccount object first."
    argocd.argoproj.io/sync-wave: "1"
spec:
  version: {{ $.Values.defaultGrafana.version | quote }}
  {{- if .grafana.editable }}
  # The operator names this claim after the instance, so grafana-pvc below.
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ $.Values.defaultGrafana.storage }}
  {{- end }}
  route:
    metadata:
      name: grafana-route
    spec:
      tls:
        termination: reencrypt
      to:
        kind: Service
        name: grafana-service
      # Without this the route keeps the operator's default. getRouteSpec sets
      # targetPort to GetGrafanaPort, which is 3000, and the override is applied
      # on top with a strategic merge, so a field we do not set stays at the
      # default. A reencrypt route pointed at Grafana's plain HTTP port does not
      # work, and it would also leave the proxy out of the path entirely.
      port:
        targetPort: https
  service:
    metadata:
      annotations:
        # OpenShift mints the certificate and puts it in this secret, which is
        # the one the proxy mounts below. Nothing has to create it by hand.
        service.beta.openshift.io/serving-cert-secret-name: grafana-tls
    spec:
      ports:
        # 3000 stays on Grafana because the operator has no other way in. It
        # builds its management address from the instance name and Grafana's own
        # port, not from this service, so pointing 3000 at the proxy leaves the
        # operator talking plain HTTP to a TLS listener and no dashboard or
        # datasource is ever provisioned.
        #
        # That does leave Grafana reachable on 3000 from inside the cluster, so
        # the network policy next to this file is what closes it: only the
        # operator namespace may reach that port, and the admin policy in
        # restrict-tenant-networks has to allow it too, since the baseline
        # policy denies cross-namespace ingress.
        - name: grafana
          port: 3000
          targetPort: 3000
          protocol: TCP
        # The port the route uses, and the only way a person reaches Grafana.
        # Named "https" so the route above can target it by name.
        - name: https
          port: 443
          targetPort: 8443
          protocol: TCP
  serviceAccount:
    metadata:
      annotations:
        # The operator creates the service account and owns it, so the chart
        # cannot create it: it names it after the instance plus "-sa" and then
        # sets itself as controller, which fails on an account that already
        # belongs to Argo CD. Everything still refers to grafana-sa because
        # this instance is called grafana.
        #
        # This annotation is the only reason the chart used to create it. It
        # makes the account its own OAuth client, so no client secret and no
        # Keycloak client is needed per startup, and the proxy sends users to
        # the route named below after they log in. "primary" is a name we
        # picked, the docs describe the annotation generically as
        # oauth-redirectreference.<some-value>.
        serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
          {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"grafana-route"}}
  config:
    auth:
      # The oauth-proxy in front is what enforces access, so Grafana itself
      # does not ask a second time.
      disable_login_form: "true"
    auth.anonymous:
      enabled: "true"
      # Editor only together with the volume, since an Editor saving into
      # emptyDir loses everything with the next pod. Neither role can change
      # datasources, that is org admin, so the tenancy stays in the datasource
      # token and namespace parameter either way.
      org_role: {{ ternary "Editor" "Viewer" (.grafana.editable | default false) | quote }}
    users:
      # Viewers may still open dashboard settings and try things, they just
      # cannot save. Dashboards belong in git as GrafanaDashboard resources.
      viewers_can_edit: "false"
    unified_alerting:
      # Alerting belongs to the platform, PrometheusRule and Alertmanager.
      enabled: "false"
  deployment:
    spec:
      {{- if .grafana.editable }}
      # The old pod holds the ReadWriteOnce volume, so a rolling update would
      # leave the new one waiting for it.
      strategy:
        type: Recreate
      {{- end }}
      template:
        spec:
          serviceAccountName: grafana-sa
          containers:
            # The operator does not read defaultGrafana.resources on its own,
            # and a container without resources gets the project LimitRange
            # defaults, 1 CPU and 2Gi. Naming the container here is what makes
            # the merge land on Grafana itself rather than on a second one.
            - name: grafana
              resources:
                {{- toYaml $.Values.defaultGrafana.resources | nindent 16 }}
            {{- include "user-projects.grafana.proxyContainer" (dict "p" . "root" $) | nindent 12 }}
          volumes:
            - name: grafana-tls
              secret:
                secretName: grafana-tls
            - name: grafana-cookie
              secret:
                secretName: grafana-cookie-secret
            {{- if .grafana.editable }}
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
            {{- end }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: thanos
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the Grafana in wave 1, or the operator finds no instance.
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "project-{{ .name }}"
  datasource:
    name: thanos
    type: prometheus
    access: proxy
    isDefault: true
    # Port 9092 is the tenancy port, documented as restricted to a given
    # project and needing only a view binding there. 9091 is documented as
    # access to all Prometheus endpoints, and it returns every namespace on
    # this cluster regardless of who asks, which is why Perses shows
    # everything.
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
    jsonData:
      timeInterval: "30s"
      # Verify against the cluster's own CA rather than skipping the check.
      # The bundle comes from the grafana-service-ca ConfigMap created above
      # and reaches the datasource through valuesFrom, not through a volume.
      tlsAuthWithCACert: true
      httpHeaderName1: "Authorization"
      # prom-label-proxy runs with --error-on-replace, so this value cannot
      # be overridden by a query. That is what makes the separation real, and
      # it is the part the docs do not describe: they document what the two
      # ports allow, never the proxy chain behind them. Read off the
      # deployment, so worth re-checking after a monitoring stack upgrade.
      customQueryParameters: "namespace=project-{{ .name }}"
    # Nobody edits this in the UI. It is the only datasource a project sees, and
    # an edited one would be an unfiltered one.
    editable: false
    secureJsonData:
      # ${token} and ${service-ca.crt} are placeholders the operator substitutes
      # from the references below, named after the key in the secret and the
      # config map. It replaces the placeholder inside the string, which is why
      # the Bearer prefix can simply stay here.
      httpHeaderValue1: "Bearer ${token}"
      tlsCACert: "${service-ca.crt}"
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: grafana-sa-token
          key: token
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        configMapKeyRef:
          name: grafana-service-ca
          key: service-ca.crt
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: project-overview
  namespace: "project-{{ .name }}"
  labels:
    massopen.cloud/project: "{{ .name }}"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the Grafana in wave 1, or the operator finds no instance.
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "project-{{ .name }}"
  json: |
    {{- include "user-projects.grafana.overviewDashboard" . | nindent 4 }}
---
{{- end }}
{{- end }}
{{ end }}
