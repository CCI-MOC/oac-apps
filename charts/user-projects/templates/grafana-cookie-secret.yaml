{{ range .Values.projects }}
{{- if and .grafana .grafana.enabled }}
# The proxy signs its session cookies with this key. Deriving it from the
# project name was wrong: the name is public and the prefix is in this repo, so
# anyone could compute the key, forge a cookie and open the project's Grafana.
# The SAR on the login path does not catch that, it only runs during login and
# an existing cookie is checked against the signature alone.
#
# refreshInterval "0" is what makes this usable under GitOps. The generator runs
# once, the value stays, and ArgoCD sees the same Secret on every sync instead
# of a new one that would log everybody out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "grafana-cookie-secret"
  namespace: "project-{{ .name }}"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    massopen.cloud/project: "{{ .name }}"
spec:
  refreshInterval: "0"
  target:
    name: "grafana-cookie-secret"
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: grafana-cookie-secret
---
{{- end }}
{{- end }}
