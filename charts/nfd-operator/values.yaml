namespace: openshift-nfd
operatorgroup:
  targetNamespaces: true
subscription:
  channel: stable
  name: nfd
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
# The NodeFeatureDiscovery instance the operator reconciles into a
# master/worker deployment.
nodeFeatureDiscovery:
  # Needs to be set for taints to take effect
  enableTaints: true
  sleepInterval: 60s
  pci:
    # 0200 = ethernet, 03 = display (GPUs), 12 = processing accelerator.
    deviceClassWhitelist:
      - "0200"
      - "03"
      - "12"
    deviceLabelFields:
      - "vendor"

gpuDevices:
  - name: Tesla-V100-PCIE-32GB
    deviceId: "1db6"
  - name: NVIDIA-A100-SXM4-40GB
    deviceId: "20b0"
  - name: NVIDIA-H100-80GB-HBM3
    deviceId: "2330"
