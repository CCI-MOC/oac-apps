{{- if .Values.enabled }}
{{- /*
  v2 and v3 here are RHOAI majors, not API versions: RHOAI 2.x takes a
  DataScienceCluster v1 and 3.x takes a v2. The bodies live in templates/v2
  and templates/v3 so the two component sets, which share almost no field
  names, stay readable side by side.
*/ -}}
{{- if eq (toString .Values.rhoaiVersion) "3" }}
{{ include "rhoai.datasciencecluster.v3" . }}
{{- else }}
{{ include "rhoai.datasciencecluster.v2" . }}
{{- end }}
{{- end }}
