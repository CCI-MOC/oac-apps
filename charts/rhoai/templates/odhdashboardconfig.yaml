{{- /* 3.x has no OdhDashboardConfig; hardware profiles are first-class there. */ -}}
{{- if and .Values.enabled (ne (toString .Values.rhoaiVersion) "3") }}
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: {{ .Values.applicationsNamespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  dashboardConfig:
    disableHardwareProfiles: {{ .Values.dashboardConfig.disableHardwareProfiles }}
{{- end }}
