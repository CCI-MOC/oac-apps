namespace: redhat-ods-operator
# Where the dashboard and the rest of the RHOAI workloads run, as opposed to
# `namespace` above, which holds the operator itself.
applicationsNamespace: redhat-ods-applications
operatorgroup:
  targetNamespaces: false
subscription:
  channel: stable
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# The DataScienceCluster that turns the installed operator into a running
# RHOAI. Every component takes Managed or Removed.
dataScienceCluster:
  name: default-dsc
  components:
    codeflare: Managed
    dashboard: Managed
    datasciencepipelines: Managed
    kserve: Managed
    kueue: Managed
    modelmeshserving: Managed
    modelregistry: Removed
    ray: Managed
    trainingoperator: Managed
    trustyai: Managed
    workbenches: Managed
  kserve:
    serving:
      managementState: Managed
      name: knative-serving
      certificateType: SelfSigned
  modelregistry:
    # Set even when modelregistry is Removed; the CRD requires the field.
    registriesNamespace: rhoai-model-registries

# The dashboard owns the rest of OdhDashboardConfig; only the fields listed
# here are managed by the chart.
dashboardConfig:
  # Hardware profiles are how workbenches and model servers request GPUs. The
  # operator default (true) hides the profiles page and leaves the GPU nodes
  # unreachable from the UI.
  disableHardwareProfiles: false

enabledHardwareProfiles: []

hardwareProfiles:
  - name: nvidia-h100-gpu
    displayName: NVIDIA H100 GPU
    identifiers:
      - identifier: cpu
        displayName: CPU
        resourceType: CPU
        minCount: 1
        maxCount: "14"
        defaultCount: 2
      - identifier: memory
        displayName: Memory
        resourceType: Memory
        minCount: 2Gi
        maxCount: 56Gi
        defaultCount: 8Gi
      - identifier: nvidia.com/gpu
        displayName: gpu
        resourceType: Accelerator
        minCount: 1
        maxCount: 4
        defaultCount: 1
    scheduling:
      type: Node
      node:
        nodeSelector: {}
        # Must match the taint on the GPU nodes, or workbenches are never
        # scheduled and anything already running is evicted. nfd-operator
        # taints every GPU node NoSchedule, keyed on the product name, so each
        # profile tolerates only its own GPU model.
        tolerations:
          - key: nvidia.com/gpu.product
            operator: Equal
            value: NVIDIA-H100-80GB-HBM3
            effect: NoSchedule

  - name: nvidia-a100-gpu
    displayName: NVIDIA A100 GPU
    identifiers:
      - identifier: cpu
        displayName: CPU
        resourceType: CPU
        minCount: 1
        maxCount: "14"
        defaultCount: 2
      - identifier: memory
        displayName: Memory
        resourceType: Memory
        minCount: 2Gi
        maxCount: 56Gi
        defaultCount: 8Gi
      - identifier: nvidia.com/gpu
        displayName: gpu
        resourceType: Accelerator
        minCount: 1
        maxCount: 4
        defaultCount: 1
    scheduling:
      type: Node
      node:
        nodeSelector: {}
        tolerations:
          - key: nvidia.com/gpu.product
            operator: Equal
            value: NVIDIA-A100-SXM4-40GB
            effect: NoSchedule
