namespace: redhat-ods-operator
# Where the dashboard and the rest of the RHOAI workloads run, as opposed to
# `namespace` above, which holds the operator itself.
applicationsNamespace: redhat-ods-applications
operatorgroup:
  targetNamespaces: false
subscription:
  channel: stable
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# The DataScienceCluster that turns the installed operator into a running
# RHOAI. Every component takes Managed or Removed.
dataScienceCluster:
  name: default-dsc
  components:
    codeflare: Managed
    dashboard: Managed
    datasciencepipelines: Managed
    kserve: Managed
    kueue: Managed
    modelmeshserving: Managed
    modelregistry: Removed
    ray: Managed
    trainingoperator: Removed
    trustyai: Managed
    workbenches: Managed
  kserve:
    serving:
      managementState: Managed
      name: knative-serving
      certificateType: SelfSigned
  modelregistry:
    # Set even when modelregistry is Removed; the CRD requires the field.
    registriesNamespace: rhoai-model-registries

# The dashboard owns the rest of OdhDashboardConfig; only the fields listed
# here are managed by the chart.
dashboardConfig:
  # Hardware profiles are how workbenches and model servers request GPUs. The
  # operator default (true) hides the profiles page and leaves the GPU nodes
  # unreachable from the UI.
  disableHardwareProfiles: false
