---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-backup-privileged-scc
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: etcd-backup
    namespace: {{ .Values.namespace }}
---
# ~170 MB per backup x 14 retained = ~2.4 GB. 10Gi leaves room for etcd to
# grow several-fold. After it binds, patch the PV to Retain (StorageClass
# default is Delete) -- same rule as the compliance evidence PVs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backup
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: {{ .Values.namespace }}
spec:
  # 02:30 UTC: clear of the 01:00 compliance scans.
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: etcd-backup
          restartPolicy: Never
          # Label is control-plane (master is deprecated); the TAINT may still
          # be keyed master, so tolerate both.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          hostNetwork: true
          hostPID: true
          priorityClassName: system-cluster-critical
          containers:
            - name: backup
              image: {{ required "image is required (oc adm release info --image-for=cli)" .Values.image }}
              securityContext:
                privileged: true
                runAsUser: 0
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              env:
                - name: RETAIN
                  value: {{ .Values.retain | quote }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  chmod 700 /backup   # NFS root arrives 0777; backups are Secret-grade
                  ts=$(date -u +%Y-%m-%dT%H%M%SZ)
                  node=$(chroot /host hostname)
                  staging=/var/tmp/etcd-backup-staging   # host path, /var has the space
                  rm -rf "/host${staging}"

                  echo "== backup on ${node} at ${ts}"
                  chroot /host /usr/local/bin/cluster-backup.sh "${staging}"

                  dest="/backup/${ts}"
                  mkdir -p "${dest}"
                  cp "/host${staging}"/snapshot_*.db "/host${staging}"/static_kuberesources_*.tar.gz "${dest}/"
                  rm -rf "/host${staging}"
                  chmod 700 "${dest}"; chmod 600 "${dest}"/*
                  # Checksums, so a restore can check the files it is given.
                  ( cd "${dest}" && sha256sum * > SHA256SUMS )
                  printf '%s %s\n' "${ts}" "${node}" > /backup/LATEST

                  # Retention: keep the newest $RETAIN backup directories.
                  ls -1d /backup/20*/ | sort | head -n -"${RETAIN}" | xargs -r rm -rf
                  echo "== kept: $(ls -1d /backup/20*/ | wc -l) backups"
                  du -sh "${dest}"
              volumeMounts:
                - name: host
                  mountPath: /host
                - name: backup
                  mountPath: /backup
          volumes:
            - name: host
              hostPath:
                path: /
                type: Directory
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backup
