# Nightly etcd backup (800-53 CP-9) for a cluster with its own control plane
# nodes: the hub. It does NOT back up hosted clusters; their etcd runs as
# pods in the hub's HCP namespaces and needs its own method.
#
# A backup contains the etcd encryption key (static_kuberesources includes
# encryption-config), so it can decrypt every Secret in it. The volume is
# Secret-grade: nothing else in the namespace, files 0600 root.
#
# Runs the operator-installed /usr/local/bin/cluster-backup.sh on a control
# plane node, as `oc debug node` does. OpenShift's own backup API needs the
# AutomatedEtcdBackup feature gate (TechPreviewNoUpgrade) on 4.22.
namespace: etcd-backup
# 02:30 UTC: clear of the compliance-operator chart's 01:00 scans.
schedule: "30 2 * * *"
retain: 14

# The release payload's cli image, by digest: it is covered by the built-in
# `openshift` ClusterImagePolicy, so CRI-O verifies its signature. It only
# supplies bash and coreutils, so an older release's image keeps working
# after an upgrade. To find the current one:
#   oc adm release info --image-for=cli
# The in-cluster imagestream would follow upgrades by itself
# (image-registry.openshift-image-registry.svc:5000/openshift/cli), but
# it is not the default: on bare metal the image registry starts Removed
# (oac-dev-infra's is), and a pull through the registry is not
# signature-verified. A cluster whose registry is Managed can set it
# here. Check with: oc get configs.imageregistry cluster
image: ""

# ~170 MB per backup x 14 retained = ~2.4 GB. 10Gi leaves room for etcd to
# grow several-fold.
#
# The volume is provisioned dynamically, so its name on the storage is
# generated (on Portworx FlashBlade, px_<cluster id>-pvc-<claim uid>) and
# only the cluster knows it. To find the backups when the cluster is gone,
# do this once after the first sync, and again if the claim is ever
# recreated:
#
# 1. Keep the volume when the claim goes (StorageClass default is Delete):
#      PV=$(oc get pvc etcd-backup -n etcd-backup -o jsonpath='{.spec.volumeName}')
#      oc patch pv "$PV" -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
# 2. Look up its name on the FlashBlade (Portworx keeps it in a PureVolume
#    named after the PV's volume handle):
#      VH=$(oc get pv "$PV" -o jsonpath='{.spec.csi.volumeHandle}')
#      oc get purevolume "$VH" -n portworx -o jsonpath='{.spec.volumeName}'
# 3. Record that name off the cluster, in AWS Secrets Manager as
#    cluster/<hub>/etcd-backup-volume.
storage:
  storageClassName: ""
  size: 10Gi
