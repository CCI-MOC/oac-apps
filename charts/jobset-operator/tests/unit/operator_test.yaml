suite: JobSet operator
templates:
  - templates/operator.yaml

tests:
  # The gpu-clusters ApplicationSet deploys this chart to every cluster that
  # runs RHOAI, including the ones still on 2.x, whose trainingoperator does
  # not need JobSet. Those must not get the operator.
  - it: renders nothing unless the cluster opts in
    asserts:
      - hasDocuments:
          count: 0

  - it: renders namespace, operatorgroup and subscription when enabled
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 3

  - it: creates the operator namespace
    set:
      enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: openshift-jobset-operator

  # Unlike the kueue operator, this one advertises only OwnNamespace and
  # SingleNamespace, so the OperatorGroup has to name its own namespace.
  - it: scopes the operatorgroup to its own namespace
    set:
      enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: OperatorGroup
      - equal:
          path: spec.targetNamespaces
          value:
            - openshift-jobset-operator

  # Confirmed against the catalog with oc get packagemanifest: the package is
  # named job-set, and stable-v1.0 is its only channel.
  - it: subscribes to job-set from redhat-operators
    set:
      enabled: true
    documentIndex: 2
    asserts:
      - isKind:
          of: Subscription
      - equal:
          path: spec.name
          value: job-set
      - equal:
          path: spec.channel
          value: stable-v1.0
      - equal:
          path: spec.source
          value: redhat-operators
