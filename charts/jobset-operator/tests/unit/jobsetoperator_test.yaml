suite: JobSetOperator instance
templates:
  - templates/jobsetoperator.yaml

tests:
  - it: renders nothing unless the cluster opts in
    asserts:
      - hasDocuments:
          count: 0

  # The operator reconciles a single CR and only accepts the name "cluster";
  # the RHOAI trainer looks for exactly that one.
  - it: renders one JobSetOperator named cluster when enabled
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: JobSetOperator
      - equal:
          path: apiVersion
          value: operator.openshift.io/v1
      - equal:
          path: metadata.name
          value: cluster
      - equal:
          path: spec.managementState
          value: Managed

  # The CRD only exists once OLM has installed the operator, which is wave 0.
  - it: syncs after the subscription and skips the dry-run
    set:
      enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true
