namespace: openshift-cnv
operatorgroup:
  targetNamespaces: true
subscription:
  channel: stable
  name: kubevirt-hyperconverged
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# Tolerations for the workload daemonsets (virt-handler, bridge-marker,
# kube-cni-linux-bridge-plugin), so they can run on tainted nodes such as our
# GPU nodes. Rendered into spec.workloads.nodePlacement.tolerations. Note that
# HCO rejects changes to this field while VMs exist.
workloadTolerations:
  - operator: Exists
    effect: NoSchedule
