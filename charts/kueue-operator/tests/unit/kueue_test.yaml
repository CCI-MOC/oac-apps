suite: Kueue instance
templates:
  - templates/kueue.yaml

tests:
  - it: renders nothing unless the cluster opts in
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one cluster-wide Kueue when enabled
    set:
      enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Kueue
      - equal:
          path: metadata.name
          value: cluster
      - equal:
          path: spec.managementState
          value: Managed

  # The CRD only exists once OLM has installed the operator, which is wave 0.
  - it: syncs after the subscription and skips the dry-run
    set:
      enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: integrates with the frameworks RHOAI schedules
    set:
      enabled: true
    asserts:
      - equal:
          path: spec.config.integrations.frameworks
          value:
            - BatchJob
            - RayJob
            - RayCluster
            - PyTorchJob
