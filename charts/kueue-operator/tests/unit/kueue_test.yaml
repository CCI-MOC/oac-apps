suite: Kueue
templates:
  - templates/kueue.yaml

tests:
  - it: should render the singleton Kueue the operator reconciles
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Kueue
      - equal:
          path: apiVersion
          value: kueue.openshift.io/v1
      - equal:
          path: metadata.name
          value: cluster

  - it: should skip the dry-run when the CRD is missing
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: SkipDryRunOnMissingResource=true

  - it: should sync after the operator
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"

  - it: should admit the frameworks the DataScienceCluster components produce
    asserts:
      - equal:
          path: spec.config.integrations.frameworks
          value:
            - BatchJob
            - RayJob
            - RayCluster
            - PyTorchJob

  - it: should let the frameworks list be overridden per cluster
    set:
      kueue:
        frameworks:
          - BatchJob
    asserts:
      - equal:
          path: spec.config.integrations.frameworks
          value:
            - BatchJob
