clusterName: compliant-dev-workload0
release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.22-multi

# The GPU hypervisor for compliant-dev-infra (MOC-issues #787): an Agent
# cluster on the two Lenovo SD665-N V3s that were jetty's (4 x H100 each),
# running OpenShift Virtualization. KubeVirt hosted clusters with GPU VMs
# (andalusia, #788) run their workers on it, as oac-dev-workload2 does on
# oac-dev-workload1. The hub is standard (three workers), so the control
# plane keeps the chart default, HighlyAvailable.

# Log in through MOC SSO. The Keycloak client comes from moc-keycloak, which
# writes its secret to cluster/compliant-dev-infra/hostedcluster/
# compliant-dev-workload0/keycloak-oidc. HyperShift removes kubeadmin once an
# identity provider is set.
oauth:
  mocsso:
    enabled: true

services:
  APIServer:
    # Pinned internal LoadBalancer IP from the hub's MetalLB pool. Becomes
    # api-internal-compliant-dev-workload0.hcp-int.nist.int.massopen.cloud.
    ipAddress: 10.20.19.13

ingress:
  # Internal only: the guest ingress wildcard
  # (*.apps.compliant-dev-workload0.hcp.nist.int.massopen.cloud) points here.
  ipAddress: 10.20.20.10
  # The guest router's LoadBalancer IP, pinned by MetalLB on the hosted
  # cluster (hosted-ingress app). On the workers' network (VLAN 220,
  # 10.20.20.0/23), outside its DHCP range.
  poolAddress: 10.20.20.10/32

dns:
  enabled: true
  autoGenerate: true

nodePools:
  - name: hypervisor
    replicas: 2
    agentLabelSelector:
      openstack/resource-class: lenovo-sd665nv3-h100
      massopen.cloud/cluster: compliant-dev-workload0
    machineConfigs:
      # Two ports are linked: enp195s0np0 on the workers' network and
      # enp163s0np0 on the storage network. As on nist-dev-workload0 (eno2,
      # 2026-10-22), the storage port keeps its address and subnet route but
      # takes no default route or DNS from DHCP, so br-ex is always built on
      # the workers' network.
      - name: 80-enp163s0np0-never-default
        files:
          - path: /etc/NetworkManager/system-connections/enp163s0np0.nmconnection
            mode: 0600
            contents: |
              [connection]
              id=enp163s0np0
              type=ethernet
              interface-name=enp163s0np0
              autoconnect-priority=10

              [ipv4]
              method=auto
              never-default=true
              ignore-auto-dns=true

              [ipv6]
              method=auto
              never-default=true
              ignore-auto-dns=true
      # GPU passthrough (MOC-issues #787): the IOMMU backend VFIO needs.
      # The GPU Operator's VFIO manager loads vfio-pci but not this, and
      # without it every GPU VM fails with "No available IOMMU models"
      # (jetty, 2026-10-20). Loaded by hand on both nodes on 2026-11-20,
      # which a reboot undoes.
      - name: 90-vfio-iommu-type1
        files:
          - path: /etc/modules-load.d/vfio-iommu-type1.conf
            mode: 0644
            contents: |
              vfio_iommu_type1
      # 1Gi hugepages for andalusia's VM (MOC-issues #788). Without them
      # QEMU takes about 19 s to pin the VM's 128Gi for VFIO, virt-handler's
      # SyncVMI call times out, and its retry deletes the just-started
      # libvirt domain: the VM runs on as a transient domain and every disk
      # hot-plug fails. With hugepages it starts in about 5 s (2026-11-24).
      # 136 per node (split across both NUMA nodes) leaves room for one
      # such VM on either node. Set by hand at runtime on both nodes on
      # 2026-11-24, which a reboot undoes.
      - name: 91-hugepages-1g
        kernelArguments: [hugepagesz=1G, hugepages=136]
      # Root disk encryption (800-171 3.13.16), as on the hub: LUKS2 over
      # RHCOS's root partition, unlocked at boot through Tang (naved's
      # server; this network reaches it since 2026-11-20, #810). By name
      # (moc-dns #41), so a move only copies the keys. pbkdf2:
      # argon2 is not allowed in FIPS mode. Applies at first boot only.
      - name: 98-root-luks-tang
        kernelArguments: [rd.neednet=1]
        luks:
          - name: root
            device: /dev/disk/by-partlabel/root
            label: luks-root
            wipeVolume: true
            options: [--cipher, aes-xts-plain64, --pbkdf, pbkdf2]
            clevis:
              tang:
                - url: http://tang.massopen.cloud:80
                  thumbprint: bE20pSI2fW6K6DjHtBwjFosH9XgBV0VsA11247u-qfI
        filesystems:
          - device: /dev/mapper/root
            format: xfs
            label: root
            wipeFilesystem: true
    # A pod may run 4096 processes by default. These nodes have 512 CPUs,
    # and each Go CNI plugin multus runs starts a thread per CPU: after a
    # reboot about 70 pods ask for a network at once and multus passes the
    # limit ("pthread_create failed"), so no new pod on that node starts
    # and the other node cannot drain. Happened on 2026-11-20 and again in
    # the 2026-11-23 roll; both times unblocked by hand at this value.
    kubeletConfig:
      podPidsLimit: 65536

# GPU passthrough (MOC-issues #787): the module above, and KubeVirt's
# permitted devices in values/compliant-dev-infra/compliant-dev-workload0/
# openshift-virtualization.yaml. NFD and the GPU Operator in sandbox mode
# (vm-passthrough) still come from a test branch, with the rest of the
# compliance stages (MOC-issues #736). feature-gpu stays off: it deploys the
# operator for containers, which would claim the GPUs. andalusia's VM runs
# here (values/compliant-dev-infra/compliant-dev-workload0/
# hypervisor-cluster.yaml, MOC-issues #788).
clusterLabels:
  massopen.cloud/feature-metallb: "true"
  massopen.cloud/feature-virtualization: "true"
  massopen.cloud/feature-hypervisor: "true"
  massopen.cloud/feature-portworx: "true"
