clusterName: oac-dev-workload2

platform:
  type: KubeVirt
  kubevirt:
    infraKubeConfigSecretName: oac-dev-workload1-kubeconfig

oauth:
  mocsso:
    enabled: true

services:
  APIServer:
    # Pinned internal LoadBalancer IP: drives the MetalLB pin and the internal
    # API DNS record. Without it the worker VMs' API hostname falls through
    # to the hub router's wildcard, which does not serve :6443, and no node
    # ever joins.
    ipAddress: 10.20.3.15

dns:
  enabled: true
  autoGenerate: true

release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.14-multi

networking:
  clusterNetwork:
    - cidr: 10.136.0.0/14
  machineNetwork:
    - cidr: 10.132.0.0/14
  serviceNetwork:
    - cidr: 172.32.0.0/16

etcd:
  storageClassName: pure-fb-nfsv4

nodePools:
  - name: compute
    replicas: 2
    cpu: 8
    memory: 16Gi
    disk:
      size: 120Gi
      storageClassName: pure-fb-nfsv4
