clusterName: oac-dev-workload1
release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.15-multi

oauth:
  identityProviders:
    - name: mocsso
      mappingMethod: claim
      type: OpenID
      openID:
        clientID: oac-dev-workload1
        clientSecret:
          name: oac-dev-workload1-keycloak-client-secret
        claims:
          preferredUsername:
            - preferred_username
            - username
          name:
            - name
            - full name
          email:
            - email
          groups:
            - groups
        issuer: https://sso.massopen.cloud/realms/moc

externalSecrets:
  - name: oac-dev-workload1-keycloak-client-secret
    spec:
      data:
        - remoteRef:
            conversionStrategy: Default
            decodingStrategy: None
            key: cluster/oac-dev-infra/hostedcluster/oac-dev-workload1/keycloak-oidc
            metadataPolicy: None
            nullBytePolicy: Ignore
            property: client_secret
          secretKey: clientSecret
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: aws-secrets-manager
      target:
        creationPolicy: Owner
        deletionPolicy: Retain
        name: oac-dev-workload1-keycloak-client-secret

services:
  APIServer:
    # Pinned internal LoadBalancer IP: drives the MetalLB pin, becomes
    # loadBalancer.hostname = api-internal-oac-dev-workload1.<hcpInternalDomain>,
    # and the auto-generated internal API DNS record.
    ipAddress: 10.20.3.14
    # External firewall IP: sets kubeAPIServerDNSName =
    # api-external-oac-dev-workload1.<hcpExternalDomain> and the auto-generated
    # external API DNS record. Shared with ingress below -- :6443 NATs to the
    # API, :80/:443 to the guest ingress.
    externalIpAddress: 129.10.5.105

ingress:
  # Guest ingress wildcard (*.apps.oac-dev-workload1.hcp.oac.massopen.cloud)
  # resolves to this externally reachable IP; the firewall NATs :80/:443 to the
  # guest router's LoadBalancer (10.20.13.10), pinned by MetalLB on the guest
  # cluster via the hosted-ingress app (see poolAddress below).
  externalIpAddress: 129.10.5.106
  # Internal LoadBalancer IP for the guest's default IngressController router.
  # Consumed by the hosted-ingress app (NOT the hosted-cluster chart, which runs
  # on the hub). This is the single source of truth for the guest ingress pool.
  poolAddress: 10.20.15.10/32

dns:
  enabled: true
  # Auto-generate the two API records (internal + external) plus the guest
  # ingress wildcard record. The OAuth/Konnectivity/Ignition routes are covered
  # by the hub-wide HCP wildcards (see hosted-clusters/oac-dev-infra/values.yaml).
  autoGenerate: true

nodePools:
  - name: compute
    replicas: 2
    agentLabelSelector:
      openstack/resource-class: fc430
      massopen.cloud/cluster: oac-dev-workload1

clusterLabels:
  massopen.cloud/feature-portworx: "true"
