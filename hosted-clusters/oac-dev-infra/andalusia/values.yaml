# Test cluster for GPU VMs: one worker VM on jetty's passthrough node with
# its four H100s. No cluster labels, so no components; kubeadmin login only.
clusterName: andalusia

# Set at creation only: changing it means deleting the HostedCluster.
fips: true

platform:
  type: KubeVirt
  kubevirt:
    infraKubeConfigSecretName: jetty-kubeconfig

services:
  APIServer:
    # Pinned internal LoadBalancer IP: drives the MetalLB pin and the internal
    # API DNS record. Without it the worker VMs' API hostname falls through
    # to the hub router's wildcard, which does not serve :6443, and no node
    # ever joins.
    ipAddress: 10.20.3.16

# jetty has no MetalLB: apps are served through jetty's router.
ingress:
  type: NodePortService
  # jetty's ingress VIP: the chart publishes *.apps.andalusia.<baseDomain>
  # here, and jetty's router passes it through to andalusia's router.
  ipAddress: 10.20.17.11

dns:
  enabled: true
  autoGenerate: true

release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.14-multi

# machineNetwork is jetty's pod network, where the worker VMs live. The
# cluster and service networks must not overlap jetty's.
networking:
  clusterNetwork:
    - cidr: 10.140.0.0/14
  machineNetwork:
    - cidr: 10.132.0.0/14
  serviceNetwork:
    - cidr: 172.33.0.0/16

etcd:
  storageClassName: pure-fb-nfsv4

nodePools:
  - name: gpu
    replicas: 1
    cpu: 64
    memory: 128Gi   # as in the GPU VM benchmarks, with a 300Gi disk
    disk:
      size: 300Gi
      storageClassName: pure-fb-nfsv4
    nodeSelector:
      kubernetes.io/hostname: a0-88-c2-27-c0-d4
    hostDevices:
      - deviceName: nvidia.com/GH100_H100_SXM5_80GB
        count: 4
    qosClass: Guaranteed
    # The replacement VM can't start while the old one holds the GPUs.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
