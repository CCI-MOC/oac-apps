clusterName: oac-prod-workload0
release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.14-multi

oauth:
  mocsso:
    enabled: true

services:
  APIServer:
    # Pinned internal LoadBalancer IP: drives the MetalLB pin, becomes
    # loadBalancer.hostname = api-internal-oac-prod-workload0.<hcpInternalDomain>,
    # and the auto-generated internal API DNS record.
    ipAddress: 10.20.9.13
    # External firewall IP: sets kubeAPIServerDNSName =
    # api-external-oac-prod-workload0.<hcpExternalDomain> and the auto-generated
    # external API DNS record. Shared with ingress below -- :6443 NATs to the
    # API, :80/:443 to the guest ingress.
    externalIpAddress: 129.10.5.104

ingress:
  # Guest ingress wildcard (*.apps.oac-prod-workload0.hcp.oac.massopen.cloud)
  # resolves to this externally reachable IP; the firewall NATs :80/:443 to the
  # guest router's LoadBalancer (10.20.13.10), pinned by MetalLB on the guest
  # cluster via the hosted-ingress app (see poolAddress below).
  externalIpAddress: 129.10.5.104
  # Internal LoadBalancer IP for the guest's default IngressController router.
  # Consumed by the hosted-ingress app (NOT the hosted-cluster chart, which runs
  # on the hub). This is the single source of truth for the guest ingress pool.
  poolAddress: 10.20.13.10/32

dns:
  enabled: true
  # Auto-generate the two API records (internal + external) plus the guest
  # ingress wildcard record. The OAuth/Konnectivity/Ignition routes are covered
  # by the hub-wide HCP wildcards (see hosted-clusters/oac-prod-infra/values.yaml).
  autoGenerate: true

nodePools:
  - name: compute
    replicas: 3
    agentLabelSelector:
      massopen.cloud/cluster: oac-prod-workload0
      openstack/resource-class: fc830
  - name: gpu
    replicas: 5
    agentLabelSelector:
      massopen.cloud/cluster: oac-prod-workload0
      openstack/resource-class: lenovo-sd665nv3-h100
  - name: gpu-a100
    replicas: 2
    agentLabelSelector:
      massopen.cloud/cluster: oac-prod-workload0
      openstack/resource-class: lenovo-sd650nv2-a100

clusterLabels:
  massopen.cloud/feature-portworx: "true"
  massopen.cloud/feature-gpu: "true"
  massopen.cloud/feature-virtualization: "true"
  massopen.cloud/feature-metallb: "true"
  massopen.cloud/feature-user-workloads: "true"
