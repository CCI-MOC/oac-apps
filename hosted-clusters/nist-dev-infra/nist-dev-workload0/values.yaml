clusterName: nist-dev-workload0
release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.18-multi

# One copy of each control-plane component. The hub's three masters also run
# the hub's own control plane, and under FIPS they are short of headroom.
# Immutable: changing it means recreating the HostedCluster.
controllerAvailabilityPolicy: SingleReplica

services:
  APIServer:
    # Pinned internal LoadBalancer IP from the hub's MetalLB pool. Becomes
    # api-internal-nist-dev-workload0.hcp-int.nist.int.massopen.cloud.
    ipAddress: 10.20.19.13

ingress:
  # Internal only: the guest ingress wildcard
  # (*.apps.nist-dev-workload0.hcp.nist.int.massopen.cloud) points here.
  ipAddress: 10.20.20.10
  # The guest router's LoadBalancer IP, pinned by MetalLB on the hosted
  # cluster (hosted-ingress app). On the workers' network (10.20.20.0/23),
  # outside its DHCP range.
  poolAddress: 10.20.20.10/32

dns:
  enabled: true
  autoGenerate: true

nodePools:
  - name: compute
    replicas: 2
    agentLabelSelector:
      openstack/resource-class: fc430
      massopen.cloud/cluster: nist-dev-workload0
    machineConfigs:
      # Both NICs get a default route from DHCP, and configure-ovs builds
      # br-ex on whichever has it first at boot. When that was eno2 (the
      # storage network), the node came up unreachable (2026-10-22). eno2
      # keeps its address and subnet route, but takes no default route or
      # DNS from DHCP.
      - name: 80-eno2-never-default
        files:
          - path: /etc/NetworkManager/system-connections/eno2.nmconnection
            mode: 0600
            contents: |
              [connection]
              id=eno2
              type=ethernet
              interface-name=eno2
              autoconnect-priority=10

              [ipv4]
              method=auto
              never-default=true
              ignore-auto-dns=true

              [ipv6]
              method=auto
              never-default=true
              ignore-auto-dns=true

# Portworx comes in a follow-up: its values need the nodes' names, and its
# TLS class needs tlshd on the nodes. GPUs come with a gpu NodePool.
clusterLabels:
  massopen.cloud/feature-metallb: "true"
