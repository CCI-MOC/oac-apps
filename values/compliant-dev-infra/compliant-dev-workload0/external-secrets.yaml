# The role comes from moc-aws (openshift_oidc_clusters.compliant_dev_workload0).
# It trusts this cluster's service account issuer, so the cluster's OIDC
# documents must be in s3://oac-clusters-oidc/compliant-dev-workload0/ first
# (bootstrap/setup-oidc.sh).
clustersecretstores:
  aws:
    enabled: true
    region: us-east-1
    roleArn: "arn:aws:iam::574733721584:role/eso-compliant-dev-workload0"
    conditions:
      - namespaces:
          - openshift-config
          # Storage (#269): the realm's credentials and CA.
          - portworx
          - object-storage-proxy
          - nfs-tls
