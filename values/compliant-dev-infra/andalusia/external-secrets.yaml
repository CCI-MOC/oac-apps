# The role comes from moc-aws (openshift_oidc_clusters.andalusia). It
# trusts this cluster's service account issuer, so the cluster's OIDC
# documents must be in s3://oac-clusters-oidc/andalusia/ first
# (bootstrap/setup-oidc.sh).
clustersecretstores:
  aws:
    enabled: true
    region: us-east-1
    roleArn: "arn:aws:iam::574733721584:role/eso-andalusia"
    conditions:
      - namespaces:
          - openshift-config
