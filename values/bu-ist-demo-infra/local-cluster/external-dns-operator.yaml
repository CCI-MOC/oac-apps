externaldns:
  - name: aws-route53
    credentials: aws-route53-credentials
    externalSecret:
      remoteKey: cluster/bu-ist-demo-infra/external-dns/aws-route53-credentials
      secretStore: aws-secrets-manager
      secretStoreType: ClusterSecretStore
    domains:
      - filterType: Include
        matchType: Exact
        name: hcp.bu-ist-demo.int.massopen.cloud
      - filterType: Include
        matchType: Exact
        name: hcp-int.bu-ist-demo.int.massopen.cloud
    hostnameAnnotation: Allow
    labelFilter:
      matchLabels:
        massopen.cloud/external-dns: "true"
    zones:
      - Z01324283BCP70QBC712D
      - Z01324643AQ7L5MNYAYT3
