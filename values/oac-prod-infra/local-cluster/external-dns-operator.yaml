externaldns:
  - name: aws-route53
    credentials: aws-route53-credentials
    externalSecret:
      remoteKey: cluster/oac-prod-infra/external-dns/aws-route53-credentials
      secretStore: aws-secrets-manager
      secretStoreType: ClusterSecretStore
    domains:
      - filterType: Include
        matchType: Exact
        name: hcp.oac.massopen.cloud
    hostnameAnnotation: Allow
    labelFilter:
      matchLabels:
        massopen.cloud/external-dns: "true"
    zones:
      - Z10405843KIKQ904M78I0
