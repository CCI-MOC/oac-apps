enabled: false

# moc-r4pcc02u05 and moc-r4pcc02u09 carry four H100 80GB HBM3 each. No A100s
# on this cluster, so that profile stays out of the dashboard rather than
# offering one that could never schedule.
enabledHardwareProfiles:
  - nvidia-h100-gpu

# Prerequisites for migrating this cluster from RHOAI 2.25 to 3.x. Scoped to
# this cluster deliberately: oac-prod-workload0 keeps the chart defaults until
# its own update window is scheduled.
dataScienceCluster:
  components:
    # RHOAI 3.x drops the CodeFlare operator, and the AppWrapper controller
    # with it. Removing it here rather than during the migration keeps it from
    # being left behind, which blocks the ray component from upgrading.
    codeflare: Removed
    modelmeshserving: Removed
    # Unmanaged leaves the existing "default" ClusterQueue in place for the
    # Red Hat Build of Kueue operator, enabled for this cluster in
    # kueue-operator.yaml alongside this file; Removed would take it with it.
    kueue: Unmanaged
  kserve:
    defaultDeploymentMode: RawDeployment
    serving:
      managementState: Removed
