projects:
  - name: aibom
    requester: memalhot@redhat.com
    description: "Gavin will be working on his AIBOM service that essentially captures metadata about different ai workloads"
    groups:
      - name: intern-aibom
        role: edit

  - name: gavin-test
    requester: memalhot@redhat.com
    description: "Code for gavin's aibom service lives in here and watches workloads in other (opted-in) namespaces"
    groups:
      - name: intern-aibom
        role: edit
    # Only here, and only on dev. Nothing on prod sets this, so no Grafana is
    # rendered there at all. The point is to measure the tenancy filter with a
    # real token before any production project switches it on.
    grafana:
      enabled: true
