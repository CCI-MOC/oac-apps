projects:
  - name: aibom
    requester: memalhot@redhat.com
    description: "Gavin will be working on his AIBOM service that essentially captures metadata about different ai workloads"
    groups:
      - name: intern-aibom
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "4"

  - name: gavin-test
    requester: memalhot@redhat.com
    description: "Code for gavin's aibom service lives in here and watches workloads in other (opted-in) namespaces"
    groups:
      - name: intern-aibom
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "4"
    # Only here, and only on dev. Nothing on prod sets this, so no Grafana is
    # rendered there at all. The point is to measure the tenancy filter with a
    # real token before any production project switches it on.
    grafana:
      enabled: true

  - name: asago
    requester: memalhot@redhat.com
    description: "Project Asago is an open-source AI safety and governance orchestration project"
    groups:
      - name: project-asago
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "4"

  - name: eldritchjs-sandbox
    requester: jschless@redhat.com
    description: "EldritchJS tasks"
    groups:
      - name: eldritch-things
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "4"

  - name: uat-project
    requester: asanaull@redhat.com
    description: "AI UAT harness: primary test namespace"
    groups:
      - name: project-uat
        role: edit
      - name: system:serviceaccounts:project-uat-runner
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "999"
        requests.cpu: "128"
        limits.cpu: "128"
        requests.memory: "1Ti"
        limits.memory: "1Ti"
        requests.storage: "150Gi"

  - name: uat-peer
    requester: asanaull@redhat.com
    description: "AI UAT harness: peer namespace for the cross-namespace and peer-load tests"
    groups:
      - name: project-uat
        role: edit
      - name: system:serviceaccounts:project-uat-runner
        role: edit
    quota:
      hard:
        requests.nvidia.com/gpu: "999"
        requests.cpu: "128"
        limits.cpu: "128"
        requests.memory: "1Ti"
        limits.memory: "1Ti"
        requests.storage: "150Gi"

  - name: uat-runner
    requester: asanaull@redhat.com
    description: "AI UAT harness: unattended runner pod, its logs and timesheets"
    groups:
      - name: project-uat
        role: edit
