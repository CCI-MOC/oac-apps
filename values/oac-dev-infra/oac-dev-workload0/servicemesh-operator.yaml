# This cluster runs RHOAI 3.5, which has no Serverless to mesh and serves its
# dashboard through the data-science-gateway. That gateway's istiod waits on
# networking.istio.io/v1, which the Service Mesh 2.6 CRDs do not serve, so
# leaving 2.x installed here keeps the dashboard route from ever being
# created. See rhoai.yaml alongside this file for the version this pairs with.
enabled: false
