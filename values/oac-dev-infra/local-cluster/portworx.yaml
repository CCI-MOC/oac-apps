# Opt out of the FlashBlade .snapshot directory, which is read only and kills
# anything that locks its data dir on start. thanos-receive is the case.
#
# The StorageClass parameter, not the StorageCluster env var: we run PX-CSI and
# PURE_DEFAULT_ENABLE_FB_NFS_SNAPSHOT is Enterprise only. See #123 and #130.
#
# This hub is enough, because MCO runs here: all of Thanos, receive included,
# sits in open-cluster-management-observability on the hub. The clusters under
# it have their own portworx and their own values path, and their prometheus
# instances live happily on .snapshot volumes, so leave them on the default.
#
# New volumes only, so the existing receive PVC still has to be deleted.
portworx:
  snapshot_directory: "false"

externalSecret:
  secretStore: aws-secrets-manager
  remoteKey: "cluster/oac-infra-dev/portworx"

nodes:
  - name: moc-r4pac08u05-s3
    interface: enp7s0f1np1
  - name: moc-r4pac22u15-s1
    interface: enp73s0f1np1
  - name: moc-r4pac22u17-s1
    interface: enp73s0f1np1

network:
  cidr: "10.9.0.0/24"
  range:
    start: "10.9.0.230"
    end: "10.9.0.254"
  routes:
    - dst: 10.3.11.50/32
      gw: 10.9.0.1
