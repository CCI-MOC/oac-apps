placements:
  - name: gpu-clusters
    matchLabels:
      massopen.cloud/feature-gpu: "true"
  - name: github-oauth-clusters
    matchLabels:
      massopen.cloud/feature-github-oauth: "true"
  - name: portworx-clusters
    matchLabels:
      massopen.cloud/feature-portworx: "true"
  - name: virtualization-clusters
    matchLabels:
      massopen.cloud/feature-virtualization: "true"
  - name: rossoctl-clusters
    matchLabels:
      massopen.cloud/feature-rossoctl: "true"
  # Only for clusters whose rhoai.yaml sets kueue: Unmanaged. Running the
  # operator alongside the embedded component makes two controllers fight over
  # the same ClusterQueues.
  - name: kueue-clusters
    matchLabels:
      massopen.cloud/feature-kueue: "true"
