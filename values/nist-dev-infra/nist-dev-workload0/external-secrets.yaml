# The role comes from moc-aws (openshift_oidc_clusters.nist_dev_workload0).
# It trusts this cluster's service account issuer, so the cluster's OIDC
# documents must be in s3://oac-clusters-oidc/nist-dev-workload0/ first
# (bootstrap/setup-oidc.sh).
clustersecretstores:
  aws:
    enabled: true
    region: us-east-1
    roleArn: "arn:aws:iam::574733721584:role/eso-nist-dev-workload0"
    conditions:
      - namespaces:
          - openshift-config
