apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpu-clusters
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: gpu-clusters
              requeueAfterSeconds: 180
          - list:
              elements:
                - component: nvidia-gpu-operator
                - component: nfd-operator
                - component: nvidia-network-operator
                - component: serverless-operator
                - component: servicemesh-operator
                - component: rhoai
  template:
    metadata:
      name: "{{name}}-{{component}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: "charts/{{component}}"
        helm:
          valueFiles:
            - "/values/{{name}}/{{component}}.yaml"
      destination:
        server: "{{server}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
