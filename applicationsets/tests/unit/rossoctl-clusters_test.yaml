suite: rossoctl-clusters ApplicationSet
templates:
  - templates/managed/rossoctl-clusters.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: should render the ApplicationSet with hub-wide then per-cluster value files
    set:
      hubName: oac-dev-infra
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: rossoctl-clusters
      - equal:
          path: spec.template.spec.source.helm.ignoreMissingValueFiles
          value: true
      - equal:
          path: spec.template.spec.source.helm.valueFiles[0]
          value: "/values/oac-dev-infra/{{component}}.yaml"
      - equal:
          path: spec.template.spec.source.helm.valueFiles[1]
          value: "/values/oac-dev-infra/{{name}}/{{component}}.yaml"

  # The generator picks up clusters from the Placement of the same name defined
  # in values/<hub>/local-cluster/acm-placements.yaml. If the two names drift,
  # the ApplicationSet silently matches zero clusters and nothing deploys.
  - it: should select clusters via the rossoctl-clusters placement
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[0].clusterDecisionResource.labelSelector.matchLabels["cluster.open-cluster-management.io/placement"]
          value: rossoctl-clusters

  # The upstream operator subchart renders everything into .Release.Namespace,
  # which ArgoCD takes from this field, so unlike the OLM-based operators the
  # destination namespace is what actually places the operator.
  - it: should install into rossoctl-system
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.template.spec.destination.namespace
          value: rossoctl-system

  # The subchart puts the release name in the Deployment's selector labels, and
  # selectors are immutable. Without a pinned release name every cluster would
  # get a different selector derived from its Application name.
  - it: should pin the helm release name
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.template.spec.source.helm.releaseName
          value: rossoctl
