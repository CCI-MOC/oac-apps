suite: gpu-clusters ApplicationSet
templates:
  - templates/managed/gpu-clusters.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: should render the ApplicationSet with hub-wide then per-cluster value files
    set:
      hubName: oac-dev-infra
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: gpu-clusters
      - equal:
          path: spec.template.spec.source.helm.ignoreMissingValueFiles
          value: true
      - equal:
          path: spec.template.spec.source.helm.valueFiles[0]
          value: "/values/oac-dev-infra/{{component}}.yaml"
      - equal:
          path: spec.template.spec.source.helm.valueFiles[1]
          value: "/values/oac-dev-infra/{{name}}/{{component}}.yaml"

  # The kueue operator ships as its own chart but belongs everywhere RHOAI
  # goes, so it rides the same component list rather than a placement of
  # its own.
  - it: should deploy the kueue operator alongside rhoai
    set:
      hubName: oac-dev-infra
    asserts:
      - contains:
          path: spec.generators[0].matrix.generators[1].list.elements
          content:
            component: kueue-operator
      - contains:
          path: spec.generators[0].matrix.generators[1].list.elements
          content:
            component: rhoai
