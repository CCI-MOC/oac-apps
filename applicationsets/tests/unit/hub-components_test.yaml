suite: hub-components ApplicationSet
templates:
  - templates/hub/hub-components.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: should render the hub-components ApplicationSet
    set:
      hubName: oac-dev-infra
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: hub-components

  - it: should template the child app name and chart path from the component
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: "hub-{{component}}"
      - equal:
          path: spec.template.spec.source.path
          value: "charts/{{component}}"

  - it: should not include per-hub drop-in components in the common set
    set:
      hubName: oac-dev-infra
    asserts:
      - notContains:
          path: spec.generators[0].list.elements
          content:
            component: github-oauth
      - notContains:
          path: spec.generators[0].list.elements
          content:
            component: github-group-sync

  - it: should layer hub-wide then local-cluster value files, both optional
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.template.spec.source.helm.ignoreMissingValueFiles
          value: true
      - equal:
          path: spec.template.spec.source.helm.valueFiles[0]
          value: "/values/oac-dev-infra/{{component}}.yaml"
      - equal:
          path: spec.template.spec.source.helm.valueFiles[1]
          value: "/values/oac-dev-infra/local-cluster/{{component}}.yaml"

  # Same as all-managed-clusters: the ACM observability addon takes over the
  # whole data["config.yaml"] key, and without this Argo and the addon restart
  # prometheus-k8s every few minutes (MOC-issues#630). The hubs run MCO
  # themselves, so they need it as much as the managed clusters do.
  - it: ignores cluster-monitoring-config fields owned by the observability addon
    set:
      hubName: oac-dev-infra
    asserts:
      - contains:
          path: spec.template.spec.ignoreDifferences
          content:
            group: ""
            kind: ConfigMap
            name: cluster-monitoring-config
            namespace: openshift-monitoring
            managedFieldsManagers:
              - endpoint-monitoring-operator

  - it: respects ignoreDifferences during sync so it does not clobber the addon's fields
    set:
      hubName: oac-dev-infra
    asserts:
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: RespectIgnoreDifferences=true
