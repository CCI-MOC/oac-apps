suite: compliance-gpu-clusters ApplicationSet
templates:
  - templates/managed/compliance-gpu-clusters.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: should be gated on the hub's compliance marker
    set:
      hubName: compliant-dev-infra
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[0].matrix.generators[0].git.files[0].path
          value: "hosted-clusters/compliant-dev-infra/compliance.yaml"
      - lengthEqual:
          path: spec.generators[0].matrix.generators[0].matrix.generators[1].list.elements
          count: 2

  - it: should pick managed clusters by their GPU Operator values
    set:
      hubName: compliant-dev-infra
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[1].matrix.generators[0].clusterDecisionResource.labelSelector.matchLabels["cluster.open-cluster-management.io/placement"]
          value: all-managed-clusters
      - equal:
          path: spec.generators[0].matrix.generators[1].matrix.generators[1].git.files[0].path
          value: "values/compliant-dev-infra/{{name}}/nvidia-gpu-operator.yaml"
      - equal:
          path: spec.generators[0].matrix.generators[1].matrix.generators[1].git.pathParamPrefix
          value: cluster

  - it: should deploy to the server ACM gives each cluster and keep resources on deletion
    set:
      hubName: compliant-dev-infra
    asserts:
      - equal:
          path: spec.template.spec.destination.server
          value: "{{server}}"
      - equal:
          path: spec.template.metadata.name
          value: "{{name}}-{{component}}"
      - equal:
          path: spec.syncPolicy.preserveResourcesOnDeletion
          value: true
      - equal:
          path: spec.template.spec.source.helm.releaseName
          value: "{{component}}"
