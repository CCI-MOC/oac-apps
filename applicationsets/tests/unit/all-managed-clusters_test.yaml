suite: all-managed-clusters ApplicationSet
templates:
  - templates/managed/all-managed-clusters.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: should render the ApplicationSet with hub-wide then per-cluster value files
    set:
      hubName: oac-dev-infra
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ApplicationSet
          apiVersion: argoproj.io/v1alpha1
          name: all-managed-clusters
      - equal:
          path: spec.template.spec.source.helm.ignoreMissingValueFiles
          value: true
      - equal:
          path: spec.template.spec.source.helm.valueFiles[0]
          value: "/values/oac-dev-infra/{{component}}.yaml"
      - equal:
          path: spec.template.spec.source.helm.valueFiles[1]
          value: "/values/oac-dev-infra/{{name}}/{{component}}.yaml"

  # Metrics have to sit local to the workloads, so this goes to the managed
  # clusters rather than to the hub. It is the deliberate exception to the
  # otherwise hub-central plan.
  - it: includes user workload monitoring in the component list
    set:
      hubName: oac-dev-infra
    asserts:
      - contains:
          path: spec.generators[0].matrix.generators[1].list.elements
          content:
            component: user-workload-monitoring

  # The Grafana operator has to run where the projects are, since that is where
  # user-projects puts the Grafana resources it reconciles.
  - it: includes the grafana operator in the component list
    set:
      hubName: oac-dev-infra
    asserts:
      - contains:
          path: spec.generators[0].matrix.generators[1].list.elements
          content:
            component: grafana-operator
