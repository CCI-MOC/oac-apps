{{- $hub := required "hubName must be set" .Values.hubName }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: all-managed-clusters
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: all-managed-clusters
              requeueAfterSeconds: 180
          - list:
              elements:
                - component: no-self-provisioners
                - component: external-secrets
                - component: cert-manager
                - component: cluster-certificates
                - component: oac-simple-rbac
                - component: user-projects
                - component: moc-metrics-collector
                - component: user-workload-monitoring
                - component: cluster-observability-operator
                - component: restrict-tenant-networks
                - component: dns-operator-config
                - component: grafana-operator
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{`{{name}}`}}-{{`{{component}}`}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: "charts/{{`{{component}}`}}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "/values/{{ $hub }}/{{`{{component}}`}}.yaml"
            - "/values/{{ $hub }}/{{`{{name}}`}}/{{`{{component}}`}}.yaml"
      destination:
        server: "{{`{{server}}`}}"
      # The ACM observability addon also writes cluster-monitoring-config and
      # takes exclusive ownership of the whole data["config.yaml"] key when it
      # does, since that key is a single opaque string rather than structured
      # fields. Without this, Argo and the addon fight over that key and
      # restart prometheus-k8s every few minutes. The tradeoff: once the addon
      # owns the key, Argo also stops pushing our own retention/volume edits
      # to it, since it can't tell those apart from the addon's content in the
      # same field. Getting such a change through needs this entry removed for
      # one sync, then restored.
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: cluster-monitoring-config
          namespace: openshift-monitoring
          managedFieldsManagers:
            - endpoint-monitoring-operator
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
