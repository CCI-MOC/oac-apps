{{- $hub := required "hubName must be set" .Values.hubName }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hosted-clusters
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        revision: main
        directories:
          - path: "hosted-clusters/{{ $hub }}/*"
  template:
    metadata:
      name: "cluster-{{`{{.path.basename}}`}}"
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: charts/hosted-cluster
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            # Hub-level defaults (e.g. baseDomain, managementCluster) shared by
            # every hosted cluster on this hub, layered under the per-cluster
            # values.yaml so a cluster may still override them.
            - "/hosted-clusters/{{ $hub }}/values.yaml"
            - "/{{`{{.path.path}}`}}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: clusters
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
