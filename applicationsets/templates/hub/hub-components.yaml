{{- $hub := required "hubName must be set" .Values.hubName }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-components
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - component: no-self-provisioners
          - component: openshift-gitops
          - component: nmstate
          - component: external-secrets
          - component: lvmcluster
          - component: metallb
          - component: cert-manager
          - component: patch-operator
          - component: node-labels
          - component: portworx
          - component: oac-simple-rbac
          - component: external-dns-operator
          - component: cluster-certificates
          - component: acm
          - component: hcp-config
          - component: acm-gitops-integration
          - component: acm-placements
          - component: acm-observability
          - component: cluster-observability-operator
          - component: cluster-version
          - component: object-storage-proxy
          - component: dns-operator-config
          - component: moc-metrics-collector
          # The all-managed-clusters placement selects local-cluster
          # DoesNotExist, so the hubs never got this and their own platform
          # prometheus still mounts emptyDir.
          - component: user-workload-monitoring
  template:
    metadata:
      name: "hub-{{`{{component}}`}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: "charts/{{`{{component}}`}}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "/values/{{ $hub }}/{{`{{component}}`}}.yaml"
            - "/values/{{ $hub }}/local-cluster/{{`{{component}}`}}.yaml"
      destination:
        server: https://kubernetes.default.svc
      # Same reason as in all-managed-clusters.yaml: the ACM observability
      # addon owns the whole data["config.yaml"] key once it writes, and
      # without this Argo and the addon restart prometheus-k8s every few
      # minutes. The hubs need it too, they run MCO themselves.
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: cluster-monitoring-config
          namespace: openshift-monitoring
          managedFieldsManagers:
            - endpoint-monitoring-operator
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
