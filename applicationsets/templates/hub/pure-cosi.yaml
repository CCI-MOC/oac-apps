{{- $hub := required "hubName must be set" .Values.hubName }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-pure-cosi
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/CCI-MOC/oac-apps.git
    targetRevision: main
    path: "kustomize/pure-cosi/overlays/{{ $hub }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: portworx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
