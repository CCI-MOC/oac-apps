{{- $hub := required "hubName must be set" .Values.hubName }}
# Compliance charts for the hub itself. As with hosted-cluster-compliance,
# hosted-clusters/<hub>/compliance.yaml marks the hub compliant; without it
# this generates nothing. This covers the hub only: the scans and their
# tailoring, node and platform hardening, audit logs, etcd backups, ACS,
# NFS over TLS and guardrails for namespaces no chart owns. Each reads
# values/<hub>/local-cluster/<component>.yaml. On hosted workers the
# operator's AIDE init container needs /etc/kubernetes/static-pod-resources,
# which they lack (RFE-8168); compliance-node-hardening creates it empty, and
# with that file integrity runs on compliant-dev-workload0's workers.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-components-compliance
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/CCI-MOC/oac-apps.git
              revision: main
              files:
                - path: "hosted-clusters/{{ $hub }}/compliance.yaml"
          - list:
              elements:
                - component: file-integrity
                - component: compliance-operator
                - component: compliance-hub-policy
                - component: compliance-node-hardening
                - component: platform-hardening
                - component: audit-logging
                - component: etcd-backup
                - component: rhacs
                - component: nfs-tls
                - component: namespace-guardrails-app
  template:
    metadata:
      name: "hub-{{`{{component}}`}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: "charts/{{`{{component}}`}}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "/values/{{ $hub }}/{{`{{component}}`}}.yaml"
            - "/values/{{ $hub }}/local-cluster/{{`{{component}}`}}.yaml"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
