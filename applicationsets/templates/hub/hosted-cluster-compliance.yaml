{{- $hub := required "hubName must be set" .Values.hubName }}
# Hub-side compliance resources for hosted clusters. Compliance is a
# property of the hub, not of a cluster: hosted-clusters/<hub>/compliance.yaml
# marks the hub compliant (it may be empty), and then every hosted cluster
# on it gets them. A cluster may override values in its own compliance.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hosted-cluster-compliance
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/CCI-MOC/oac-apps.git
              revision: main
              files:
                - path: "hosted-clusters/{{ $hub }}/compliance.yaml"
          # Both git generators set .path; the prefix keeps the cluster's
          # apart from the marker's.
          - git:
              repoURL: https://github.com/CCI-MOC/oac-apps.git
              revision: main
              pathParamPrefix: cluster
              directories:
                - path: "hosted-clusters/{{ $hub }}/*"
  template:
    metadata:
      name: "cluster-{{`{{.cluster.path.basename}}`}}-compliance"
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: charts/hosted-cluster-compliance
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "/hosted-clusters/{{ $hub }}/compliance.yaml"
            - "/{{`{{.cluster.path.path}}`}}/compliance.yaml"
          parameters:
            - name: clusterName
              value: "{{`{{.cluster.path.basename}}`}}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
