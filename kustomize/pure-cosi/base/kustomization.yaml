apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/CCI-MOC/pure-cosi/k8s?ref=v0.1.1

patches:
  - target:
      kind: ClusterRoleBinding
      name: pure-cosi-driver-binding
    patch: |
      - op: replace
        path: /subjects/0/namespace
        value: portworx
