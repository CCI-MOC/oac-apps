apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      kind: BucketClass
      name: fb-bucket
    patch: |-
      - op: replace
        path: /parameters/s3Endpoint
        value: s3.nist-dev-infra.nist.int.massopen.cloud

  - target:
      kind: ExternalSecret
      name: pure-cosi-config
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: cluster/nist-dev-infra/pure-cosi
