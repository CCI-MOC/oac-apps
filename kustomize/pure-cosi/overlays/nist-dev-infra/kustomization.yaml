apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# A compliant hub, so all three parts use the FIPS images.
images:
  - name: ghcr.io/cci-moc/pure-cosi
    newTag: v0.2.0
  - name: registry.k8s.io/sig-storage/objectstorage-sidecar
    newName: ghcr.io/cci-moc/pure-cosi/cosi-sidecar
    newTag: v0.2.0
  - name: gcr.io/k8s-staging-sig-storage/objectstorage-controller
    newName: ghcr.io/cci-moc/pure-cosi/cosi-controller
    newTag: v0.2.0

patches:
  - target:
      kind: BucketClass
      name: fb-bucket
    patch: |-
      - op: replace
        path: /parameters/s3Endpoint
        value: s3.nist-dev-infra.nist.int.massopen.cloud

  - target:
      kind: ExternalSecret
      name: pure-cosi-config
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: cluster/nist-dev-infra/pure-cosi
