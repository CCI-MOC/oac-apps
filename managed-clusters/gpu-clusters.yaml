apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpu-clusters
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: gpu-clusters
              requeueAfterSeconds: 180
          - list:
              elements:
                - component: nvidia-gpu-operator
                  syncWave: "0"
                - component: nfd-operator
                  syncWave: "0"
                - component: "nvidia-network-operator"
                  syncWave: "0"
                - component: serverless-operator
                  syncWave: "0"
                - component: servicemesh-operator
                  syncWave: "0"
                - component: rhoai
                  syncWave: "1"
  template:
    metadata:
      name: "{{name}}-{{component}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/CCI-MOC/oac-apps.git
        targetRevision: main
        path: "charts/{{component}}"
        helm:
          valueFiles:
            - "/clusters/{{name}}/values-{{component}}.yaml"
      destination:
        server: "{{server}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
